function buildFathomTodayTable(items,todayD,isCurMo){
  const wrap=document.createElement('div');
  wrap.style.cssText='padding:0 0 8px';
  // Date label
  const now=new Date();
  const lbl=document.createElement('div');
  lbl.style.cssText='font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:8px 14px 6px';
  lbl.textContent=isCurMo?`TODAY — ${now.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase()}`:'(PAST MONTH)';
  wrap.appendChild(lbl);
  const t=document.createElement('table');
  t.style.cssText='width:100%;border-collapse:collapse';
  const tb=document.createElement('tbody');
  items.forEach(item=>{
    // calc month done
    let done=0,total=0;
    const days=dim(CY,CM);
    for(let d=1;d<=days;d++){
      const dow=new Date(CY,CM,d).getDay();
      const foff=item.freq&&item.freq.length<7&&!item.freq.includes(dow);
      if(!foff){if(isChkFathom(item.id,d))done++;total++;}
    }
    const chk=todayD>0?isChkFathom(item.id,todayD):false;
    const tr=document.createElement('tr');
    tr.style.cssText='border-bottom:1px solid var(--border2)';
    // Question
    const tdQ=document.createElement('td');
    tdQ.style.cssText='padding:10px 8px 10px 14px;font-size:12px;color:var(--text2);font-weight:500;line-height:1.3';
    tdQ.textContent=item.name;
    // Checkbox
    const tdC=document.createElement('td');
    tdC.style.cssText='padding:8px 6px;text-align:center;width:44px';
    if(todayD>0){
      tdC.innerHTML=`<div class="chk-box${chk?' checked':''}" id="fhzcb-${item.id}-${todayD}" style="width:34px;height:34px;border-radius:8px;margin:0 auto;background:${chk?FATHOM_COLOR:'transparent'};border:2px solid ${chk?FATHOM_COLOR:'var(--border)'}"></div>`;
      tdC.onclick=()=>doFathomToggle(item.id,todayD);
      tdC.style.cursor='pointer';
    }
    // Month count
    const tdD=document.createElement('td');
    tdD.style.cssText='padding:8px 14px 8px 4px;text-align:right;width:60px;font-size:11px;color:var(--text3);white-space:nowrap';
    tdD.innerHTML=`${done}<span style="font-size:9px">/${total}</span>`;
    tr.appendChild(tdQ);tr.appendChild(tdC);tr.appendChild(tdD);
    tb.appendChild(tr);
  });
  t.appendChild(tb);wrap.appendChild(t);
  return wrap;
}
function mkFathomGrid(){
  const items=activeFathomItems();
  const isCurMo=CY===new Date().getFullYear()&&CM===new Date().getMonth();
  const todayD=isCurMo?new Date().getDate():-1;
  const isPastMonth=CY<new Date().getFullYear()||(CY===new Date().getFullYear()&&CM<new Date().getMonth());
  const days=dim(CY,CM);
  const {done:mDone,poss:mPoss,hasData:mHas}=fathomMonthStats();

  const card=document.createElement('div');
  card.className='grid-card'+(fathomEditMode?' edit-mode':'');
  card.id='fathom-card';

  // Bar
  const bar=document.createElement('div');
  bar.className='grid-bar';
  bar.innerHTML=`
    <span class="grid-bar-l" style="display:flex;align-items:center;gap:8px">
      <span style="font-weight:800;letter-spacing:.14em;color:var(--text1)">FATHOM</span>
    </span>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="fathom-hdr-grade" style="font-size:11px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums">${mHas?`${mDone}/${mPoss}`:''}</span>
      ${fathomEditMode?`<button class="add-hbt-btn" style="display:inline-flex" onclick="addFathomItem()">+ Add Item</button>`:''}
      <button class="btn ${fathomEditMode?'btn-on':''}" onclick="toggleFathomEdit()">${fathomEditMode?'&#10003; Done':'&#9998; Edit'}</button>
    </div>`;
  card.appendChild(bar);

  // Mobile: compact today-only view instead of full 30-col table
  if(window.innerWidth<=768&&!fathomEditMode){
    card.appendChild(buildFathomTodayTable(items,todayD,isCurMo));
    return card;
  }

  const scroll=document.createElement('div');
  scroll.className='grid-scroll';
  scroll.id='fathom-scroll';

  const t=document.createElement('table');
  t.className='tbl';
  t.id='fathom-tbl';
  // Set explicit min-width in px so mobile browsers can't collapse it via bad max-content calc,
  // and so the name column never gets compressed below its intended width (names must never clip).
  t.style.minWidth=((fathomEditMode?240:140)+days*34+56+56)+'px';
  const cg=document.createElement('colgroup');
  const cH=document.createElement('col');cH.style.width=fathomEditMode?'240px':'140px';cg.appendChild(cH);
  const cD=document.createElement('col');cD.span=days;cg.appendChild(cD); // no width: day cols share space equally, matching the Habits table
  const cDn=document.createElement('col');cDn.style.width='56px';cg.appendChild(cDn);
  const cP=document.createElement('col');cP.style.width='56px';cg.appendChild(cP);
  t.appendChild(cg);

  const thead=document.createElement('thead');

  // Row A: daily % row  +  Done/SE% spanning 3 rows
  const rA=document.createElement('tr');
  const cornerA=document.createElement('th');
  cornerA.className='sl st';cornerA.rowSpan=3;
  cornerA.style.cssText='padding:6px 8px;border-bottom:2px solid var(--border);vertical-align:bottom';
  cornerA.innerHTML='';
  rA.appendChild(cornerA);
  for(let d=1;d<=days;d++){
    const dow=new Date(CY,CM,d).getDay();
    const isToday=d===todayD,isFuture=false,isWeekStart=dow===1&&d>1;
    const td=document.createElement('td');
    td.id=`fdp-${d}`;
    td.className='st hz-chk-c'+(isToday?' today-col':'')+(isWeekStart?' hz-week-sep':'');
    td.style.cssText=`padding:3px 2px;cursor:default;background:${isToday?'var(--today-bg)':'var(--surface2)'};border-bottom:1px solid var(--border2)`;
    if(isFuture||!items.length) td.innerHTML=`<span style="color:var(--text3);font-size:9px">—</span>`;
    else td.innerHTML=_fDayCount(d);
    rA.appendChild(td);
  }
  const donePh=document.createElement('th');
  donePh.className='sr sr-1 st hz-sum-th first-sum';donePh.rowSpan=3;donePh.style.verticalAlign='bottom';donePh.textContent='Done';
  rA.appendChild(donePh);
  thead.appendChild(rA);

  // Row B: week labels
  const rB=document.createElement('tr');
  const fWkSpans=getWeekSpans(CY,CM);
  const fWkData={};
  fWkSpans.forEach(s=>{const lastD=todayD>0?Math.min(s.end,todayD):(isPastMonth?s.end:0);let done=0,total=0;for(let d=s.start;d<=lastD;d++){items.forEach(it=>{if(!isSkipFathom(it.id,d)){total++;if(isChkFathom(it.id,d))done++;}});}fWkData[s.week]=total>0?{pct:Math.round(done/total*100),done,total}:null;});
  fWkSpans.forEach((ws,wi)=>{
    const th=document.createElement('th');
    th.className='st hz-week-hdr-th'+(wi>0?' week-start-sep':'');
    th.colSpan=ws.end-ws.start+1;
    th.style.position='relative';
    const wd=fWkData[ws.week];
    const wg=!!wd; // "is there anything to show yet", not a grade
    const started=todayD<0||ws.start<=todayD;
    const bStyle=wg?`background:var(--surface2);color:var(--text2);border:1px solid var(--border2)`:`color:var(--text3);border:1px solid var(--border2)`;
    const wAarHas=!!getWeekAAR(ws.week);
    th.innerHTML=`Week ${ws.week}${started?`<span class="wk-badge" style="${bStyle}">${wg?wd.done+'/'+wd.total:'—'}</span>`:''}<button id="week-aar-btn-${ws.week}-f" class="aar-btn${wAarHas?' aar-has':''}" onclick="event.stopPropagation();openWeekAAR(${ws.week})" title="Weekly Review" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);margin:0;padding:1px 4px;display:block">✎</button>`;
    rB.appendChild(th);
  });
  thead.appendChild(rB);

  // Row C: day numbers + DOW
  const rC=document.createElement('tr');
  for(let d=1;d<=days;d++){
    const dow=new Date(CY,CM,d).getDay();
    const isToday=d===todayD,isWeekStart=dow===1&&d>1;
    const th=document.createElement('th');
    th.className='st hz-day-th'+(isToday?' today-col':'')+(isWeekStart?' hz-week-sep':'');
    th.innerHTML=`<span class="hd-num">${d}</span><span class="hd-dow">${DOW[dow]}</span>`;
    rC.appendChild(th);
  }
  thead.appendChild(rC);
  t.appendChild(thead);

  const tbody=document.createElement('tbody');
  items.forEach(item=>{
    const tr=document.createElement('tr');
    tr.className='hz-row';
    const nameTd=document.createElement('td');
    nameTd.className='sl hz-habit-td';
    if(fathomEditMode){
      const ifreq=item.freq&&item.freq.length<7?item.freq:[0,1,2,3,4,5,6];
      const ifreqBtns=['S','M','T','W','T','F','S'].map((lbl,i)=>`<button class="freq-day-btn${ifreq.includes(i)?' freq-on-fathom':''}" onclick="event.stopPropagation();toggleFathomFreqDay('${item.id}',${i})" title="${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}">${lbl}</button>`).join('');
      nameTd.innerHTML=`<div style="display:flex;flex-direction:column;gap:4px;">
        <div style="display:flex;align-items:center;gap:2px;">
          <span class="dnd-grip" style="margin-right:1px">⠿</span>
          <input class="hbt-in" style="text-align:left;flex:1;min-width:0;width:auto" value="${esc(item.name)}" onchange="renameFathomItem('${item.id}',this.value)" onclick="event.stopPropagation()" onfocus="expandNameInput(this)" onblur="collapseNameInput(this)"/>
        </div>
        <div style="display:flex;align-items:center;gap:4px;padding-left:16px">
          <span class="sd-pill" onclick="event.stopPropagation();openDatePicker(this)" title="Start date">⊙ ${fmtDate(item.startDate||todayStr())}<input type="date" value="${item.startDate||todayStr()}" onchange="changeFathomStartDate('${item.id}',this.value)"/></span>
          <button class="arch-btn" style="display:inline" onclick="archiveFathomItem('${item.id}')" title="Archive">⊟</button>
          <button class="clr-btn" style="display:inline" onclick="clearFathomHistory('${item.id}')" title="Clear history">⊗</button>
          <button class="del-btn" style="display:inline" onclick="confirmDeleteFathomItem('${item.id}')" title="Delete permanently">✕</button>
        </div>
        <div style="display:flex;gap:2px;padding-left:16px">${ifreqBtns}</div>
      </div>`;
      tr.draggable=true;
      tr.ondragstart=e=>{_dg={type:'fathom',fid:item.id};tr.classList.add('dnd-drag');e.dataTransfer.effectAllowed='move';e.stopPropagation()};
      tr.ondragend=()=>{tr.classList.remove('dnd-drag');_dg=null};
      tr.ondragover=e=>{
        if(_dg?.type==='fathom'&&_dg.fid!==item.id){
          e.preventDefault();
          const{top,height}=tr.getBoundingClientRect();
          tr.classList.remove('dnd-ins-t','dnd-ins-b');
          tr.classList.add(e.clientY<top+height/2?'dnd-ins-t':'dnd-ins-b');
        }
      };
      tr.ondragleave=()=>{tr.classList.remove('dnd-ins-t','dnd-ins-b')};
      tr.ondrop=e=>{
        e.preventDefault();
        const{top,height}=tr.getBoundingClientRect();
        tr.classList.remove('dnd-ins-t','dnd-ins-b');
        _dropFathomItem(item.id,e.clientY<top+height/2);
      };
    } else {
      nameTd.innerHTML=`<div class="hz-habit-name">${esc(item.name)}</div>`;
    }
    tr.appendChild(nameTd);
    let rowDone=0,rowTotal=0;
    for(let d=1;d<=days;d++){
      const dow=new Date(CY,CM,d).getDay();
      const isToday=d===todayD,isFuture=isCurMo&&d>todayD,isWeekStart=dow===1&&d>1;
      const chk=isChkFathom(item.id,d);
      const skp=isSkipFathom(item.id,d);
      const foff=item.freq&&item.freq.length<7&&!item.freq.includes(dow);
      if(!isFuture&&!skp&&!foff){rowDone+=chk?1:0;rowTotal++;}
      const td=document.createElement('td');
      td.className='hz-chk-c'+(isToday?' today-col':'')+(isFuture?' future':'')+(isWeekStart?' hz-week-sep':'')+(foff?' freq-off-c':'');
      td.id=`fhzcc-${item.id}-${d}`;
      if(!isFuture&&!foff) td.onclick=()=>doFathomToggle(item.id,d);
      td.innerHTML=`<div class="chk-box${chk?' checked':skp?' skipped':foff?' freq-off':''}" id="fhzcb-${item.id}-${d}" style="background:${chk?FATHOM_COLOR:'transparent'};border-color:${chk?FATHOM_COLOR:'var(--border)'}"></div>`;
      tr.appendChild(td);
    }
    const doneTd=document.createElement('td');doneTd.className='sr sr-1 hz-sum-td first-sum';doneTd.id=`fhzds-${item.id}`;
    doneTd.innerHTML=`${rowDone}<span style="color:var(--text3);font-size:9px">/${rowTotal}</span>`;
    tr.appendChild(doneTd);
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  scroll.appendChild(t);
  _bindTouchScroll(scroll);
  card.appendChild(scroll);
  if(fathomEditMode){const ap=mkArchivedFathomPanel();if(ap)card.appendChild(ap);}
  return card;
}

function doFathomToggle(iid,day){
  toggleFathom(iid,day);
  const chk=isChkFathom(iid,day);
  const skp=isSkipFathom(iid,day);
  const box=document.getElementById(`fhzcb-${iid}-${day}`);
  if(box){
    box.classList.toggle('checked',chk);
    box.classList.toggle('skipped',skp);
    box.style.background=chk?FATHOM_COLOR:'transparent';
    box.style.borderColor=chk?FATHOM_COLOR:'var(--border)';
    box.classList.remove('chk-pop');
    if(chk) requestAnimationFrame(()=>box.classList.add('chk-pop'));
  }
  // Update the day's count
  const dpEl=document.getElementById(`fdp-${day}`);
  if(dpEl) dpEl.innerHTML=_fDayCount(day);
  // Update item row summary
  const isCurMo=CY===new Date().getFullYear()&&CM===new Date().getMonth();
  const lastD=isCurMo?new Date().getDate():dim(CY,CM);
  let rowDone=0,rowTotal=0;
  for(let d=1;d<=lastD;d++){if(!isSkipFathom(iid,d)){if(isChkFathom(iid,d))rowDone++;rowTotal++;}}
  const ds=document.getElementById(`fhzds-${iid}`);
  if(ds) ds.innerHTML=`${rowDone}<span style="color:var(--text3);font-size:9px">/${rowTotal}</span>`;
  updFathomHeader();
  updStats();
  updTide();
}

function doFathomSkipToggle(iid,day){
  skipToggleFathom(iid,day);
  const chk=isChkFathom(iid,day);
  const skp=isSkipFathom(iid,day);
  const box=document.getElementById(`fhzcb-${iid}-${day}`);
  if(box){
    box.classList.toggle('checked',chk);

  const lastD=isCurMo?new Date().getDate():dim(CY,CM);
  let rowDone=0,rowTotal=0;
  for(let d=1;d<=lastD;d++){if(!isSkipFathom(iid,d)){if(isChkFathom(iid,d))rowDone++;rowTotal++;}}

  if(ds) ds.innerHTML=`${rowDone}<span style="color:var(--text3);font-size:9px">/${rowTotal}</span>`;

function updFathomHeader(){

function addFathomItem(){
  if(!D.fathom) D.fathom={items:[]};
  const item={id:uid(),name:'New Item',startDate:todayStr()};
  D.fathom.items.push(item);
  applyFathomStartDateSkips(item.id,item.startDate);
  save();render();
}
function renameFathomItem(id,name){
  const item=D.fathom?.items?.find(i=>i.id===id);
  if(item){item.name=name.trim()||item.name;save();}
}
function toggleFathomFreqDay(id,dow){
  const item=D.fathom?.items?.find(i=>i.id===id);
  if(item){
    if(!item.freq||item.freq.length>=7) item.freq=[0,1,2,3,4,5,6];
    const idx=item.freq.indexOf(dow);
    if(idx>=0){if(item.freq.length>1)item.freq.splice(idx,1);}
    else{item.freq.push(dow);item.freq.sort((a,b)=>a-b);}
    save();render();
  }
}
function changeFathomStartDate(id,date){
  const item=D.fathom?.items?.find(i=>i.id===id);
  if(item){item.startDate=date||todayStr();applyFathomStartDateSkips(item.id,item.startDate);save();render();}
}
function clearFathomHistory(id){
  const item=(D.fathom?.items||[]).find(i=>i.id===id);
  const name=item?`"${item.name}"`:'this Fathom item';
  if(!confirm(`Clear all logged history for ${name}? The item stays active but all past completions and skips are erased.\n\nThis cannot be undone.`)) return;
  Object.values(D.months).forEach(mo=>{
    if(mo.fathomCompletions?.[id]) mo.fathomCompletions[id]={};
    if(mo.fathomSkips?.[id]) mo.fathomSkips[id]={};
  });
  save();render();
}
function archiveFathomItem(id){
  const item=(D.fathom?.items||[]).find(i=>i.id===id);
  if(item){item.archived=true;_lastArchived={type:'fathom',id};save();_showArchiveToast('Fathom item archived');render();}
}
function restoreFathomItem(id){
  const item=(D.fathom?.items||[]).find(i=>i.id===id);
  if(item){item.archived=false;save();render();}
}
function confirmDeleteFathomItem(id){
  const item=(D.fathom?.items||[]).find(i=>i.id===id);
  const name=item?`"${item.name}"`:'this Fathom item';
  const hasHist=Object.values(D.months).some(mo=>mo.fathomCompletions?.[id]&&Object.values(mo.fathomCompletions[id]).some(v=>v));
  const msg=hasHist?`Permanently delete ${name} and all its completion history?\n\nThis cannot be undone.`:`Delete ${name}?\n\nThis cannot be undone.`;
  if(confirm(msg)){D.fathom.items=(D.fathom.items||[]).filter(i=>i.id!==id);save();render();}
}
function deleteFathomItem(id){confirmDeleteFathomItem(id);}
function mkArchivedFathomPanel(){
  const allArchived=(D.fathom?.items||[]).filter(i=>i.archived);
  if(!allArchived.length) return null;
  const panel=document.createElement('div');
  panel.className='arch-panel';
  panel.innerHTML=`<div class="arch-panel-title">Archived Fathom Items</div>`+
    allArchived.map(item=>`<div class="arch-item">
      <div class="arch-item-name">${esc(item.name)}</div>
      <button class="restore-btn" onclick="restoreFathomItem('${item.id}')">Restore</button>
      <button class="purge-btn" onclick="confirmDeleteFathomItem('${item.id}')">Delete</button>
    </div>`).join('');
  return panel;
}

function _updSelBar(){
  const bar=document.getElementById('sel-bar');
  const cnt=document.getElementById('sel-count');
  if(!bar) return;
  if(_sel.size>0){bar.style.display='flex';if(cnt)cnt.textContent=`${_sel.size} cell${_sel.size>1?'s':''} selected`;}
  else bar.style.display='none';
}
function _selClear(){
  _sel.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('sel')});
  _sel.clear();_updSelBar();
}
function _parseSel(id){
  const m=id.match(/^(fhzcc|hzcc|cc)-(.+)-(\d+)$/);
  if(!m) return null;
  return {type:m[1]==='fhzcc'?'fathom':'habit',id:m[2],day:+m[3]};
}
function _setHabitState(hid,day,done,skip){
  const mo=md(CY,CM);
  if(!mo.completions[hid])mo.completions[hid]={};
  if(!mo.skips[hid])mo.skips[hid]={};
  mo.completions[hid][day]=done?habitTarget(hid,day):0; // drag-mark fills to the full daily target
  mo.skips[hid][day]=skip;
}
function _setFathomState(iid,day,done,skip){
  const mo=fathomMd();
  if(!mo.fathomCompletions[iid])mo.fathomCompletions[iid]={};
  if(!mo.fathomSkips[iid])mo.fathomSkips[iid]={};
  mo.fathomCompletions[iid][day]=done;
  mo.fathomSkips[iid][day]=skip;
}
function _selAddCell(el){
  if(!el||!el.id||el.classList.contains('future')||!_parseSel(el.id)) return;
  _sel.add(el.id);el.classList.add('sel');
}

// Drag-to-select + long-press-to-skip (capture phase so it runs before onclick)
document.addEventListener('mousedown',e=>{
  if(e.button!==0) return; // ignore right/middle click (right-click opens the comment popup)
  const c=e.target.closest('.chk-c:not(.future),.hz-chk-c:not(.future)');
  if(!c||!_parseSel(c.id)) return;
  _selMD=true;_selDrag=false;_selBlock=false;_selAnchor=c.id;
  clearTimeout(_lpTimer);_lpFired=false;
  _lpTimer=setTimeout(()=>{
    if(_selDrag) return;
    _lpFired=true;
    const p=_parseSel(c.id);
    if(!p) return;
    if(p.type==='fathom') doFathomSkipToggle(p.id,p.day);
    else doSkipToggle(p.id,p.day,c.dataset.color||'var(--accent)');
  },500);
},true);

document.addEventListener('mouseover',e=>{
  if(!_selMD) return;
  const c=e.target.closest('.chk-c:not(.future),.hz-chk-c:not(.future)');
  if(!c||!_parseSel(c.id)) return;
  if(!_selDrag){
    _selDrag=true;_selBlock=true;_selClear();_selPath=[];
    clearTimeout(_lpTimer);_lpTimer=null;
    if(_selAnchor){const a=document.getElementById(_selAnchor);if(a){_selAddCell(a);_selPath=[a.id];}}
  }
  const idx=_selPath.indexOf(c.id);
  if(idx!==-1){
    // backtrack: keep this cell, remove everything after it
    const removed=_selPath.splice(idx+1);
    removed.forEach(id=>{_sel.delete(id);const el=document.getElementById(id);if(el)el.classList.remove('sel');});
  } else {
    _selAddCell(c);_selPath.push(c.id);
  }
  _updSelBar();
},true);

document.addEventListener('mouseup',()=>{_selMD=false;clearTimeout(_lpTimer);_lpTimer=null;},true);

document.addEventListener('click',e=>{
  if(_lpFired){_lpFired=false;e.stopPropagation();return;}
  if(_selBlock){_selBlock=false;e.stopPropagation();return;}
  const c=e.target.closest('.chk-c:not(.future),.hz-chk-c:not(.future)');
  if(e.shiftKey&&c&&_parseSel(c.id)){
    e.stopPropagation();
    if(_sel.has(c.id)){_sel.delete(c.id);c.classList.remove('sel');}
    else _selAddCell(c);
    _updSelBar();return;
  }
  if(_sel.size>0) _selClear();
},true);

// Space = cycle all selected cells
document.addEventListener('keydown',e=>{
  if(e.code==='Escape'){_selClear();if(editMode||fathomEditMode){editMode=false;fathomEditMode=false;render();}return;}
  if(e.code!=='Space'||_sel.size===0) return;
  const t=e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||e.target.isContentEditable) return;
  e.preventDefault();
  // Tally states across selection
  let ec=0,dc=0,sc=0;
  _sel.forEach(id=>{
    const p=_parseSel(id);if(!p) return;
    const done=p.type==='fathom'?isChkFathom(p.id,p.day):isChk(p.id,p.day);
    const skip=p.type==='fathom'?isSkipFathom(p.id,p.day):isSkip(p.id,p.day);
    if(done)dc++;else if(skip)sc++;else ec++;
  });
  // Majority state → cycle to next: empty→done, done→skip, skip→empty
  const mx=Math.max(ec,dc,sc);
  let td=false,ts=false;
  if(mx===ec)td=true;
  else if(mx===dc)ts=true;
  // Apply to all selected cells
  _sel.forEach(id=>{
    const p=_parseSel(id);if(!p) return;
    if(p.type==='fathom') _setFathomState(p.id,p.day,td,ts);
    else _setHabitState(p.id,p.day,td,ts);
  });
  save();
  _keepSel=true;
  render();
});

// ── Per-cell comments (right-click a checkbox to add a note for that day) ──
function _cellIds(type,id,day){ return type==='fathom'?[`fhzcc-${id}-${day}`]:[`cc-${id}-${day}`,`hzcc-${id}-${day}`]; }
function getCellComment(type,id,day){
  const mo=D.months[mk(CY,CM)]; if(!mo) return '';
  const store=type==='fathom'?mo.fathomComments:mo.comments;
  return (store&&store[id]&&store[id][day])||'';
}
function setCellComment(type,id,day,text){
  const mo=md(CY,CM);
  const key=type==='fathom'?'fathomComments':'comments';
  if(!mo[key]) mo[key]={};
  if(!mo[key][id]) mo[key][id]={};
  text=(text||'').trim();
  if(text) mo[key][id][day]=text;
  else { delete mo[key][id][day]; if(!Object.keys(mo[key][id]).length) delete mo[key][id]; }
  save();
  _applyCommentMarker(type,id,day);
}
function _applyCommentMarker(type,id,day){
  const txt=getCellComment(type,id,day);
  _cellIds(type,id,day).forEach(cid=>{const el=document.getElementById(cid);if(!el)return;el.classList.toggle('has-comment',!!txt);if(txt)el.title=txt;else el.removeAttribute('title');});
}
function _applyAllCommentMarkers(){
  const mo=D.months[mk(CY,CM)]; if(!mo) return;
  [['comments','habit'],['fathomComments','fathom']].forEach(([k,type])=>{
    const store=mo[k]; if(!store) return;
    Object.keys(store).forEach(id=>Object.keys(store[id]).forEach(day=>{ if(store[id][day]) _applyCommentMarker(type,id,+day); }));
  });
}
function closeCommentPopup(){ const el=document.getElementById('comment-pop'); if(el)el.remove(); document.removeEventListener('mousedown',_commentOutside,true); document.removeEventListener('keydown',_commentKey,true); }
function _commentOutside(e){ const p=document.getElementById('comment-pop'); if(p&&!p.contains(e.target)) closeCommentPopup(); }
function _commentKey(e){ if(e.key==='Escape'){ closeCommentPopup(); } else if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ _commentSave(); } }
function openCommentPopup(type,id,day,x,y){
  closeCommentPopup();
  const cur=getCellComment(type,id,day);
  const btn=(label,handler,style)=>`<button onclick="${handler}" style="border:1px solid var(--border2);border-radius:var(--r2);padding:5px 11px;cursor:pointer;font-family:var(--font);font-size:12px;background:${style?.bg||'none'};color:${style?.fg||'var(--text2)'};${style?.border?`border-color:${style.border};`:''}">${label}</button>`;
  const pop=document.createElement('div');
  pop.id='comment-pop';
  pop.dataset.type=type; pop.dataset.cid=id; pop.dataset.day=day;
  pop.style.cssText=`position:fixed;z-index:1200;left:${x}px;top:${y}px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow-md);padding:11px;width:240px;box-sizing:border-box`;
  pop.innerHTML=`
    <div style="font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px">Comment</div>
    <textarea id="comment-ta" style="width:100%;height:72px;resize:vertical;border:1px solid var(--border);border-radius:var(--r2);background:var(--surface2);color:var(--text1);font-family:var(--font);font-size:12px;line-height:1.45;padding:7px;box-sizing:border-box;outline:none">${esc(cur)}</textarea>
    <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px">
      ${cur?btn('Delete','_commentDelete()',{fg:'var(--red)',border:'var(--border2)'}):''}
      ${btn('Cancel','closeCommentPopup()')}
      ${btn('Save','_commentSave()',{bg:'var(--text1)',fg:'var(--bg)',border:'var(--text1)'})}
    </div>`;
  document.body.appendChild(pop);
  const r=pop.getBoundingClientRect();
  if(r.right>window.innerWidth) pop.style.left=Math.max(8,window.innerWidth-r.width-8)+'px';
  if(r.bottom>window.innerHeight) pop.style.top=Math.max(8,window.innerHeight-r.height-8)+'px';
  const ta=document.getElementById('comment-ta'); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
  document.addEventListener('mousedown',_commentOutside,true);
  document.addEventListener('keydown',_commentKey,true);
}
function _commentSave(){ const p=document.getElementById('comment-pop'); if(!p)return; setCellComment(p.dataset.type,p.dataset.cid,+p.dataset.day,document.getElementById('comment-ta').value); closeCommentPopup(); }
function _commentDelete(){ const p=document.getElementById('comment-pop'); if(!p)return; setCellComment(p.dataset.type,p.dataset.cid,+p.dataset.day,''); closeCommentPopup(); }

// Auto-scroll the page (or nearest scroll container) while dragging habits/groups
// near the top/bottom edge, so distant reorders are reachable. Gated on _dg so it
// only runs during an active drag, and covers every drag context that sets _dg.
let _dragScrollRAF=null,_dragScrollV=0,_dragScrollEl=null;
function _findScrollable(el){
  for(;el&&el!==document.body;el=el.parentElement){
    const s=getComputedStyle(el);
    if(/(auto|scroll)/.test(s.overflowY)&&el.scrollHeight>el.clientHeight) return el;
  }
  return null;
}
function _dragScrollTick(){
  if(_dragScrollV&&_dg){
    if(_dragScrollEl) _dragScrollEl.scrollTop+=_dragScrollV;
    else window.scrollBy(0,_dragScrollV);
    _dragScrollRAF=requestAnimationFrame(_dragScrollTick);
  } else { _dragScrollRAF=null; }
}
function _onDragScroll(e){
  if(!_dg){ _dragScrollV=0; return; }
  const EDGE=60,MAX=18;
  const el=_findScrollable(document.elementFromPoint(e.clientX,e.clientY));
  let top,bottom;
  if(el){ const r=el.getBoundingClientRect(); top=r.top; bottom=r.bottom; }
  else { top=0; bottom=window.innerHeight; }
  _dragScrollEl=el;
  const y=e.clientY;
  if(y<top+EDGE) _dragScrollV=-Math.ceil(MAX*(top+EDGE-y)/EDGE);
  else if(y>bottom-EDGE) _dragScrollV=Math.ceil(MAX*(y-(bottom-EDGE))/EDGE);
  else _dragScrollV=0;
  if(_dragScrollV&&!_dragScrollRAF) _dragScrollTick();
}
function _stopDragScroll(){ _dragScrollV=0; if(_dragScrollRAF){cancelAnimationFrame(_dragScrollRAF);_dragScrollRAF=null;} }
document.addEventListener('dragover',_onDragScroll,true);
document.addEventListener('dragend',_stopDragScroll,true);
document.addEventListener('drop',_stopDragScroll,true);

// Touch long-press to skip (mobile)
document.addEventListener('touchstart',e=>{
  const c=e.target.closest('.chk-c:not(.future),.hz-chk-c:not(.future)');
  if(!c||!_parseSel(c.id)) return;
  clearTimeout(_lpTimer);_lpFired=false;
  _lpTimer=setTimeout(()=>{
    _lpFired=true;
    const p=_parseSel(c.id);
    if(!p) return;
    if(p.type==='fathom') doFathomSkipToggle(p.id,p.day);
    else doSkipToggle(p.id,p.day,c.dataset.color||'var(--accent)');
  },500);
},{passive:true});
document.addEventListener('touchmove',()=>{clearTimeout(_lpTimer);_lpTimer=null;},{passive:true});
document.addEventListener('touchend',()=>{clearTimeout(_lpTimer);_lpTimer=null;},{passive:true});

// ─────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────
render();
updateSyncBadge();
loadFromCloud().then(()=>{ repairJulySkips(); migrateCardsToGlobal(); migrateCardsToPeriods(); migrateClockToCard(); migrateCardsToOneEntry(); migrateCardCols(); render(); });
</script>
