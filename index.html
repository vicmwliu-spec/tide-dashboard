// Week numbers are storage keys — mo.weekAar[3], mo.weekSnapshots[3], and the "-W3" suffix on
// weekly card content — so moving the start day changes which days each stored number covers.
// These three functions work out where every stored week lands under the new start and carry
// the content across, rather than leaving it filed against days it was never about.

// Spans for a month as they would be cut under a given start day.
function _spansUnder(y,m,ws){
  const prev=D.weekStart; D.weekStart=ws;
  try{ return getWeekSpans(y,m) } finally{ D.weekStart=prev }
}
// old week number → new week number, by which new span contains the old span's middle day.
// The middle and not the first day: spans of different lengths sit off-centre from each other,
// so keying on the first day walks an entry steadily earlier every time the setting is changed,
// while the middle lands back where it started when you switch back.
function _weekRemap(y,m,oldWS,newWS){
  const oldS=_spansUnder(y,m,oldWS),newS=_spansUnder(y,m,newWS),map={};
  oldS.forEach(sp=>{
    const mid=Math.floor((sp.start+sp.end)/2);
    const t=newS.find(n=>mid>=n.start&&mid<=n.end);
    map[sp.week]=t?t.week:newS[newS.length-1].week;
  });
  return map;
}
// Rekey everything filed by week. Returns {moved,merged} so the confirmation can say what it did.
// Two old weeks can land on one new one: HTML is joined rather than dropped, so nothing written
// is ever lost, and the snapshot of the earlier week wins.
function _applyWeekRemap(oldWS,newWS,dryRun){
  const KEY=/^(\d{4})-(\d{2})-W(\d+)$/;
  let moved=0,merged=0;
  const put=(bag,k,v)=>{
    if(bag[k]===undefined){ bag[k]=v; return }
    merged++;
    bag[k]=String(bag[k])+'<hr>'+String(v);
  };
  Object.keys(D.months||{}).forEach(mkey=>{
    const mm=/^(\d{4})-(\d{2})$/.exec(mkey); if(!mm) return;
    const y=+mm[1],m=+mm[2]-1,mo=D.months[mkey];
    const map=_weekRemap(y,m,oldWS,newWS);
    // Every notebook, not just the legacy one: a journal card's weekly reviews are filed under
    // its own bag, and a review left behind on its old number is filed against days it was
    // never about. The template stamp travels with the entry — without it, a week you only
    // scaffolded stops looking scaffolded the moment the week start changes.
    const rekey=(bag,key,count)=>{
      if(!bag[key]) return;
      const src=bag[key],out={};
      Object.keys(src).map(Number).sort((a,b)=>a-b).forEach(w=>{
        const t=map[w]??w; if(t!==w&&count) moved++;
        // Stamps are compared whole against an entry's text, so two of them landing on one week
        // cannot be joined the way the entries are — the earlier one wins, as the snapshots do.
        if(count) put(out,t,src[w]); else if(out[t]===undefined) out[t]=src[w];
      });
      if(!dryRun) bag[key]=out;
    };
    [mo,...Object.values(mo.nb||{})].forEach(bag=>{
      rekey(bag,'weekAar',true);
      // Not counted: a stamp moving is the same move as the entry it belongs to, already tallied.
      rekey(bag,'weekAarTmpl',false);
    });
    if(mo.weekSnapshots||mo.weekArchived){
      const snaps=mo.weekSnapshots||{},arch=mo.weekArchived||{},oS={},oA={};
      [...new Set([...Object.keys(snaps),...Object.keys(arch)])].map(Number).sort((a,b)=>a-b).forEach(w=>{
        const t=map[w]??w;
        if(snaps[w]!==undefined&&oS[t]===undefined) oS[t]=snaps[w];
        if(arch[w]) oA[t]=true;
      });
      if(!dryRun){ if(mo.weekSnapshots) mo.weekSnapshots=oS; if(mo.weekArchived) mo.weekArchived=oA; }
    }
  });
  const data=(D.cards&&D.cards.data)||{};
  Object.keys(data).forEach(cid=>{
    const bag=data[cid]; if(!bag||typeof bag!=='object') return;
    const out={},weekKeys=[];
    Object.keys(bag).forEach(k=>{ if(KEY.test(k)) weekKeys.push(k); else out[k]=bag[k]; });
    weekKeys.sort().forEach(k=>{
      const g=KEY.exec(k),y=+g[1],m=+g[2]-1,w=+g[3];
      const t=_weekRemap(y,m,oldWS,newWS)[w]??w;
      if(t!==w) moved++;
      put(out,`${g[1]}-${g[2]}-W${t}`,bag[k]);
    });
    if(!dryRun) data[cid]=out;
  });
  return {moved,merged};
}
function setWeekStart(ws){
  closeWeekStartMenu();
  const old=WS();
  if(ws===old){ return }
  const n=_applyWeekRemap(old,ws,true);
  if(n.moved||n.merged){
    const bits=[`${n.moved} weekly ${n.moved===1?'entry moves':'entries move'} to the week that now covers ${n.moved===1?'its':'their'} days`];
    if(n.merged) bits.push(`${n.merged} ${n.merged===1?'entry lands':'entries land'} on a week that already has one — those are joined, nothing is deleted`);
    if(!confirm(`Weeks will start on ${DOW[ws]}.\n\n`+bits.join('.\n')+`.\n\nYou can undo this from the toast.`)) return;
  }
  // One undo slot, overwritten each change: enough to take back a switch you did not mean.
  _weekStartUndo={ws:old,months:JSON.parse(JSON.stringify(D.months||{})),
    cards:JSON.parse(JSON.stringify((D.cards&&D.cards.data)||{}))};
  _applyWeekRemap(old,ws,false);
  D.weekStart=ws;
  save(); render();
  _showUndoToast(`Weeks now start on ${DOW[ws]}`,()=>{
    const u=_weekStartUndo; if(!u) return;
    _weekStartUndo=null;
    D.months=u.months;
    if(D.cards) D.cards.data=u.cards;
    D.weekStart=u.ws;
    save(); render();
  });
}

// Weeks as rows, led by whichever day WS() names, with the W-number gutter: the one place the shape of a month is
// built. The Timeline and the Journal draw the same grid and disagree only about what a day
// means, so the day cell — and the gutter, which the Journal makes clickable — are the
// caller's to render.
function monthGridRows(y,m,cell,wk){
  return getWeekSpans(y,m).map(sp=>{
    const cells=[];
    // The first row is padded out to the weekday the span starts on, measured from whichever
    // day the week starts on — the same offset getWeekSpans cut the span with.
    const lead=dowOff(new Date(y,m,sp.start).getDay());
    for(let i=0;i<lead;i++) cells.push('<div class="tl-d tl-pad"></div>');
    for(let n=sp.start;n<=sp.end;n++) cells.push(cell(n,sp));
    while(cells.length<7) cells.push('<div class="tl-d tl-pad"></div>');
    const gut=wk?wk(sp):`<span class="tl-wn">W${sp.week}</span>`;
    return `<div class="tl-wk">${gut}<div class="tl-days">${cells.join('')}</div></div>`;
  }).join('');
}
function timelineCardBody(id){
  const ac=timelineAccent(id);
  // Anchored on CY/CM — the month the rest of the page is showing — plus this card's own
  // browse offset. It used to read PD, which the header's month arrows never move, so
  // paging the header to September left this card sitting on August.
  const off=_tlMo[id]||0;
  const base=new Date(CY,CM+off,1);   // Date normalizes a month over/underflow, year included
  const y=base.getFullYear(),m=base.getMonth(),days=dim(y,m);
  const isThisMonth=y===now.getFullYear()&&m===now.getMonth();
  const today=isThisMonth?now.getDate():0;
  // PD's day is a selection only on the month PD is actually in. 0 means "no day here".
  const onPD=y===PD.getFullYear()&&m===PD.getMonth();
  const sel=onPD?PD.getDate():0;
  // A month wholly behind us is spent, the same as the elapsed days of this one.
  const isPastMo=y<now.getFullYear()||(y===now.getFullYear()&&m<now.getMonth());
  const hd=weekHeadStrip(true);
  const rows=monthGridRows(y,m,n=>{
    const cls=['tl-d'];
    if(isPastMo||(today&&n<today)) cls.push('past');
    if(n===today) cls.push('now');
    if(sel&&n===sel) cls.push('sel');
    return `<button class="${cls.join(' ')}" onclick="goDate(${y},${m},${n})">${n}</button>`;
  });
  const q=Math.floor(m/3);
  // All three months named, current one marked. Bars followed by a month name read
  // as a progress meter arriving at that month; three peers cannot.
  const qmon=[0,1,2].map(i=>{
    const mi=q*3+i;
    return `<span class="tl-qm${mi===m?' on':''}">${MON[mi].slice(0,3)}</span>`;
  }).join('<i>·</i>');
  // The remainder is only a fact about the month you are actually in.
  const remain=isThisMonth?days-today:0;
  // The label is also the way back: while browsing it names the month you would return to,
  // which is cheaper than a second button and puts the escape where the eye already is.
  const lbl=`${MON[m]} ${y}`;
  const nav=`<div class="tl-nav">
      <button class="tl-nb" onclick="tlStep('${id}',-1)" title="Previous month">&#8249;</button>
      <button class="tl-ml${off?' off':''}" onclick="tlHome('${id}')"
        title="${off?`Back to ${MON[CM]} ${CY}`:lbl}">${lbl}</button>
      <button class="tl-nb" onclick="tlStep('${id}',1)" title="Next month">&#8250;</button>
    </div>`;
  // "Day 13 / 31" is a statement about PD. On a month PD is not in there is no such day,
  // so the card states the month's own length instead of a number belonging elsewhere.
  const pos=onPD
    ? `<div class="tl-day"><span class="tl-dl">Day</span><b>${sel}</b><span class="tl-dt">/ ${days}</span></div>`
    : `<div class="tl-day"><b>${days}</b><span class="tl-dt">days</span></div>`;
  // Emitted empty and filled by tlAfter, the way the journal's commitments pane is: the content
  // has to be in the document before rtFreezeTables can do anything with a table in it.
  return `${nav}<div class="tl-grid">${hd}${rows}</div>
    <div class="tl-note" contenteditable="true" data-cardid="${id}"
      onkeydown="richtextKD(event)"
      oninput="saveCard('${id}',rtOnInput(this))"></div>
    <div class="tl-foot">
      <div class="tl-pos">
        ${pos}${
        isThisMonth?`<span class="tl-rem">${remain} day${remain===1?'':'s'} remaining</span>`:''}</div>
      <div class="tl-q"><em>Q${q+1}</em>${qmon}</div>
    </div>`;
}

// ─── JOURNAL CARD ────────────────────────────────────────────────
// The same entries stored per day and per week — the card is the way through them,
// not a second store. A month grid picks the entry, dotted on the days you actually wrote,
// because that dot is the thing a list cannot show: a month of your writing at a glance.
// The grid does NOT navigate the dashboard the way the timeline's does; paging here is
// reading, and it would be hostile to move the whole page because you looked something up.
const _jr={};
// gy/gm are the month the grid is showing; y/m/day/week are the entry that is open. They
// start out the same and must not be merged: paging the calendar to September to see what
// is there cannot silently move you off the entry you were writing in August.
// The notebook a journal card reads. '' is the original store, kept by the one card that owned
// the entries written before cards could be separated; every other card files under its own id.
// Derived and not stored, so two devices syncing through D never disagree — a random id assigned
// independently on each would fork a notebook in two. Before migrateJournalNotebooks has run,
// D.jrLegacy is undefined and every card reads '', which is exactly today's behaviour.
function jrNb(id){ return D.jrLegacy===undefined||id===D.jrLegacy?'':id }
// One-time: name the journal card that owns those entries. An id and not a position, so
// reordering the page cannot hand the history to a different card.
function migrateJournalNotebooks(){
  if(D.jrLegacy!==undefined) return;
  const j=cardDefs().find(c=>c.type==='journal');
  D.jrLegacy=j?j.id:'';
  saveLocal(); // boot migration: local only, never a push — see saveLocal
}
function jrState(id){
  return _jr[id]||(_jr[id]={
    gy:now.getFullYear(), gm:now.getMonth(),
    y:now.getFullYear(), m:now.getMonth(), day:now.getDate(), week:0,
    q:'', pane:'grid'
  });
}
// Not cleared by _navRender, unlike _tlMo: the dashboard's month arrows must not yank you
// out of an entry you are part-way through reading. In memory only, so a card left on some
// far month opens on today next session rather than somewhere unexplained.
function jrRepaint(id){
  const el=document.querySelector(`.jrcard[data-cardid="${id}"]`);
  if(el){ el.innerHTML=journalCardBody(id); jrAfter(id); }
}
// Save what is in the editor before anything replaces it. Every entry switch goes through
// here, so nothing you typed can be discarded by a click somewhere else in the card.
function jrFlush(id){
  const ed=document.querySelector(`.jrcard[data-cardid="${id}"] .jr-ed`);
  if(!ed) return;
  const y=+ed.dataset.y,m=+ed.dataset.m,html=rtHTML(ed).trim(),nb=ed.dataset.nb;
  if(ed.dataset.week) saveWeekAAREntryAt(y,m,+ed.dataset.week,html,nb);
  else saveAAREntryAt(y,m,+ed.dataset.day,html,nb);
}
// Only the grid moves. Whatever entry is open stays open, and the writing pane with it.
function jrStep(id,d){
  const s=jrState(id), b=new Date(s.gy,s.gm+d,1);
  s.gy=b.getFullYear(); s.gm=b.getMonth();
  // Just the picker: repainting the card would rebuild the editor and take the caret out
  // of an entry you never asked to leave.
  const el=document.querySelector(`.jrcard[data-cardid="${id}"] .jr-list`);
  if(el) el.innerHTML=jrPicker(id); else jrRepaint(id);
}
function jrToday(id){
  jrFlush(id);
  const s=jrState(id);
  s.gy=s.y=now.getFullYear(); s.gm=s.m=now.getMonth(); s.day=now.getDate(); s.week=0; s.q='';
  jrRepaint(id);
}
// Picking an entry brings the grid with it, so a hit from a search in another month leaves
// the calendar showing the month you landed in rather than the one you searched from.
function jrOpen(id,y,m,day,week){
  jrFlush(id);
  const s=jrState(id);
  s.y=s.gy=y; s.m=s.gm=m; s.day=day||0; s.week=week||0; s.pane='entry';
  jrRepaint(id);
}
function jrSearch(id,v){
  const s=jrState(id);
  s.q=v;
  // Only the picker pane is rebuilt: repainting the card would take the caret out of the
  // search box on the first keystroke.
  const el=document.querySelector(`.jrcard[data-cardid="${id}"] .jr-list`);
  if(el) el.innerHTML=jrPicker(id);
  // Searching gives the hits the whole column, so the commitments step aside — an attribute
  // rather than a repaint, for the same reason.
  const side=document.querySelector(`.jrcard[data-cardid="${id}"] .jr-side`);
  if(side) side.dataset.mode=v.trim()?'search':'grid';
}
function jrPane(id,p){ jrState(id).pane=p; jrRepaint(id); }
// Every entry that exists, newest first. Derived on demand — the entries are the source of
// truth and there is nothing here to keep in step with them.
// One notebook's, so a search in one card cannot turn up what you wrote in another.
function aarIndex(nb){
  const out=[];
  for(const key in D.months){
    const [ys,ms]=key.split('-'); const y=+ys, m=+ms-1, b=_nbBag(D.months[key],nb);
    // An untouched template is not an entry, so it is not listed and cannot be searched into.
    for(const d in (b.aar||{}))     if(hasAAREntryAt(y,m,+d,nb))     out.push({y,m,day:+d,  html:b.aar[d]});
    for(const w in (b.weekAar||{})) if(hasWeekAAREntryAt(y,m,+w,nb)) out.push({y,m,week:+w, html:b.weekAar[w]});
  }
  return out.sort((a,b)=>b.y-a.y||b.m-a.m||(b.day||0)-(a.day||0)||(b.week||0)-(a.week||0));
}
function aarText(html){ const d=document.createElement('div'); d.innerHTML=html||''; return (d.textContent||'').replace(/\s+/g,' ').trim() }
function jrLabel(e){
  if(e.week){
    const sp=getWeekSpans(e.y,e.m).find(s=>s.week===e.week);
    return `Week ${e.week}${sp?` · ${MON[e.m].slice(0,3)} ${sp.start}–${sp.end}`:''}`;
  }
  return `${DOW[new Date(e.y,e.m,e.day).getDay()]} ${MON[e.m].slice(0,3)} ${e.day}`;
}
// The picker: a month grid normally, matching entries while you are searching. A grid cannot
// answer "where did I write about Notion", and a list cannot show you a month at a glance,
// so the search box is what swaps between the two.
function jrPicker(id){
  const s=jrState(id),nb=jrNb(id);
  if(s.q.trim()){
    const q=s.q.trim().toLowerCase();
    const hits=aarIndex(nb).filter(e=>{
      const lbl=`${jrLabel(e)} ${MON[e.m]} ${e.y}`.toLowerCase();
      return lbl.includes(q)||aarText(e.html).toLowerCase().includes(q);
    });
    if(!hits.length) return `<div class="jr-empty">No entries match “${_esc(s.q)}”.</div>`;
    return hits.map(e=>{
      const on=e.y===s.y&&e.m===s.m&&(e.week?e.week===s.week:e.day===s.day&&!s.week);
      const snip=aarText(e.html).slice(0,70);
      return `<button class="jr-hit${on?' on':''}" onclick="jrOpen('${id}',${e.y},${e.m},${e.day||0},${e.week||0})">
          <span class="jr-hd">${jrLabel(e)}<i>${e.y}</i></span>
          <span class="jr-hs">${_esc(snip)}</span>
        </button>`;
    }).join('');
  }
  const y=s.gy,m=s.gm;
  const isThisMonth=y===now.getFullYear()&&m===now.getMonth();
  const today=isThisMonth?now.getDate():0;
  // The open entry is only a selection on the month it is actually in — otherwise browsing
  // to September would highlight the 13th there because August's 13th is open.
  const onEntry=y===s.y&&m===s.m;
  const hd=weekHeadStrip();
  const rows=monthGridRows(y,m,n=>{
    const cls=['tl-d'];
    if(hasAAREntryAt(y,m,n,nb)) cls.push('has');
    if(n===today) cls.push('now');
    if(onEntry&&!s.week&&n===s.day) cls.push('sel');
    return `<button class="${cls.join(' ')}" title="${DOW[new Date(y,m,n).getDay()]}, ${MON[m]} ${n}"
        onclick="jrOpen('${id}',${y},${m},${n},0)">${n}</button>`;
  },sp=>{
    // The weekly review lives on the week number, which is where the rest of the app
    // already puts it — so both kinds of entry are reachable from the one grid.
    const has=hasWeekAAREntryAt(y,m,sp.week,nb);
    const on=onEntry&&s.week===sp.week;
    return `<button class="tl-wn jr-wn${has?' has':''}${on?' sel':''}" title="Weekly review · week ${sp.week}"
        onclick="jrOpen('${id}',${y},${m},0,${sp.week})">W${sp.week}</button>`;
  });
  const lbl=`${MON[m]} ${y}`;
  const home=!(y===now.getFullYear()&&m===now.getMonth());
  // The colour dot rides beside the arrows rather than sitting behind the ⋯: it is the one
  // setting whose effect is entirely in this grid — the day dots, the chip on the entry you
  // are reading — so it belongs where you can see what it does. --tlc is already on the card.
  return `<div class="tl-nav">
      <button class="chart-color-dot jr-dot" style="background:var(--tlc)" title="Card colour"
        onclick="event.stopPropagation();openChartColorPop(event,'tl_${id}')"></button>
      <button class="tl-nb" onclick="jrStep('${id}',-1)" title="Previous month">&#8249;</button>
      <button class="tl-ml${home?' off':''}" onclick="jrToday('${id}')"
        title="${home?'Back to this month':lbl}">${lbl}</button>
      <button class="tl-nb" onclick="jrStep('${id}',1)" title="Next month">&#8250;</button>
    </div>
    <div class="tl-grid jr-grid">${hd}${rows}</div>`;
}
function journalCardBody(id){
  const s=jrState(id),nb=jrNb(id);
  const e={y:s.y,m:s.m,day:s.day,week:s.week};
  const html=s.week?getWeekAARAt(s.y,s.m,s.week,nb):getAARAt(s.y,s.m,s.day,nb);
  const cap=s.week
    ? `Weekly review · ${jrLabel(e)}, ${s.y}`
    : `${DOW[new Date(s.y,s.m,s.day).getDay()]}, ${MON[s.m]} ${s.day} ${s.y}`;
  // Which pane the ▦ button offers is the one you cannot currently see. It only does
  // anything on a card too narrow for both, where CSS hides the other side.
  const other=s.pane==='grid'?'entry':'grid';
  return `<div class="jr" data-pane="${s.pane}">
      <div class="jr-side" data-mode="${s.q.trim()?'search':'grid'}">
        <div class="jr-list">${jrPicker(id)}</div>
        <div class="jr-commit" contenteditable="true" data-cardid="${id}"
          onkeydown="richtextKD(event)"
          oninput="saveCard('${id}',rtOnInput(this))"></div>
        <div class="jr-srch">
          <input class="jr-q" type="text" placeholder="Search entries…" value="${_esc(s.q)}"
            oninput="jrSearch('${id}',this.value)"/>
        </div>
      </div>
      <div class="jr-main">
        <div class="jr-cap">
          <button class="jr-pane" onclick="jrPane('${id}','${other}')"
            title="${other==='grid'?'Show the calendar':'Show the entry'}">&#9638;</button>
          <span>${cap}</span>
        </div>
        <div class="jr-ed" contenteditable="true" data-cardid="${id}"
          data-y="${s.y}" data-m="${s.m}" data-day="${s.day}" data-week="${s.week||''}" data-nb="${nb}"
          onkeydown="richtextKD(event)"
          oninput="jrInput(this)" onblur="jrBlur('${id}')">${html||''}</div>
      </div>
    </div>`;
}
// Saving on every keystroke is what the text cards do, but a journal cannot repaint with it:
// emptying an entry deletes its key, and the card would rebuild itself — grid, caret and all
// — while you were still holding backspace. The picker catches up on blur instead.
function jrInput(ed){
  const y=+ed.dataset.y,m=+ed.dataset.m,html=rtOnInput(ed),nb=ed.dataset.nb;
  if(ed.dataset.week) saveWeekAAREntryAt(y,m,+ed.dataset.week,html,nb);
  else saveAAREntryAt(y,m,+ed.dataset.day,html,nb);
}
function jrBlur(id){
  const ed=document.querySelector(`.jrcard[data-cardid="${id}"] .jr-ed`);
  if(!ed) return;
  // Only the picker, so the click that took focus away lands where it was aimed.
  const el=document.querySelector(`.jrcard[data-cardid="${id}"] .jr-list`);
  if(el) el.innerHTML=jrPicker(id);
}
// Tables need freezing and the undo stack needs seeding after any repaint, exactly as the
// canvas and text cards do on restore.
function jrAfter(id){
  setTimeout(()=>{
    const ed=document.querySelector(`.jrcard[data-cardid="${id}"] .jr-ed`);
    if(ed){ rtFreezeTables(); rtSeedUndo(ed); }
    // The commitments pane restores from the card's own slot, the way a text card's body
    // does — emitted here rather than inline so rtFreezeTables runs after the content is in.
    const cm=document.querySelector(`.jrcard[data-cardid="${id}"] .jr-commit`);
    if(cm){ cm.innerHTML=cardHTML(id)||''; rtFreezeTables(); rtSeedUndo(cm); }
    jrFit(id);
  },0);
}
// 214px of calendar plus something worth calling a page needs about this much card. Below
// it the two panes become one, switched by the ▦ button.
const JR_MIN2=430;
function jrFit(id){
  const el=document.querySelector(`.jrcard[data-cardid="${id}"]`);
  const card=el&&el.closest('.pcard');
  if(card) card.classList.toggle('jr-narrow',el.clientWidth<JR_MIN2);
}
// Cards are resized by dragging, and the window by the window, so the fit is re-checked
// rather than decided once at render.
addEventListener('resize',()=>{ for(const id in _jr) jrFit(id) });

// ── the journal section of a card's ⋯ menu ────────────────────────────────────────
// These three used to be a strip across the bottom of every tall journal card: a TEMPLATES
// heading, two buttons and a row of draggable chips, costing a fifth of the card's height to
// show things you reach for a few times a month. Behind the ⋯ they cost nothing until asked for.
function _jrMenuItems(id){
  const ts=D.aarTemplates||[];
  const rows=ts.length
    ? ts.map((t,i)=>`<div class="pm-sub-row">
        <button class="pm-sub-load" title="Load into the open entry"
          onclick="_jrTmplLoad('${id}','${t.id}')">${esc(t.name)}</button>
        <button class="pm-sub-b" title="Rename"
          onclick="_jrTmplRename('${t.id}')">&#9998;</button>
        <button class="pm-sub-b" title="Move up" ${i===0?'disabled':''}
          onclick="_jrTmplMove('${t.id}',-1)">&#8593;</button>
        <button class="pm-sub-b" title="Move down" ${i===ts.length-1?'disabled':''}
          onclick="_jrTmplMove('${t.id}',1)">&#8595;</button>
        <button class="pm-sub-b pm-sub-x" title="Delete template"
          onclick="_jrTmplDelete('${t.id}')">&#10005;</button>
      </div>`).join('')
    : `<div class="pm-sub-empty">No templates yet — write an entry and save it as one.</div>`;
  return `<button class="padd-item pm-i" onclick="_jrTmplSave('${id}')">Save as template</button>
    <button class="padd-item pm-i" onclick="_jrTmplClear('${id}')">Clear all</button>
    <div class="padd-item pm-i pm-has-sub" tabindex="0">Templates<span class="pm-arw">&#9656;</span>
      <div class="pm-sub">${rows}</div>
    </div>`;
}
// The editor these act on, found the way jrFlush and jrBlur already find it. Asking the DOM by
// card id rather than walking up from the button matters now: the menu closes before the action
// runs, and a detached button has no card to walk up to.
function _jrEd(id){ return document.querySelector(`.jrcard[data-cardid="${id}"] .jr-ed`) }
function _jrTmplSave(id){ const ed=_jrEd(id); _cardMenuClose(); if(ed) saveAsAARTemplate(ed); }
function _jrTmplClear(id){ const ed=_jrEd(id); _cardMenuClose(); if(ed) clearAAREditor(ed); }
function _jrTmplLoad(id,tid){ const ed=_jrEd(id); _cardMenuClose(); if(ed) loadAARTemplate(tid,ed); }
// Deleting and reordering leave the menu open — you rarely do just one — and repaint it so the
// list on screen is the list in the data.
function _jrTmplDelete(tid){ deleteAARTemplate(tid); }
// Renaming asks the same way saving a new one does, seeded with the name it has: the point is
// usually to amend a name rather than to think of a fresh one.
function _jrTmplRename(tid){
  const t=(D.aarTemplates||[]).find(t=>t.id===tid);
  if(!t) return;
  const n=prompt('Template name',t.name);
  if(n===null||!n.trim()) return;
  t.name=n.trim();
  save();
  _cardMenuRepaint();
}
// What the chips' drag-and-drop did, one step at a time. Swapping neighbours is the whole of it.
function _jrTmplMove(tid,d){
  const ts=D.aarTemplates||[], i=ts.findIndex(t=>t.id===tid), j=i+d;
  if(i<0||j<0||j>=ts.length) return;
  [ts[i],ts[j]]=[ts[j],ts[i]];
  save();
  _cardMenuRepaint();
}

// ─── CANVAS CARD ─────────────────────────────────────────────────
// A card you place things on rather than write down. Every box is an ordinary
// rich-text host — .cv-bd is in RT_HOSTS — so tables, lists, checkboxes, toggles
// and the slash menu all work inside one on the first day, with no second editor
// to keep in step with the first.
//
// The position IS the content: left/top/width sit in the box's own style attribute,
// so a canvas serializes as the card's HTML exactly like prose does and saveCard,
// cardHTML and the Supabase sync need no changes at all. Everything you see while
// dragging — the handle strip, the resize handles, the guides, the marquee — is
// drawn on #cv-ctl, a fixed overlay on <body>, so none of it can reach storage.
const CV_W=300;        // a new box's width
const CV_DRAG=5;       // px before a press counts as a drag
const CV_MARQ=4;       // below this a marquee was really a click
const CV_SNAP=6;       // how near an edge has to be to snap to it
const CV_MINW=60, CV_MINH=24;
let _cvDrag=null,_cvRz=null,_cvMarq=null,_cvHover=null;

function cvCard(n){ return n&&n.closest?n.closest('.cvcard'):null; }
function cvSurf(n){ const c=cvCard(n); return c&&c.querySelector('.cv-surface'); }
function cvBoxes(surf){ return surf?[...surf.querySelectorAll('.cv-box')]:[]; }
function cvNum(v){ return parseFloat(v)||0; }
function cvPos(b){
  return {x:cvNum(b.style.left),y:cvNum(b.style.top),
          w:b.offsetWidth||cvNum(b.style.width)||CV_W,h:b.offsetHeight||CV_MINH};
}
// Grow the surface to hold whatever is on it, so the card scrolls to reach a box
// placed past its bottom edge rather than clipping it.
function cvFit(surf){
  if(!surf) return;
  let r=0,b=0;
  cvBoxes(surf).forEach(el=>{ const p=cvPos(el); r=Math.max(r,p.x+p.w); b=Math.max(b,p.y+p.h); });
  // ...and never smaller than the card. The surface is what a click has to land on
  // to make a box, and an inline min-height beats .cv-surface{min-height:100%}, so
  // the fill has to be written here rather than left to the stylesheet. Without it
  // everything below the lowest box is bare .cvcard, and clicking there does nothing
  // — which is what a canvas looked like once the card became a fixed-height box.
  const card=surf.parentElement;
  surf.style.minHeight=Math.max(b+40,card?card.clientHeight:0)+'px';
  // No minWidth. Boxes are placed within the card's width, so widening the surface
  // to the rightmost box only ever bought a horizontal scrollbar nothing needed.
}
// Selection is a transient class, so it is stripped on the way to storage — what
// you had selected when you happened to stop typing is not part of the document.
function cvHTML(surf){
  const c=surf.cloneNode(true);
  c.querySelectorAll('.cv-sel').forEach(el=>el.classList.remove('cv-sel'));
  return c.outerHTML;
}
function cvSave(n){
  const card=cvCard(n); if(!card) return;
  const surf=card.querySelector('.cv-surface'); if(!surf) return;
  cvFit(surf);
  saveCard(card.dataset.cardid,cvHTML(surf));
}
// Every box body saves the card it sits on, not itself — one card, one slot.
function cvOnInput(el){ rtOnInput(el); cvSave(el); }

// ── Undo, for the surface itself ──
// The only undo in the app was per rich-text host: it can bring back what a box said,
// and knows nothing about the box existing. So deleting a box was unrecoverable — and
// once it was gone rtActiveHost had no host to look up and Ctrl+Z didn't even
// preventDefault, which is "nothing happens" exactly. Filed by card id rather than by
// element, for the reason the text stack is: render() rebuilds the DOM and a stack
// keyed on a node would quietly empty itself.
const _cvU=new Map();
let _cvRestoring=false,_cvLastId='';
function _cvUState(surf){
  const card=cvCard(surf); const id=card&&card.dataset?card.dataset.cardid:'';
  if(!id) return null;
  _cvLastId=id;
  let st=_cvU.get(id);
  if(!st){ st={s:[],i:-1}; _cvU.set(id,st); }
  return st;
}
// Called on both sides of every structural change: before it, so the state you want
// back is on the stack even when text was typed since the last one, and after it, so
// the change itself is a step. Deduped, so the pair costs nothing where nothing moved.
function cvPush(surf){
  if(_cvRestoring||!surf) return;
  const st=_cvUState(surf); if(!st) return;
  const h=cvHTML(surf);
  if(st.i>=0&&st.s[st.i]===h) return;
  st.s=st.s.slice(0,st.i+1);
  st.s.push(h);
  if(st.s.length>60) st.s.shift();
  st.i=st.s.length-1;
}
// The canvas a Ctrl+Z means when the pointer has moved on and the box that had focus
// has been deleted out from under it.
function cvLastSurf(){
  if(!_cvLastId) return null;
  const card=document.querySelector('.cvcard[data-cardid="'+_cvLastId+'"]');
  return card?card.querySelector('.cv-surface'):null;
}
function cvUndo(surf,redo){
  const st=_cvUState(surf); if(!st) return false;
  cvPush(surf); // what is on screen has to be on the stack before you can step off it
  const ni=st.i+(redo?1:-1);
  if(ni<0||ni>=st.s.length) return false;
  const card=cvCard(surf); if(!card) return false;
  st.i=ni;
  _cvRestoring=true;
  try{
    const d=document.createElement('div'); d.innerHTML=st.s[ni];
    const fresh=d.firstElementChild;
    if(!fresh) return false;
    surf.parentNode.replaceChild(fresh,surf);
    // Box bodies carry their uid in the saved HTML, so a box that comes back keeps the
    // text history filed under it rather than returning as a stranger.
    cvFit(fresh);
    saveCard(card.dataset.cardid,cvHTML(fresh));
  } finally { _cvRestoring=false; }
  return true;
}

// The uid is saved with the box and is what its undo history is filed under, so a
// render that rebuilds the box doesn't lose what you'd typed into it.
function cvUid(){ return 'b'+Math.random().toString(36).slice(2,9) }
function cvBoxHTML(html,x,y,w){
  return `<div class="cv-box" style="left:${Math.round(x)}px;top:${Math.round(y)}px;width:${Math.round(w||CV_W)}px">`
    +`<div class="cv-bd" data-uid="${cvUid()}" contenteditable="true" oninput="cvOnInput(this)" onkeydown="richtextKD(event)">`
    +(html||'<p><br></p>')+`</div></div>`;
}
function cvNewBox(surf,x,y,html){
  cvPush(surf);
  const d=document.createElement('div');
  d.innerHTML=cvBoxHTML(html,x,y,CV_W);
  const box=d.firstElementChild;
  surf.appendChild(box);
  cvSelect(surf,[box]);
  const bd=box.querySelector('.cv-bd');
  // preventScroll: focusing a box you just made should not jump the page to it.
  rtSeedUndo(bd); rtPlaceCaretAtEnd(bd); bd.focus({preventScroll:true});
  cvSave(surf); cvPush(surf);
  return box;
}
// An empty box is a click you thought better of, not a thing you made. It goes
// when you look away, so a stray click never leaves litter behind.
function cvPurgeEmpty(surf,except){
  // Gathered before anything is removed, so the "before" snapshot is only pushed when
  // there is actually something to undo — an empty purge must not cost an undo step.
  const gone=cvBoxes(surf).filter(b=>{
    if(b===except) return false;
    const bd=b.querySelector('.cv-bd');
    return bd&&!bd.textContent.trim()&&!bd.querySelector('table,img,.rt-tog');
  });
  if(!gone.length) return;
  cvPush(surf);
  gone.forEach(b=>b.remove());
  cvSave(surf); cvPush(surf);
}

// ── Selection ──
function cvSelected(surf){ return cvBoxes(surf).filter(b=>b.classList.contains('cv-sel')); }
function cvSelect(surf,boxes,add){
  if(!add) cvBoxes(surf).forEach(b=>b.classList.remove('cv-sel'));
  (boxes||[]).forEach(b=>b.classList.add('cv-sel'));
}
function cvDeleteSelected(surf){
  const sel=cvSelected(surf); if(!sel.length) return false;
  cvPush(surf);
  sel.forEach(b=>b.remove());
  cvSave(surf); cvPush(surf); cvHideCtl();
  return true;
}

// ── Snapping ──
// Every other box offers three lines on each axis — its two edges and its middle —
// and so does the surface. The nearest within CV_SNAP wins, X and Y decided
// independently, so a box can snap to one box's left and another's top at once.
function cvSnapLines(surf,except){
  const xs=[],ys=[];
  const W=surf.clientWidth||surf.offsetWidth,H=surf.clientHeight||surf.offsetHeight;
  xs.push(0,W/2,W); ys.push(0,H/2,H);
  cvBoxes(surf).forEach(b=>{
    if(b===except||b.classList.contains('cv-sel')&&except) return;
    const p=cvPos(b);
    xs.push(p.x,p.x+p.w/2,p.x+p.w);
    ys.push(p.y,p.y+p.h/2,p.y+p.h);
  });
  return {xs,ys};
}
// Given where the box wants to be, return where it should go and which lines it
// landed on. Pure — no DOM, no layout — so the rule is testable on its own.
function cvSnap(x,y,w,h,lines,tol){
  tol=tol==null?CV_SNAP:tol;
  const fit=(v,size,cands)=>{
    let best=null;
    [[0,'start'],[size/2,'mid'],[size,'end']].forEach(([off])=>{
      cands.forEach(c=>{
        const d=Math.abs(v+off-c);
        if(d<=tol&&(!best||d<best.d)) best={d,at:c-off,line:c};
      });
    });
    return best;
  };
  const fx=fit(x,w,lines.xs),fy=fit(y,h,lines.ys);
  return {x:fx?fx.at:x,y:fy?fy.at:y,gx:fx?fx.line:null,gy:fy?fy.line:null};
}

// ── The overlay ──
// The handle strip and the eight resize handles are built once and then only moved.
// Rebuilding them was what made the canvas flash: nine elements destroyed and
// recreated on every pointermove and every frame of a drag, each new one starting
// life without the hover state or the pointer capture the old one had.
const CV_HANDLES=[['n',0,-1,.5,0,'ns-resize'],['s',0,1,.5,1,'ns-resize'],
  ['w',-1,0,0,.5,'ew-resize'],['e',1,0,1,.5,'ew-resize'],
  ['nw',-1,-1,0,0,'nwse-resize'],['ne',1,-1,1,0,'nesw-resize'],
  ['sw',-1,1,0,1,'nesw-resize'],['se',1,1,1,1,'nwse-resize']];
function cvCtl(){
  let el=document.getElementById('cv-ctl');
  if(el) return el;
  el=document.createElement('div'); el.id='cv-ctl';
  const hd=document.createElement('div');
  hd.className='cv-hd'; hd.title='Drag to move';
  // The handles read the hovered box at press time rather than closing over one,
  // which is what lets them outlive the box they were drawn for.
  hd.onpointerdown=e=>{ if(_cvHover) cvDragStart(e,_cvHover); };
  el.appendChild(hd);
  CV_HANDLES.forEach(([dir,,,,,cur])=>{
    const h=document.createElement('div');
    h.className='cv-rz'+(dir.length===2?' cv-c':'');
    h.dataset.dir=dir; h.style.cursor=cur;
    h.onpointerdown=e=>{ if(_cvHover) cvRzStart(e,_cvHover,dir); };
    el.appendChild(h);
  });
  document.body.appendChild(el);
  return el;
}
function cvHideCtl(){
  const el=document.getElementById('cv-ctl');
  // Guides and the marquee are transient and do go; the handles stay put, hidden.
  if(el){ el.style.display='none'; el.querySelectorAll('.cv-guide,.cv-marq').forEach(g=>g.remove()); }
  _cvHover=null;
}
function cvMk(cls,css){
  const el=document.createElement('div'); el.className=cls; el.style.cssText=css||'';
  cvCtl().appendChild(el); return el;
}
// The handle strip above the box, and the eight handles around it. Drawn for
// whichever box the pointer is over, and for every box in a multiple selection so
// a group reads as one thing.
function cvShowCtl(box){
  const surf=cvSurf(box); if(!surf) return;
  const ctl=cvCtl(); ctl.style.display='block';
  ctl.style.setProperty('--cvc',cvAccent(cvCard(box)));
  _cvHover=box;
  const r=box.getBoundingClientRect();
  const hd=ctl.querySelector('.cv-hd');
  hd.style.left=r.left+'px'; hd.style.top=(r.top-14)+'px'; hd.style.width=r.width+'px';
  hd.classList.toggle('cv-on',!!(_cvDrag&&_cvDrag.moved));
  // Eight handles: thin strips on the sides, dots on the corners. Moved, not remade.
  CV_HANDLES.forEach(([dir,dx,dy,fx,fy])=>{
    const corner=dir.length===2;
    const size=corner?10:8;
    const w=corner?size:(dx?size:r.width),h=corner?size:(dy?size:r.height);
    const el=ctl.querySelector('.cv-rz[data-dir="'+dir+'"]');
    if(!el) return;
    el.style.left=(r.left+r.width*fx-w/2)+'px';
    el.style.top=(r.top+r.height*fy-h/2)+'px';
    el.style.width=w+'px'; el.style.height=h+'px';
  });
}
// A canvas borrows the app's accent unless the card has its own colour, the same
// key scheme the Timeline uses — so the guides match the card they are drawn on.
function cvAccent(card){
  const id=card&&card.dataset.cardid;
  return (id&&D.chartColors&&D.chartColors['tl_'+id])||gradeAccent();
}

// ── Dragging ──
function cvDragStart(e,box){
  const surf=cvSurf(box); if(!surf) return;
  e.preventDefault();
  // Snapshotted at the start, before the grab raises the box in DOM order, so undo
  // returns both the position and the stacking. A press that turns out not to be a
  // drag costs nothing: the push dedupes against the state already on top.
  cvPush(surf);
  // Dragging any member of a selection drags the whole selection.
  const sel=cvSelected(surf);
  const group=(sel.length>1&&sel.includes(box))?sel:[box];
  if(group.length===1) cvSelect(surf,[box]);
  _cvDrag={surf,box,group,sx:e.clientX,sy:e.clientY,moved:false,
    start:group.map(b=>cvPos(b)),alt:e.altKey};
  // Grabbing raises: stacking is DOM order, so the thing you took hold of comes up.
  surf.appendChild(box);
}
function cvGuides(surf,gx,gy){
  cvCtl().querySelectorAll('.cv-guide').forEach(el=>el.remove());
  const r=surf.getBoundingClientRect();
  if(gx!=null) cvMk('cv-guide v',`left:${r.left+gx}px;top:${r.top}px;height:${r.height}px`);
  if(gy!=null) cvMk('cv-guide h',`left:${r.left}px;top:${r.top+gy}px;width:${r.width}px`);
}
function cvDragMove(e){
  const d=_cvDrag; if(!d) return;
  const dx=e.clientX-d.sx,dy=e.clientY-d.sy;
  if(!d.moved&&Math.hypot(dx,dy)<CV_DRAG) return; // a press is not a drag
  d.moved=true;
  const p0=d.start[0];
  let nx=p0.x+dx,ny=p0.y+dy,gx=null,gy=null;
  // Alt is the escape hatch: hold it and the box goes exactly where you put it.
  if(!e.altKey){
    const s=cvSnap(nx,ny,p0.w,p0.h,cvSnapLines(d.surf,d.box));
    nx=s.x; ny=s.y; gx=s.gx; gy=s.gy;
  }
  const ox=nx-p0.x,oy=ny-p0.y;
  d.group.forEach((b,i)=>{
    b.style.left=Math.max(0,Math.round(d.start[i].x+ox))+'px';
    b.style.top =Math.max(0,Math.round(d.start[i].y+oy))+'px';
  });
  cvShowCtl(d.box);
  cvGuides(d.surf,gx,gy);
}
function cvDragEnd(){
  const d=_cvDrag; _cvDrag=null; if(!d) return;
  cvCtl().querySelectorAll('.cv-guide').forEach(el=>el.remove());
  if(d.moved){ cvSave(d.surf); cvPush(d.surf); }
}

// ── Resizing ──
function cvRzStart(e,box,dir){
  e.preventDefault(); e.stopPropagation();
  const p=cvPos(box);
  _cvRz={surf:cvSurf(box),box,dir,sx:e.clientX,sy:e.clientY,p};
  cvPush(_cvRz.surf);
}
function cvRzMove(e){
  const z=_cvRz; if(!z) return;
  const dx=e.clientX-z.sx,dy=e.clientY-z.sy,p=z.p,d=z.dir;
  let x=p.x,y=p.y,w=p.w,h=p.h;
  if(d.includes('e')) w=p.w+dx;
  if(d.includes('w')){ w=p.w-dx; x=p.x+dx; }
  if(d.includes('s')) h=p.h+dy;
  if(d.includes('n')){ h=p.h-dy; y=p.y+dy; }
  // Clamp before committing, and keep the far edge still when dragging the near one
  // — otherwise hitting the minimum walks the box across the surface.
  if(w<CV_MINW){ if(d.includes('w')) x=p.x+p.w-CV_MINW; w=CV_MINW; }
  if(h<CV_MINH){ if(d.includes('n')) y=p.y+p.h-CV_MINH; h=CV_MINH; }
  z.box.style.left=Math.max(0,Math.round(x))+'px';
  z.box.style.top =Math.max(0,Math.round(y))+'px';
  z.box.style.width=Math.round(w)+'px';
  // Height stays automatic unless you actually pull on it, so a box grows with what
  // you type until the day you decide otherwise.
  if(d.includes('n')||d.includes('s')) z.box.style.height=Math.round(h)+'px';
  cvShowCtl(z.box);
}
function cvRzEnd(){ const z=_cvRz; _cvRz=null; if(z){ cvSave(z.surf); cvPush(z.surf); } }

// ── Click, and marquee ──
// A press on empty surface is either a new box or a marquee, and which one it was
// is not knowable until you let go — so decide at the end, on the distance moved.
document.addEventListener('pointerdown',e=>{
  const surf=e.target&&e.target.classList&&e.target.classList.contains('cv-surface')?e.target:null;
  if(!surf) return;
  const r=surf.getBoundingClientRect();
  _cvMarq={surf,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,
    add:e.shiftKey,moved:false};
});
function cvMarqMove(e){
  const m=_cvMarq; if(!m) return;
  if(!m.moved&&Math.hypot(e.clientX-m.sx,e.clientY-m.sy)<CV_MARQ) return;
  m.moved=true;
  const x=Math.min(m.sx,e.clientX),y=Math.min(m.sy,e.clientY);
  const w=Math.abs(e.clientX-m.sx),h=Math.abs(e.clientY-m.sy);
  cvCtl().style.display='block';
  cvCtl().style.setProperty('--cvc',cvAccent(cvCard(m.surf)));
  let box=cvCtl().querySelector('.cv-marq');
  if(!box) box=cvMk('cv-marq','');
  box.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  // Anything the rectangle touches, not only what it swallows whole.
  const hit=cvBoxes(m.surf).filter(b=>{
    const r=b.getBoundingClientRect();
    return r.left<x+w&&r.right>x&&r.top<y+h&&r.bottom>y;
  });
  cvSelect(m.surf,hit,m.add);
}
function cvMarqEnd(e){
  const m=_cvMarq; _cvMarq=null; if(!m) return;
  const marq=cvCtl().querySelector('.cv-marq'); if(marq) marq.remove();
  if(m.moved) return;                    // it was a marquee; the selection stands
  cvPurgeEmpty(m.surf);
  if(!m.add){ cvSelect(m.surf,[]); }
  // y-12 puts the caret under the cursor rather than below it, so the box appears
  // where you were pointing instead of a line down from it.
  cvNewBox(m.surf,Math.max(0,m.ox),Math.max(0,m.oy-12));
}

document.addEventListener('pointermove',e=>{
  if(_cvDrag) return cvDragMove(e);
  if(_cvRz) return cvRzMove(e);
  if(_cvMarq) return cvMarqMove(e);
  // Idle: show the chrome for whatever box is under the pointer.
  const box=e.target&&e.target.closest?e.target.closest('.cv-box'):null;
  if(box){ if(box!==_cvHover) cvShowCtl(box); return; }
  if(_cvHover&&!(e.target.closest&&e.target.closest('#cv-ctl'))) cvHideCtl();
});
document.addEventListener('pointerup',e=>{
  if(_cvDrag) return cvDragEnd(e);
  if(_cvRz) return cvRzEnd(e);
  if(_cvMarq) return cvMarqEnd(e);
});
// Click on a box's chrome selects it; Shift adds to what is already selected.
// Clicking into a box's *text* deliberately selects nothing. It used to select the box,
// and since Delete removes the selected box whenever the key doesn't land in editable
// content, that made a box holding a table a trap: a table wrapper is
// contenteditable="false", so touching its border, its controls or a drag across its
// cells leaves focus outside any .cv-bd while the box is still marked — and one Delete
// took the box, table and all. Picking a box to delete is now something you do from
// outside its text: its chrome, a marquee, or Shift-click.
document.addEventListener('mousedown',e=>{
  const box=e.target&&e.target.closest?e.target.closest('.cv-box'):null;
  if(!box) return;
  const surf=cvSurf(box); if(!surf) return;
  if(e.shiftKey){ e.preventDefault(); box.classList.toggle('cv-sel'); return; }
  if(e.target.closest('.cv-bd')){ cvSelect(surf,[]); return; }
  if(!box.classList.contains('cv-sel')) cvSelect(surf,[box]);
});
document.addEventListener('keydown',e=>{
  const inBody=e.target&&e.target.closest&&e.target.closest('.cv-bd');
  const surf=cvSurf(e.target)||(_cvHover&&cvSurf(_cvHover));
  // Ctrl+Z follows where the caret is: inside a box body it is that box's text undo,
  // untouched; anywhere else on a canvas it is the surface. cvLastSurf is the fallback
  // for the case that prompted this — after deleting a box, focus is on nothing and the
  // pointer has usually moved off, so neither of the two lookups above finds a canvas.
  if((e.ctrlKey||e.metaKey)&&/^[zy]$/i.test(e.key)&&!inBody){
    const s=surf||cvLastSurf();
    if(s&&cvUndo(s,/^y$/i.test(e.key)||e.shiftKey)){
      e.preventDefault();
      // The document-level text-undo handler is registered after this one and would
      // otherwise run too, undoing a second, unrelated thing on the same keystroke.
      e.stopImmediatePropagation();
      cvHideCtl();
    }
    return;
  }
  if(!surf) return;
  if((e.ctrlKey||e.metaKey)&&/^a$/i.test(e.key)&&!inBody){
    e.preventDefault(); cvSelect(surf,cvBoxes(surf)); return;
  }
  // Delete only removes boxes when you are not inside one — inside, it is a key
  // that deletes a character, and nothing else.
  if((e.key==='Delete'||e.key==='Backspace')&&!inBody){
    if(cvDeleteSelected(surf)) e.preventDefault();
  }
});
// Leaving a box takes any empty one with it, the way an unfinished note is not a note.
document.addEventListener('focusout',e=>{
  const bd=e.target&&e.target.closest?e.target.closest('.cv-bd'):null;
  if(!bd) return;
  const surf=cvSurf(bd); if(!surf) return;
  setTimeout(()=>{ if(document.contains(surf)) cvPurgeEmpty(surf,document.activeElement&&document.activeElement.closest('.cv-box')); },0);
});

// ── Conversion ──
// The way an existing card becomes a canvas without retyping it, and back again if
// it turns out not to suit. Nothing is thrown away in either direction.
function convertCardTo(id,type){
  const def=cardDef(id); if(!def||def.type===type) return;
  const html=cardHTML(id)||'';
  if(type==='canvas'){
    const d=document.createElement('div');
    d.innerHTML=cvBoxHTML(html||'<p><br></p>',16,16,CV_W);
    saveCard(id,`<div class="cv-surface">${d.innerHTML}</div>`);
  }else{
    // Reading order, not stacking order: down the page, then across it.
    const d=document.createElement('div'); d.innerHTML=html;
    const boxes=[...d.querySelectorAll('.cv-box')]
      .sort((a,b)=>(cvNum(a.style.top)-cvNum(b.style.top))||(cvNum(a.style.left)-cvNum(b.style.left)));
    saveCard(id,boxes.map(b=>{ const bd=b.querySelector('.cv-bd'); return bd?bd.innerHTML:''; }).join('')||'');
  }
  // A canvas is a fixed box, so it needs a height to be one. Converting never set
  // it, which left a converted canvas at the 80px floor with its boxes scrolling
  // inside it — the same size a brand new canvas starts at instead.
  if(type==='canvas'&&!def.minH) def.minH=320;
  def.type=type;
  _cardsDirty(); render();
}

function mkPlannerCard(def,ix){
  const d=document.createElement('div');
  d.className='pcard';
  d.dataset.cardid=def.id;
  d.dataset.span=def.span||1;
  d.style.gridColumn=`${cardCol(def)} / span ${cardSpan(def)}`;
  d.draggable=false;

  // One header, no modes. The title has always been renameable in place and the header has
  // always been the drag handle (see _cardGrabStart) — everything else a card can do now
  // lives behind the ⋯, which is invisible until you hover the card, so a page you are only
  // reading carries no chrome at all.
  const head = `<div class="pcard-hd pcard-grab" title="Drag to reorder"
           onpointerdown="_cardGrabStart(event,'${def.id}')">
         <span class="pgrab">⠿</span>
         <span class="pcard-lbl pcard-lbled" contenteditable="plaintext-only"
               spellcheck="false" title="Click to rename"
               onfocus="_cardLblFocus(this)" onblur="_cardLblCommit(this,'${def.id}')"
               onkeydown="_cardLblKD(event,this)">${_esc(def.label)}</span>
         <button class="pcard-more${_cardMenu===def.id?' on':''}" title="Card options"
             onpointerdown="event.stopPropagation()"
             onclick="_cardMenuToggle(event,'${def.id}')">&#8943;</button>
         ${_cardMenu===def.id?_cardMenuHTML(def):''}
       </div>`;

  // A canvas takes its height rather than a floor for it. The surface grows a
  // minHeight to fit the lowest box, and with a floor that growth pushed the whole
  // card — and the row it sits in — taller every time a box moved down. Fixed, the
  // surface scrolls inside the card and the card stays the size you set it to.
  // flex:none matters as much as the height does. .pcard-bd is flex:1 — that is
  // flex-basis:0% — and a flex item takes its base size from flex-basis, not from
  // `height`, so a bare `height:Npx` here did nothing at all and the body dropped
  // to the .pcard-bd{min-height:80px} floor the moment the card re-rendered. That
  // is why a canvas you had just dragged taller snapped small on leaving edit mode.
  const mh=def.minH
    ? (def.type==='canvas'?`flex:none;height:${def.minH}px`:`min-height:${def.minH}px`)
    : '';
  let body,foot;
  if(def.type==='clock'){
    // Same host div mkTimeBlockCard uses, so buildClockSVG finds it by id and
    // needs no change. The clock is now a card like any other.
    // Dial and schedule wrap as one flex row: in a 1-column card the list's
    // flex-basis cannot fit beside the dial, so it drops underneath; from 2 columns
    // up they sit side by side. No setting, no container query — the card's own
    // width decides.
    body=`<div class="pcard-bd tb-clockbd" style="${mh}">
        <div id="tb-clock-wrap" class="tb-clock-host" style="width:100%;aspect-ratio:1"></div>
        <div id="tb-sched" class="tb-sched"></div>
      </div>`;
    foot='';
    setTimeout(()=>{
      if(!document.getElementById('tb-clock-wrap')) return;
      buildClockSVG();
      if(_tbClockTimer)clearInterval(_tbClockTimer);
      _tbClockTimer=setInterval(buildClockSVG,60000);
    },0);
  }else if(def.type==='timeline'){
    // The colour rides in as a custom property, so every marked state inside picks
    // it up from one place instead of each button carrying its own inline style.
    body=`<div class="pcard-bd tlcard" data-cardid="${def.id}" style="${mh};--tlc:${timelineAccent(def.id)}">${timelineCardBody(def.id)}</div>`;
    foot='';
    setTimeout(()=>tlAfter(def.id),0);
  }else if(def.type==='journal'){
    // Content is emitted inline rather than restored on a timer — journalCardBody reads the
    // entry itself — but the editor still needs the post-render pass every rich-text host
    // gets: freeze the tables, seed the undo stack.
    // Same --tlc the timeline rides in on: the grid is the same grid, so the dot on a day
    // you wrote and the chip on the day you are reading take the card's colour, not a
    // second hard-coded one.
    body=`<div class="pcard-bd jrcard" data-cardid="${def.id}" style="${mh};--tlc:${timelineAccent(def.id)}">${journalCardBody(def.id)}</div>`;
    // No footer: templates live behind the ⋯ now, so the whole card is calendar and entry.
    foot='';
    setTimeout(()=>jrAfter(def.id),0);
  }else if(def.type==='canvas'){
    // The surface is restored from the card's own slot like any other content — the
    // positions came back with it, because they never left it.

        id="card-${def.id}" data-cardid="${def.id}"></div>`;
    foot='';
    setTimeout(()=>{
      const el=document.getElementById('card-'+def.id);
      if(!el) return;
      const stored=cardHTML(def.id);
      el.innerHTML=/cv-surface/.test(stored||'')?stored:'<div class="cv-surface"></div>';
      const surf=el.querySelector('.cv-surface');
      if(surf){
        cvFit(surf);
        // Boxes saved before uids existed get one now; it persists from the next
        // save on. rtSeedUndo only clears a history that disagrees with what's on
        // screen, so restoring the same content a box already had leaves it alone.
        surf.querySelectorAll('.cv-bd').forEach(bd=>{

    },0);
  }else if(def.type==='habits'){
    body=`<div class="pcard-bd" style="${mh}" id="hcard-${def.id}">${habitCardBody(def)}</div>`;
    // The chooser is reached from the card's ⋯ menu now, so the footer button that used to
    // be the only way in is gone with the edit mode that gated it.
    foot='';
  }else{
    const html=cardHTML(def.id);
    body=`<div class="pcard-bd notes-ta" style="${mh}" id="card-${def.id}" contenteditable="true"
        oninput="saveCard('${def.id}',rtOnInput(this))" onkeydown="richtextKD(event)"></div>`;
    // Nothing in a text card's footer any more: it never starts a new period, so
    // there is no previous one to carry forward from.
    foot='';
    // Restore on a 0ms timer, the same way the four cards always have, so
    // rtFreezeTables runs after the content is in.
    setTimeout(()=>{
      const el=document.getElementById('card-'+def.id);
      if(el){ el.innerHTML=html||''; rtSeedUndo(el); }
    },0);
  }

  // Resizing is as everyday as dragging a card to reorder it, so the grips are always
  // wired; they are just invisible until you hover the card (the pgrip-q class), so a page
  // you are only reading isn't ringed with handles.
  d.innerHTML=head+body+foot+`<div class="pgrip pgrip-q" title="Drag to set height · double-click to reset"
    onmousedown="_cardRzStart(event,'${def.id}')" ondblclick="setCardHeight('${def.id}',0)"></div>
    <div class="pgrip-x pgrip-q" title="Drag to set width · double-click to reset"
    onmousedown="_cardRzxStart(event,'${def.id}')" ondblclick="setCardSpan('${def.id}',1,this.closest('.pcard'))"></div>`
    +_cardInsHTML(def,ix);

  return d;
}

// ── Adding a card where you point ──
// Which insert point is open, by the index it would insert at. A card is added after the
// card whose gap you clicked and in that card's column, instead of only ever at the end.
let _pinsAt=null;
function _pinsToggle(e,key){
  e.stopPropagation();
  _pinsAt=_pinsAt===key?null:key;
  _paddOpen=false; _cardMenuClose();
  render();
}
function _pinsClose(){ if(_pinsAt!=null){ _pinsAt=null; render(); } }
document.addEventListener('mousedown',e=>{
  if(_pinsAt==null) return;

  _pinsClose();
});
document.addEventListener('keydown',e=>{ if(_pinsAt!=null&&e.key==='Escape') _pinsClose(); });
// The same picker the page has always used to add a card, opened from a gap rather than
// from a cell at the end of the grid.
function _cardTypeMenu(cls,onpick){
  const hasClock=cardDefs().some(c=>c.type==='clock');
  return `<div class="padd-menu ${cls}" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation()">
      ${CARD_TYPES.filter(t=>!(t.id==='clock'&&hasClock)).map(t=>
        `<button class="padd-item" onclick="${onpick(t.id)}"><b>${t.name}</b><span>${t.blurb}</span></button>`).join('')}
      ${hasClock?`<div class="padd-note">The clock is already on the page — one dial per view.</div>`:''}

// An insert point on each side of the card, so "put one here" can be pointed at rather than

// in a four-column grid those are the same ordinal insert, but you should be able to aim at

// The open state is keyed on side *and* index, because a card's top point and the one above

function _cardInsHTML(def,ix){
  const sides=[['t',ix],['b',ix+1],['l',ix],['r',ix+1]];

    const k=s+':'+at, on=_pinsAt===k;

        onpointerdown="event.stopPropagation()" onclick="_pinsToggle(event,'${k}')"><i></i>${

}

// ── Card configuration ──
// Everything a card can have done to it, in one menu per card, opened from the ⋯ in its
// header. This replaced the edit mode: a second header with a boxed name field, a colour
// dot, a convert link and a × in it, shown on every card at once the moment you entered the
// mode. The menu holds the same actions and shows none of them until you ask.
let _cardMenu=null;

  const def=cardDef(id); if(!def) return;

// Repaint in place after something the open menu is showing has changed — a template added,

function _cardMenuRepaint(){ if(_cardMenu) _cardMenuPaint(_cardMenu); }
function _cardMenuToggle(e,id){
  e.stopPropagation();

function _cardMenuClose(){ if(_cardMenu){ _cardMenu=null; _cardMenuPaint(null); } }

document.addEventListener('keydown',e=>{ if(_cardMenu&&e.key==='Escape') _cardMenuClose(); });
function _cardMenuHTML(def){
  // No Rename here: the header label is contenteditable at rest, so clicking the title

  const id=def.id, it=[];
  // A journal card wears its colour dot on the month row instead, beside the ‹ — one press
  // rather than two, and it sits next to the grid the colour actually paints.
  if(def.type==='timeline'||def.type==='canvas'){
    it.push(`<button class="padd-item pm-i" onclick="_cardColour(event,'${id}')">
      <span class="chart-color-dot" style="background:${timelineAccent(def.id)};pointer-events:none"></span>Colour</button>`);

  if(def.type==='journal') it.push(_jrMenuItems(id));

    const to=def.type==='canvas'?'text':'canvas';

  }

  }

  // want out of their row, so it cannot be gated on type the way the others are.
  it.push(`<button class="padd-item pm-i" onclick="_cardFreeH('${id}')"
    >${def.freeH?'Match row height':'Free height'}</button>`);

  it.push(`<button class="padd-item pm-i pm-del" onclick="_cardDelete('${id}')">Delete card</button>`);

// Each item closes the menu first — through _cardMenuClose, which takes the node off the page.
// Clearing _cardMenu alone used to be enough only because a render was coming to sweep it away.
function _cardColour(e,id){ e.stopPropagation(); _cardMenuClose(); openChartColorPop(e,'tl_'+id); }
function _cardConvert(id,type){ _cardMenuClose(); convertCardTo(id,type); }
// Absent means "match the row", so the shared floor is what a card does unless it is told not
// to, and no existing card needs migrating.
function _cardFreeH(id){
  _cardMenuClose();
  const c=cardDef(id); if(!c) return;
  if(c.freeH) delete c.freeH; else c.freeH=true;
  _cardsDirty(); render();
}
function _cardLevers(id){ _cardMenuClose(); toggleHabitCardEdit(id); }
// removePlannerCard renders when it removes something, but it also has a confirm you can
// decline — and then the menu is closed in state and still on screen. Render for that case.
function _cardDelete(id){ _cardMenuClose(); removePlannerCard(id); if(cardDef(id)) render(); }
function setCardLabel(id,v){ const c=cardDef(id); if(c){ c.label=v; _cardsDirty(); } }
// Renaming a card is not configuration — it is the one thing you do to a card

// It never calls render(): re-rendering mid-edit would take the caret with it.
function _cardLblFocus(el){ el.dataset.prev=el.textContent; }
function _cardLblCommit(el,id){
  // Collapse the newlines a paste can smuggle in. Empty commits: a card with no

  // stays clickable (the ⠿ handle is separate, so drag is unaffected either way).

}
function _cardLblKD(e,el){
  if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); el.blur(); }
  else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); el.textContent=el.dataset.prev||''; el.blur(); }
}
function setCardFlag(id,k,v){ const c=cardDef(id); if(c){ c[k]=v; _cardsDirty(); render(); } }
// Given the card element, a width change is applied the way the drag applies it and the
// grid repacks — no render(). A full rebuild for one grid-column was the flash you saw at
// the end of every resize, and the double-click reset had it too. Without an element (no
// caller does that today) it falls back to a render so the change still lands.
function setCardSpan(id,v,card){
  const c=cardDef(id); if(!c) return;
  c.span=Math.min(PGRID_COLS,Math.max(1,Number(v)||1));
  _cardsDirty();
  if(card){ _cardApplySpan(card,cardCol(c),cardSpan(c)); packCards(); }
  else render();
}
function setCardHeight(id,px){ const c=cardDef(id); if(c){ c.minH=Math.max(0,Math.round(px)); _cardsDirty(); render(); } }
// `at` is where in the list the card goes — from the ⊕ in a card's bottom gap. Left out,
// it appends, which is what the picker at the end of the grid always did.
function addPlannerCard(type,at){
  // A second clock cannot render — the dial is looked up by a single id — so it is
  // not offered, and this guard means it cannot be added by any other route either.
  if(type==='clock'&&cardDefs().some(c=>c.type==='clock')){ _paddOpen=false; _pinsAt=null; render(); return; }
  const id='c'+Math.random().toString(36).slice(2,9);
  const defs=cardDefs();
  const ix=(at==null||at>defs.length)?defs.length:Math.max(0,at);
  // Inserted after a card, the new one shares that card's column — you asked for a card
  // *there*. Appended, it starts in the column after the last one, wrapping to the left
  // when it won't fit: where plain flow would have put it.
  const prev=defs[ix-1];
  const nextCol=(def,sp)=>{
    if(!def) return 1;
    if(at!=null) return Math.min(PGRID_COLS-sp+1,cardCol(def));
    const c=cardCol(def)+cardSpan(def);
    return c+sp-1>PGRID_COLS?1:c;
  };
  const withCol=d=>Object.assign(d,{col:nextCol(prev,cardSpan(d))});
  defs.splice(ix,0,withCol(
    // hidden:[] and not undefined — an empty array means "showing everything",
    // where a missing key means "inherit the old global hideToday flags".
    type==='habits' ? {id,type:'habits',label:'Habits',span:2,minH:0,cadence:'none',hidden:[]}
  : type==='clock'  ? clockCardDef(id)
  : type==='timeline' ? {id,type:'timeline',label:'TIMELINE',span:1,minH:0,cadence:'none'}
  : type==='canvas' ? {id,type:'canvas',label:'CANVAS',span:2,minH:320,cadence:'none'}
  : type==='journal' ? {id,type:'journal',label:'JOURNAL',span:2,minH:420,cadence:'none'}
  : {id,type:'text',label:'New card',span:1,minH:0,cadence:'none'}));

}
// Removal keeps the stored content, so a card taken off the page can come back.
function removePlannerCard(id){
  const defs=cardDefs(), i=defs.findIndex(c=>c.id===id);
  if(i<0) return;
  // A journal card is its own notebook, keyed by its id, and a card added later gets a new id —
  // so its entries survive the removal but nothing will be able to open them again. Say so.
  const kept=defs[i].type==='journal'
    ? "Its entries stay in storage, but no card will be able to open them again."
    : "What you've written in it is kept.";
  if(!confirm(`Remove "${defs[i].label}" from this page? ${kept}`)) return;

// ── Reordering ──
// Not HTML5 drag-and-drop. A reorder is a list move, not a swap — pulling a card
// out shifts everything after it — and with HTML5 DnD you can't see that until
// you let go, so the result looks random. Here the grid reflows under the cursor:
// a placeholder sits where the card will land, so what you see is what you get.
// Pointer events also give touch for free.

// Which column the pointer is over, from the grid's own box. Separate from the
// index below because a drop now answers two questions — which column the card
// belongs to, and where in that list it sits — and only the second one moves
// other cards.
// cols is how many columns are actually on screen, which below 1180px is not PGRID_COLS. Dividing
// by the constant meant a drag to the right edge of a one-column phone layout stored col:4 — you
// could not see it there, since the media queries force span 1, but the card had moved to column 4
// the next time the grid was opened on a desktop. 0 means "do not touch the stored column": one
// column has no horizontal choice to record, and writing 1 would flatten a layout you set up wide.
function _cardDropCol(x,gridRect,span,cols){
  if(!gridRect||!gridRect.width) return 0;

function _cardGridCols(grid){

  let ins=boxes.length;

    if(i===dragIx) continue;
    const b=boxes[i];
    const after = y<b.top ? true
                : y>b.bottom ? false
                : x < b.left+b.width/2;
    if(after){ ins=i; break; }

  // Removing the card first shifts every later slot down by one.

let _cardDrag=null;

  // the whole time. A mouse is unchanged: armed immediately, lifts at the 5px in pointermove.
  _cardDrag={id,card,grid,hd:e.currentTarget,x0:e.clientX,y0:e.clientY,

// A few pixels of slop, so clicking the header (or its label field) is still a click.

function _cardDragMoveTo(x,y){

    const midMin=(b.startMin+span/2+1440)%1440;
    const midA=_tbAngle(midMin);
    const fmtT=m=>`${String(Math.floor((m%1440)/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
    const durMin=span%60,durHr=Math.floor(span/60);
    const durStr=(durHr?durHr+'h ':'')+(durMin?durMin+'m':'');
    const arcStroke=_isLightColor(b.color)?'stroke="rgba(0,0,0,0.18)" stroke-width="1.5"':_isDarkColor(b.color)?'stroke="rgba(255,255,255,0.25)" stroke-width="1.5"':'';
    const tipAttrs=`data-tbid="${b.id}" data-tipname="${esc(tbName(b))}" data-tiptime="${fmtT(b.startMin)} – ${fmtT(b.endMin)}" data-tipdur="${durStr}" data-tipcolor="${b.color}"`;
    arcs+=`<path d="${ap(bRI[idx],bRO[idx],a1,a2)}" fill="${b.color}" opacity=".68" ${arcStroke} style="cursor:grab;filter:drop-shadow(0 0 4px ${b.color}88);pointer-events:none" ${tipAttrs} class="tb-arc"/>`;
    if(span<MIN_HIT_MIN){
      const padMin=(MIN_HIT_MIN-span)/2;
      const ha1=_tbAngle(((b.startMin-padMin)+1440)%1440),ha2=_tbAngle(((b.endMin+padMin)%1440+1440)%1440);
      hitArcs+=`<path d="${ap(bRI[idx],bRO[idx],ha1,ha2)}" fill="transparent" style="cursor:grab" ${tipAttrs} class="tb-arc"/>`;
    }else{
      hitArcs+=`<path d="${ap(bRI[idx],bRO[idx],a1,a2)}" fill="transparent" style="cursor:grab" ${tipAttrs} class="tb-arc"/>`;
    }
    lblMeta.push({b,span,midA});
  });
  // Feathered shadow seam at boundaries between same-color adjacent blocks
  for(let k=0;k<byStart.length;k++){
    const prev=byStart[(k-1+byStart.length)%byStart.length],cur=byStart[k];
    const gap=((blocks[cur].startMin-blocks[prev].endMin)+1440)%1440;
    if(gap<5&&blocks[cur].color===blocks[prev].color){
      const seamA=_tbAngle(blocks[prev].endMin),seamW=0.5;
      const ri=Math.min(bRI[prev],bRI[cur]),ro=Math.max(bRO[prev],bRO[cur]);
      const sid=`tbs${k}`;
      const [gx1,gy1]=_tbPt(TB_RM,seamA-seamW/2),[gx2,gy2]=_tbPt(TB_RM,seamA+seamW/2);
      defs+=`<linearGradient id="${sid}" gradientUnits="userSpaceOnUse" x1="${gx1.toFixed(1)}" y1="${gy1.toFixed(1)}" x2="${gx2.toFixed(1)}" y2="${gy2.toFixed(1)}"><stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="50%" stop-color="rgba(0,0,0,0.55)"/><stop offset="100%" stop-color="rgba(0,0,0,0)"/></linearGradient>`;
      arcs+=`<path d="${ap(ri,ro,seamA-seamW/2,seamA+seamW/2)}" fill="url(#${sid})" style="pointer-events:none"/>`;
    }
  }
  defs+='</defs>';
  // Collision avoidance: larger blocks get inner tier, colliding smaller blocks pushed outward
  lblMeta.sort((a,b)=>b.span-a.span);
  lblMeta.forEach(l=>l.tier=0);
  for(let i=0;i<lblMeta.length;i++){
    for(let j=i+1;j<lblMeta.length;j++){
      const diff=Math.abs(((lblMeta[j].midA-lblMeta[i].midA+540)%360)-180);
      if(diff<22) lblMeta[j].tier=Math.max(lblMeta[j].tier,lblMeta[i].tier+1);
    }
  }
  // Render external radial labels
  lblMeta.forEach(({b,midA,tier})=>{
    const rLine=TB_RO+2,rText=TB_RO+11+tier*14;
    const [lx1,ly1]=pt(rLine,midA),[lx2,ly2]=pt(rText-4,midA),[tx,ty]=pt(rText+2,midA);
    const cosA=Math.cos(midA*Math.PI/180);
    const anchor=cosA>0.15?'start':cosA<-0.15?'end':'middle';
    const baseColor=_visColor(b.color);
    const lblColor=(_isLightColor(b.color)||_isDarkColor(b.color))?baseColor:_lighten(b.color,0.35);
    labels+=`<line x1="${lx1.toFixed(1)}" y1="${ly1.toFixed(1)}" x2="${lx2.toFixed(1)}" y2="${ly2.toFixed(1)}" stroke="${lblColor}" stroke-width="1.2" opacity=".7" style="pointer-events:none"/>`;
    labels+=`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="5.5" font-weight="700" letter-spacing=".03em" fill="${lblColor}" font-family="Inter,system-ui" style="pointer-events:none">${esc(tbName(b))}</text>`;
  });
  // Current time dot
  const nowA=_tbAngle(nowMin),[nx,ny]=pt(TB_RO-1,nowA);
  const nowDot=`<circle cx="${nx.toFixed(2)}" cy="${ny.toFixed(2)}" r="5" fill="${darkMode?'#fff':'#18181B'}" stroke="${darkMode?'#1A1A1E':'#fff'}" stroke-width="1.5" style="pointer-events:none"/>`;
  // Center time + day display — shows drag range while dragging
  const fmt=m=>`${String(Math.floor((m%1440)/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  let centerMain=timeStr,centerSub=DAY_NAMES[todayDow].toUpperCase(),centerSubSize='8';
  let centerDur='';
  if(_tbDrag&&_tbDrag.moved){
    const db=(D.timeBlocks||[]).find(b=>b.id===_tbDrag.id);
    if(db){
      centerMain=fmt(db.startMin);centerSub=`→ ${fmt(db.endMin)}`;centerSubSize='10';
      const sp=((db.endMin-db.startMin)+1440)%1440;
      const dh=Math.floor(sp/60),dm=sp%60;
      centerDur=(dh?dh+'h ':'')+(dm?dm+'m':'');
    }
  }
  const center=`<text x="${CX}" y="${CY-(centerDur?14:9)}" text-anchor="middle" dominant-baseline="middle" font-size="26" font-weight="600" fill="${cc.overall}" font-family="Inter,system-ui" letter-spacing="-.05em" style="pointer-events:none">${centerMain}</text>
  <text x="${CX}" y="${CY+(centerDur?4:9)}" text-anchor="middle" dominant-baseline="middle" font-size="${centerSubSize}" font-weight="700" fill="${cc.ticks}" font-family="Inter,system-ui" letter-spacing=".06em" style="pointer-events:none">${centerSub}</text>
  ${centerDur?`<text x="${CX}" y="${CY+18}" text-anchor="middle" dominant-baseline="middle" font-size="8" font-weight="600" fill="${cc.ticks}" font-family="Inter,system-ui" letter-spacing=".05em" opacity=".7" style="pointer-events:none">${centerDur}</text>`:''}` ;
  // Invisible click target for adding new blocks
  const clickRing=`<path d="${ap(TB_RI,TB_RO,-90+360,-90)}" fill="transparent" style="cursor:crosshair" id="tb-ring-bg"/>`;
  const trackFill=`<path d="${ap(TB_RI,TB_RO,-90,270)}" fill="${darkMode?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)'}" style="pointer-events:none"/>`;
  const svg=`<svg id="tb-svg" viewBox="0 0 220 220" width="100%" height="100%" style="overflow:visible;display:block">
    <circle cx="${CX}" cy="${CY}" r="${TB_RO}" fill="none" stroke="${cc.grid}" stroke-width="1" opacity=".6"/>
    <circle cx="${CX}" cy="${CY}" r="${TB_RI}" fill="none" stroke="${cc.grid}" stroke-width=".6" opacity=".3"/>
    ${defs}${trackFill}${clickRing}${ticks}${arcs}${labels}${hitArcs}${center}${nowDot}
  </svg>`;
  wrap.innerHTML=svg;
  wrap.querySelectorAll('.tb-arc').forEach(el=>{
    el.addEventListener('mousedown',_tbMouseDown);
    el.addEventListener('touchstart',e=>{
      const t=e.touches[0];
      const target=e.currentTarget;
      const sx=t.clientX,sy=t.clientY;
      _tbTouchPending={sx,sy};
      clearTimeout(_tbTouchTimer);
      _tbTouchTimer=setTimeout(()=>{
        _tbTouchTimer=null;
        if(!_tbTouchPending)return;
        _tbTouchPending=null;
        _tbMouseDown({preventDefault:()=>{},stopPropagation:()=>{},currentTarget:target,clientX:sx,clientY:sy});
      },180);
    },{passive:true});
  });
  if(!wrap._touchBound){
    wrap._touchBound=true;
    document.addEventListener('touchmove',e=>{
      const t=e.touches[0];
      if(_tbDrag){
        e.preventDefault();
        _tbMouseMove({clientX:t.clientX,clientY:t.clientY});
        return;
      }
      if(_tbTouchPending){
        const dx=t.clientX-_tbTouchPending.sx,dy=t.clientY-_tbTouchPending.sy;
        if(Math.sqrt(dx*dx+dy*dy)>10){
          clearTimeout(_tbTouchTimer);_tbTouchTimer=null;_tbTouchPending=null;
        }
      }
    },{passive:false});
    const _tbTouchEnd=()=>{
      clearTimeout(_tbTouchTimer);_tbTouchTimer=null;_tbTouchPending=null;
      if(!_tbDrag)return;
      _tbMouseUp({});
    };
    document.addEventListener('touchend',_tbTouchEnd);
    document.addEventListener('touchcancel',_tbTouchEnd);
  }
  // Custom instant tooltip
  if(!document.getElementById('tb-tip')){
    const t=document.createElement('div');t.id='tb-tip';
    t.style.cssText='position:fixed;display:none;z-index:600;pointer-events:none;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:10px 13px;font-family:var(--font);box-shadow:0 8px 24px rgba(0,0,0,.13);white-space:nowrap;min-width:140px';
    document.body.appendChild(t);
  }
  const tbTip=document.getElementById('tb-tip');
  const svg_tip=document.getElementById('tb-svg');
  if(svg_tip){
    svg_tip.addEventListener('mouseover',e=>{
      const a=e.target.closest('.tb-arc');
      if(a&&a.dataset.tipname&&!_tbDrag){
        tbTip.innerHTML=`<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px"><span style="width:8px;height:8px;border-radius:50%;background:${a.dataset.tipcolor};flex-shrink:0;display:inline-block"></span><span style="font-size:12px;font-weight:700;color:var(--text1);letter-spacing:-.01em">${a.dataset.tipname}</span></div><div style="font-size:11px;color:var(--text2);font-weight:500;padding-left:15px">${a.dataset.tiptime}</div><div style="font-size:10px;color:var(--text3);font-weight:500;padding-left:15px;margin-top:2px">${a.dataset.tipdur}</div>`;
        tbTip.style.display='block';
      } else tbTip.style.display='none';
    });
    svg_tip.addEventListener('mousemove',e=>{if(tbTip.style.display==='block'){tbTip.style.left=(e.clientX+16)+'px';tbTip.style.top=(e.clientY-44)+'px';}});
    svg_tip.addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('.tb-arc'))tbTip.style.display='none';});
  }
  // Click on empty ring area to add
  const svg_el=document.getElementById('tb-svg');
  if(svg_el) svg_el.addEventListener('click',e=>{
    if(e.target.classList.contains('tb-arc')||_tbDrag?.moved) return;
    const clickMin=_tbMouseMin(e);
    const hit=(D.timeBlocks||[]).some(b=>{
      const span=((b.endMin-b.startMin)+1440)%1440;
      const rel=((clickMin-b.startMin)+1440)%1440;
      return rel<span;
    });
    if(!hit&&e.target.closest('svg')){
      const snap=Math.round(clickMin/15)*15;
      openTimeBlockModal({id:_tbUuid(),name:'',startMin:snap,endMin:(snap+60)%1440,color:TB_COLORS[0],days:[]});
    }
  });
  buildTbSchedule();
}

// Today's blocks as a list, so the times and durations are readable without
// hovering every arc. Deliberately standalone rather than woven into the arc loop:
// it re-derives today's blocks from D the same way buildClockSVG does, and is
// called from its tail, so the dial's geometry code stays untouched.
function buildTbSchedule(){
  const el=document.getElementById('tb-sched'); if(!el) return;
  const now=new Date(), dow=now.getDay(), nowMin=now.getHours()*60+now.getMinutes();
  const blocks=(D.timeBlocks||[]).filter(b=>!b.days||b.days.length===0||b.days.includes(dow))
                                 .slice().sort((a,b)=>a.startMin-b.startMin);
  // Same formatting as the arc tooltips, so the list and the hover can never disagree.
  const fmtT=m=>`${String(Math.floor((m%1440)/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  const spanOf=b=>((b.endMin-b.startMin)+1440)%1440;
  const durStr=n=>{ const h=Math.floor(n/60),m=n%60; return (h?h+'h':'')+(m?(h?' ':'')+m+'m':'')||'0m'; };
  // A block that crosses midnight covers now if now is past its start or before its end.
  const covers=(b,n)=>{ const s=spanOf(b); return s>0&&((n-b.startMin)+1440)%1440<s; };
  if(!blocks.length){ el.innerHTML='<div class="tb-none">No blocks today.</div>'; return; }
  let total=0;
  const rows=blocks.map(b=>{
    const s=spanOf(b); total+=s;
    return `<div class="tb-row${covers(b,nowMin)?' tb-now':''}" data-tbid="${esc(b.id)}">
      <span class="tb-dot" style="background:${esc(b.color)}"></span>
      <span class="tb-nm">${esc(tbArrows(b.name||'Untitled'))}</span>
      <span class="tb-rg">${fmtT(b.startMin)}–${fmtT(b.endMin)}</span>
      <span class="tb-du">${durStr(s)}</span>
    </div>`;
  }).join('');
  el.innerHTML=rows+`<div class="tb-tot"><span>Scheduled</span><span>${durStr(total)}</span></div>`;
  el.querySelectorAll('.tb-row').forEach(r=>{
    r.onclick=e=>{
      const b=(D.timeBlocks||[]).find(x=>x.id===r.dataset.tbid);
      if(!b) return;
      // The name is the one thing you rename constantly, so it edits in place.
      // Everything else on the row still opens the full modal.
      const nm=e.target.closest?e.target.closest('.tb-nm'):null;
      if(nm&&r.contains(nm)) tbEditName(nm,b);
      else openTimeBlockModal(b);
    };
  });
}
// Swap the name for an input seeded with it. Enter or blur commits through
// saveTimeBlock, the same path the modal uses; Escape puts the name back.
function tbEditName(span,block){
  if(span.querySelector('input')) return;
  const inp=document.createElement('input');
  inp.className='tb-nmin';
  inp.value=block.name||'';
  inp.oninput=()=>tbNameInput(inp);
  span.textContent='';
  span.appendChild(inp);
  inp.focus(); inp.select();
  let done=false;
  const finish=commit=>{
    if(done) return; done=true;
    const v=tbArrows((inp.value||'').trim());
    if(commit&&v&&v!==block.name){ saveTimeBlock({...block,name:v}); }
    buildTbSchedule();
  };
  inp.onblur=()=>finish(true);
  inp.onclick=e=>e.stopPropagation();
  inp.onkeydown=e=>{
    e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); finish(true); }
    else if(e.key==='Escape'){ e.preventDefault(); finish(false); }
  };
}
function tbSelectGroup(name,color,gid){
  const inp=document.getElementById('tb-name');if(inp)inp.value=name;
  // Store the group id so the saved block can track it
  const overlay=document.getElementById('tb-overlay');
  if(overlay&&gid) overlay.dataset.gid=gid; else if(overlay) delete overlay.dataset.gid;
  document.querySelectorAll('#tb-overlay [data-color]').forEach(s=>s.style.border='2.5px solid transparent');
  const customBtn=document.getElementById('tb-custom-color');
  if(customBtn)customBtn.style.border='2.5px solid transparent';
  const m=[...document.querySelectorAll('#tb-overlay [data-color]')].find(s=>s.dataset.color===color);
  if(m){
    m.style.border='2.5px solid var(--text1)';
  } else if(customBtn){
    customBtn.style.border='2.5px solid var(--text1)';
    customBtn.dataset.custom=color;
    const ci=customBtn.querySelector('input');
    if(ci)ci.value=color;
  }
}

  const dayBtns=dowOrder().map(i=>{const l=DOW[i],on=(b.days||[]).includes(i);return `<button type="button" class="tb-day-btn" data-day="${i}" onclick="tbToggleDay(this)" style="font-size:9px;padding:2px 6px;border-radius:4px;border:1px solid var(--border2);background:${on?'var(--text1)':'var(--surface2)'};color:${on?'var(--bg)':'var(--text3)'};cursor:pointer;font-family:var(--font)">${l}</button>`;}).join('');
  const swatches=TB_COLORS.map(c=>`<button type="button" onclick="tbPickColor(this)" data-color="${c}" style="width:20px;height:20px;border-radius:50%;background:${c};border:2.5px solid ${b.color===c?'var(--text1)':'transparent'};cursor:pointer;outline:none;flex-shrink:0"></button>`).join('');
  const grps=(activeGroups()||[]).filter(g=>!g._default);

    <div style="display:flex;gap:10px;margin-bottom:14px">

      <button onclick="closeTimeBlockModal()" style="background:none;border:1px solid var(--border2);border-radius:var(--r2);padding:7px 14px;cursor:pointer;color:var(--text2);font-family:var(--font);font-size:12px">Cancel</button>

  document.body.appendChild(overlay);
