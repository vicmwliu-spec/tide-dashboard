function mk(y,m){ return `${y}-${String(m+1).padStart(2,'0')}` }

function md(y,m){
  const k=mk(y,m);
  if(!D.months[k]) D.months[k]={quote:'',notes:'',completions:{},skips:{}};
  if(!D.months[k].skips) D.months[k].skips={};
  return D.months[k];
}

function dim(y,m){ return new Date(y,m+1,0).getDate() }
function fdow(y,m){ return new Date(y,m,1).getDay() }

// Returns [{week:N, start:d, end:d}, ...] for the current month
function getWeekSpans(y,m){
  const days=dim(y,m);
  const fd=(new Date(y,m,1).getDay()+6)%7; // 0=Mon
  const spans=[];
  let curWeek=0,wStart=1;
  for(let d=1;d<=days;d++){
    const wn=Math.ceil((d+fd)/7);
    if(wn!==curWeek){
      if(curWeek>0) spans.push({week:curWeek,start:wStart,end:d-1});
      curWeek=wn; wStart=d;
    }
  }
  spans.push({week:curWeek,start:wStart,end:days});
  return spans;
}

function allHabits(){ return D.groups.flatMap(g=>g.habits.map(h=>({...h,gid:g.id,gc:g.color,gn:g.name}))) }

function activeGroups(){
  const m=D.months[mk(CY,CM)];
  return (m&&m.snapshot)?m.snapshot.groups:D.groups;
}
function _snapPoints(snap){
  if(!snap) return [];
  if(snap.points) return snap.points;
  if(snap.groups) return [{through:Infinity,groups:snap.groups}];
  return [];
}
function _habitInAnySnapshot(mo,hid){
  if(!mo) return false;
  if(mo.snapshot?.groups?.some(sg=>sg.habits.some(sh=>sh.id===hid))) return true;
  if(mo.weekSnapshots){
    for(const snap of Object.values(mo.weekSnapshots)){
      for(const pt of _snapPoints(snap)){
        if(pt.groups.some(sg=>sg.habits.some(sh=>sh.id===hid))) return true;
      }
    }
  }
  return false;
}
function activeGroupsForWeek(y,m,weekIndex,day){
  const mo=D.months[mk(y,m)];
  const snap=mo&&mo.weekSnapshots&&mo.weekSnapshots[weekIndex];
  if(day===undefined){
    if(mo&&mo.weekArchived&&mo.weekArchived[weekIndex]&&snap){
      const points=_snapPoints(snap);
      if(points.length) return points[points.length-1].groups;
    }
    return (mo&&mo.snapshot)?mo.snapshot.groups:D.groups;
  }
  const points=_snapPoints(snap);
  const pt=points.find(p=>day<=p.through);
  if(pt) return pt.groups;
  return (mo&&mo.snapshot)?mo.snapshot.groups:D.groups;
}
function isWeekArchived(weekIndex){
  const m=D.months[mk(CY,CM)];
  return !!(m&&m.weekArchived&&m.weekArchived[weekIndex]);
}
function weekOfDay(y,m,day){
  if(m===undefined){ day=y; m=CM; y=CY; }
  const spans=getWeekSpans(y,m);
  const s=spans.find(sp=>day>=sp.start&&day<=sp.end);
  return s?s.week:1;
}
function groupsForDay(y,m,day){
  if(m===undefined){ day=y; m=CM; y=CY; }
  return activeGroupsForWeek(y,m,weekOfDay(y,m,day),day);
}
function activeFathomItems(){
  const m=D.months[mk(CY,CM)];
  return (m&&m.snapshot)?m.snapshot.fathomItems:(D.fathom?.items||[]).filter(i=>!i.archived);
}
function isMonthArchived(){
  const m=D.months[mk(CY,CM)];
  return !!(m&&m.archived);
}
function hasMonthSnapshot(){
  const m=D.months[mk(CY,CM)];
  return !!(m&&m.snapshot);
}

// ── Daily-target helpers ──
// Fractional credit for a raw count value against a target (0..1). Legacy booleans coerce.
function _countFrac(v,target){ const t=Math.max(1,target||1); return Math.min(Number(v)||0,t)/t; }
// The habit's daily target for a given day (resolves via the day's active groups). Default 1.
function habitTarget(hid,day){
  for(const g of groupsForDay(day)){const h=g.habits.find(h=>h.id===hid);if(h)return Math.max(1,h.dailyTarget||1);}
  return 1;
}
// Numeric completion count for the current month (legacy true->1).
function chkCount(hid,day){
  const mo=D.months[mk(CY,CM)];
  if(!mo||!mo.completions[hid]) return 0;
  return Number(mo.completions[hid][day])||0;
}
// Partial credit (0..1) for the current month.
function chkFrac(hid,day){ return _countFrac(chkCount(hid,day),habitTarget(hid,day)); }
function isChk(hid,day){
  // Fully complete = count reached the daily target.
  return chkCount(hid,day)>=habitTarget(hid,day)&&chkCount(hid,day)>0;
}
function isSkip(hid,day){
  const mo=D.months[mk(CY,CM)];
  return !!(mo?.skips?.[hid]?.[day]);
}
function isFreqExcluded(hid,day){
  for(const g of groupsForDay(day)){const h=g.habits.find(h=>h.id===hid);if(h){if(!h.freq||h.freq.length>=7)return false;return!h.freq.includes(new Date(CY,CM,day).getDay());}}
  return false;
}

function toggle(hid,day){
  let startMoved=false;
  for(const g of groupsForDay(day)){
    const h=g.habits.find(h=>h.id===hid);
    if(h&&h.startDate){
      const cellDate=new Date(CY,CM,day);
      if(cellDate<new Date(h.startDate+'T00:00:00')){
        const newStart=`${CY}-${String(CM+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        if(!confirm(`"${h.name}" starts on ${fmtDate(h.startDate)}. Move the start date back to ${fmtDate(newStart)} to log this day?`))return;
        h.startDate=newStart;
        applyHabitStartDateSkips(hid,h.startDate);
        startMoved=true;
      }
    }
    break;
  }
  const mo=md(CY,CM);
  if(!mo.completions[hid]) mo.completions[hid]={};
  if(!mo.skips[hid]) mo.skips[hid]={};
  mo.skips[hid][day]=false;
  // Increment toward the daily target; clicking at (or above) full resets to 0.
  const t=habitTarget(hid,day);
  const c=Number(mo.completions[hid][day])||0;
  mo.completions[hid][day]=c>=t?0:c+1;
  save();
  if(startMoved) render(); else partialUpdate(hid,day);
}
function skipToggle(hid,day){
  const mo=md(CY,CM);
  if(!mo.completions[hid]) mo.completions[hid]={};
  if(!mo.skips[hid]) mo.skips[hid]={};
  const skip=!!mo.skips[hid][day];
  mo.completions[hid][day]=0;
  mo.skips[hid][day]=!skip;
  save();
}

function dayProg(day){
  const cellDate=new Date(CY,CM,day);
  const dow=cellDate.getDay();
  const h=groupsForDay(day).flatMap(g=>g.habits.map(hb=>({...hb,gid:g.id}))).filter(hb=>{
    if(hb.archived) return false;
    if(hb.startDate&&new Date(hb.startDate+'T00:00:00')>cellDate) return false;
    if(hb.freq&&hb.freq.length<7&&!hb.freq.includes(dow)) return false;
    return true;
  });
  let done=0,total=0;
  h.forEach(hb=>{if(!isSkip(hb.id,day)){total++;done+=chkFrac(hb.id,day);}});
  return {done,total,pct:total?Math.floor(done/total*100):0};
}

function habitProg(hid){
  const days=dim(CY,CM);
  let isArch=false;
  for(const g of activeGroups()){const h=g.habits.find(h=>h.id===hid);if(h){isArch=!!h.archived;break;}}
  if(isArch) return {goal:days,actual:0,pct:0,last:0};
  const today=new Date();
  const isCur=today.getFullYear()===CY&&today.getMonth()===CM;
  const last=isCur?today.getDate():days;
  let done=0,possible=0;
  for(let d=1;d<=last;d++){if(isFreqExcluded(hid,d))continue;if(!isSkip(hid,d)){possible++;done+=chkFrac(hid,d);}}
  return {goal:days,actual:done,pct:possible?Math.round(done/possible*100):0,last:possible};
}

function monthStats(){
  const habits=activeGroups().flatMap(g=>g.habits.filter(hb=>!hb.archived));
  const days=dim(CY,CM);
  const today=new Date();
  const isCur=today.getFullYear()===CY&&today.getMonth()===CM;
  const td=isCur?today.getDate():days;
  const dLeft=isCur?days-td:0;
  let comp=0,poss=0;
  for(let d=1;d<=td;d++){const p=dayProg(d);comp+=p.done;poss+=p.total;}
  const rate=poss?Math.floor(comp/poss*100):0;
  const futPoss=habits.length*dLeft;
  const maxRate=(poss+futPoss)?Math.floor((comp+futPoss)/(poss+futPoss)*100):0;
  const monthGroups=activeGroups().filter(g=>!g._default).map(g=>{
    const hs=g.habits.filter(hb=>!hb.archived);
    let gd=0,gt=0;
    for(let d=1;d<=td;d++){
      const dow=new Date(CY,CM,d).getDay();
      const dayG=groupsForDay(d).find(dg=>dg.id===g.id);
      const dayHs=dayG?dayG.habits.filter(hb=>!hb.archived):[];
      dayHs.forEach(hb=>{if(hb.freq&&hb.freq.length<7&&!hb.freq.includes(dow))return;if(!isSkip(hb.id,d)){gt++;gd+=chkFrac(hb.id,d);}});
    }
    const gFutPoss=hs.length*dLeft;
    const maxRate=(gt+gFutPoss)?Math.floor((gd+gFutPoss)/(gt+gFutPoss)*100):0;
    return {...g,pct:gt?Math.floor(gd/gt*100):0,gt,gd,maxRate};
  });
  const isPast=CY<today.getFullYear()||(CY===today.getFullYear()&&CM<today.getMonth());
  const isFuture=!isCur&&!isPast;
  return {comp,poss,rate,dLeft,td,isCur,isPast,isFuture,maxRate,monthGroups,futPoss};
}

function allTimeTotal(){
  let t=0;
  Object.values(D.months).forEach(m=>{
    Object.values(m.completions).forEach(hc=>{
      Object.values(hc).forEach(v=>{if(v)t++});
    });
  });
  return t;
}


function cumulData(){
  const days=dim(CY,CM);
  const h=activeGroups().flatMap(g=>g.habits.map(hb=>({...hb,gid:g.id})));
  if(!h.length) return {overall:[],groups:[]};
  const overall=[];
  for(let d=1;d<=days;d++){
    const p=dayProg(d);
    overall.push({x:d,y:p.pct});
  }
  // Per-day % line for a single habit (100 when checked, else 0) — matches group/overall style.
  const habitLine=(hb,g)=>{
    const pts=[];
    for(let d=1;d<=days;d++) pts.push({x:d,y:isSkip(hb.id,d)?0:Math.round(chkFrac(hb.id,d)*100)});
    return {id:hb.id,name:hb.name,color:habitColor(hb,g),data:pts};
  };
  let groups=[];
  if(chartUnit==='habit'){
    // One line per habit across every group.
    activeGroups().forEach(g=>g.habits.filter(hb=>!hb.archived).forEach(hb=>groups.push(habitLine(hb,g))));
  } else {
    // One line per real group; ungrouped habits (the _default bucket) show as
    // individual habit lines so there's no phantom "Habits" group.
    activeGroups().forEach(g=>{
      if(g._default){
        g.habits.filter(hb=>!hb.archived).forEach(hb=>groups.push(habitLine(hb,g)));
        return;
      }
      const pts=[];
      for(let d=1;d<=days;d++){
        let done=0,tot=0;
        g.habits.forEach(hb=>{if(!isSkip(hb.id,d)){tot++;done+=chkFrac(hb.id,d);}});
        pts.push({x:d,y:tot?Math.floor(done/tot*100):0});
      }
      groups.push({id:g.id,name:g.name,color:g.color,data:pts});
    });
  }
  return {overall,groups};
}
function firstActiveDay(){
  const days=dim(CY,CM);
  for(let d=1;d<=days;d++){if(dayProg(d).total>0)return d;}
  return 1;
}
function cumulProgressData(){
  const days=dim(CY,CM);
  const now=new Date();
  const todayD=(CY===now.getFullYear()&&CM===now.getMonth()+1)?now.getDate():days;
  let monthTotal=0;
  for(let d=1;d<=days;d++) monthTotal+=dayProg(d).total;
  if(!monthTotal) return [];
  const pts=[];let done=0;
  for(let d=1;d<=days;d++){
    if(d<=todayD){const p=dayProg(d);done+=p.done;pts.push({x:d,y:Math.round(done/monthTotal*100)});}
  }
  return pts;
}

function render(){

  // height across the teardown so it can't, and put the offset back either way.

      {key:'seSuccess',color:_seoc.seSuccess||'#F59E0B',label:'Upwards',dashed:false},
      {key:'seFailure',color:_seoc.seFailure||'#DC2626',label:'Downwards',dashed:false},

    ].map(({key,color,label,dashed})=>`<div style="display:flex;flex-direction:column;align-items:center;gap:3px">
      ${key?`<span class="chart-color-dot" title="${label}" style="background:${color}" onclick="openChartColorPop(event,'${key}')"></span>`:`<div style="width:11px;height:11px"></div>`}
      <div style="width:20px;height:2px;${dashed?`background:repeating-linear-gradient(90deg,${color} 0,${color} 4px,transparent 4px,transparent 8px)`:`background:${color}`}"></div>
      <span style="font-size:10px;color:var(--text3);white-space:nowrap">${label}</span>
    </div>`).join('');
    seCard.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><span style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)">Alignment</span><div style="display:flex;gap:14px;align-items:flex-end">${_seLegendItems}</div></div><div class="chart-wrap" style="height:260px"><canvas id="se-all-time"></canvas></div>`;
    app.appendChild(seCard);
    setTimeout(()=>buildSlightEdgeChart('se-all-time'),0);
    app.appendChild(mkAnnual());
  } else {
    app.appendChild(mkStats());
    app.appendChild(mkGridHorizontal());
    if(editMode){const ap=mkArchivedPanel();if(ap)app.appendChild(ap);}
    app.appendChild(mkFathomGrid());
    app.appendChild(mkTide());
    _applyAllCommentMarkers();
  }
  document.addEventListener('click',closePop,{capture:true});
  if(wasSel){
    _sel.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('sel');else _sel.delete(id)});
  }
  _updSelBar();
  _updEditBar();
  // Release the pin now the real content is back, and restore the offset. The
  // second restore is for the case where a card's own 0ms fill changes the height.
  app.style.minHeight='';
  if(window.scrollY!==_sy) window.scrollTo(0,_sy);
  setTimeout(()=>{ if(window.scrollY!==_sy) window.scrollTo(0,_sy); },0);
  // Runs after the card editors have filled themselves in (they restore on a 0ms timer).
  setTimeout(rtFreezeTables,0);
  // Same reason: cards are only their real height once their content has landed.
  packCards();
  setTimeout(packCards,0);
  // Re-arm the observer over the cards this render just built.
  packObserve();
}
// How many of the grid's fine rows each card needs. Cards are laid out in 4px rows
// with no row gap, so a card spans ceil((its height + the 14px gap) / 4) of them and
// the gap comes out of the span. Shorten a card and it claims fewer rows, which is
// what lets the card below it rise into the space instead of leaving a hole.
const PGRID_ROW=4, PGRID_GAP=14;
function packCards(){
  document.querySelectorAll('.pgrid').forEach(g=>{
    [...g.children].forEach(c=>{
      if(!c.classList||!c.classList.contains('pcard')&&!c.classList.contains('paddcard')) return;
      c.style.gridRowEnd='';
      // A lifted card is out of the flow, and anything unmeasurable (a hidden view,
      // or a test environment with no layout) is left alone rather than guessed at.
      if(c.classList.contains('pdrag')) return;
      const h=c.getBoundingClientRect().height;
      if(!h) return;
      c.style.gridRowEnd='span '+Math.max(1,Math.ceil((h+PGRID_GAP)/PGRID_ROW));
    });
  });
}
window.addEventListener('resize',packCards);
// A card can grow long after the render that placed it — you type a line, a table
// gains a row, a webfont lands late. .pgrid is align-items:start, so a card is sized
// by its own content and not stretched to its grid area: outgrow the span and the
// card spills past its box and is painted over by the one below instead of pushing
// it down. So the spans follow the real heights rather than the heights at render.
let _packRAF=0;
function _packSoon(){
  if(_packRAF) return;
  _packRAF=requestAnimationFrame(()=>{ _packRAF=0; packCards(); });
}
const _packRO=typeof ResizeObserver!=='undefined'?new ResizeObserver(_packSoon):null;
// Cards are rebuilt on every render, so the old ones are dropped rather than piling
// up. Observing deliberately does not happen inside packCards: a fresh observe fires
// a callback immediately, and repacking from that would never settle.
function packObserve(){
  if(!_packRO) return;
  _packRO.disconnect();
  document.querySelectorAll('.pgrid > .pcard').forEach(c=>_packRO.observe(c));
}

// ─── TIMELINE CARD ───────────────────────────────────────────────
// The one place the month lives, now the ribbon under the header has gone. Weeks
// are rows, numbered the way the rest of the app numbers them, so a week here and
// a WK n anywhere else are the same week. Today is ringed, the day the page is
// showing is filled, and the quarter underneath names all three of its months so
// nothing points anywhere — it says where August sits, not what it is building to.
// The card's colour is yours: D.chartColors.tl_<id> if you have set one, and the
// app's own accent if you haven't.
function timelineAccent(id){ return (id&&D.chartColors&&D.chartColors['tl_'+id])||gradeAccent(); }
function timelineCardBody(id){
  const ac=timelineAccent(id);
  const y=PD.getFullYear(),m=PD.getMonth(),days=dim(y,m),sel=PD.getDate();
  const isThisMonth=y===now.getFullYear()&&m===now.getMonth();
  const today=isThisMonth?now.getDate():0;
  const hd=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(n=>`<div class="tl-h">${n}</div>`).join('');
  const rows=getWeekSpans(y,m).map(sp=>{
    const cells=[];
    // Mon=0, so the first row is padded out to the weekday the month starts on.
    const lead=(new Date(y,m,sp.start).getDay()+6)%7;
    for(let i=0;i<lead;i++) cells.push('<div class="tl-d tl-pad"></div>');
    for(let n=sp.start;n<=sp.end;n++){
      const cls=['tl-d'];
      if(today&&n<today) cls.push('past');
      if(n===today) cls.push('now');
      if(n===sel) cls.push('sel');
      cells.push(`<button class="${cls.join(' ')}" onclick="goDay(${n})">${n}</button>`);
    }
    while(cells.length<7) cells.push('<div class="tl-d tl-pad"></div>');
    return `<div class="tl-wk"><span class="tl-wn">W${sp.week}</span><div class="tl-days">${cells.join('')}</div></div>`;
  }).join('');
  const q=Math.floor(m/3);
  // All three months named, current one marked. Bars followed by a month name read
  // as a progress meter arriving at that month; three peers cannot.
  const qmon=[0,1,2].map(i=>{
    const mi=q*3+i;
    return `<span class="tl-qm${mi===m?' on':''}">${MON[mi].slice(0,3)}</span>`;
  }).join('<i>·</i>');
  // The remainder is only a fact about the month you are actually in.
  const remain=isThisMonth?days-today:0;
  return `<div class="tl-grid"><div class="tl-hd">${hd}</div>${rows}</div>
    <div class="tl-foot">
      <div class="tl-pos"><b>Day ${sel} of ${days}</b>${
        isThisMonth?`<span>${remain} Day${remain===1?'':'s'} Remaining</span>`:''}</div>
      <div class="tl-q"><em>Q${q+1}</em>${qmon}</div>
    </div>`;
}

// ─── CANVAS CARD ─────────────────────────────────────────────────
// A card you place things on rather than write down. Every box is an ordinary
// rich-text host — .cv-bd is in RT_HOSTS — so tables, lists, checkboxes, toggles
// and the slash menu all work inside one on the first day, with no second editor
// to keep in step with the first.
//
// The position IS the content: left/top/width sit in the box's own style attribute,
// so a canvas serializes as the card's HTML exactly like prose does and saveCard,
// cardHTML and the Supabase sync need no changes at all. Everything you see while
// dragging — the handle strip, the resize handles, the guides, the marquee — is
// drawn on #cv-ctl, a fixed overlay on <body>, so none of it can reach storage.
const CV_W=300;        // a new box's width
const CV_DRAG=5;       // px before a press counts as a drag
const CV_MARQ=4;       // below this a marquee was really a click
const CV_SNAP=6;       // how near an edge has to be to snap to it
const CV_MINW=60, CV_MINH=24;
let _cvDrag=null,_cvRz=null,_cvMarq=null,_cvHover=null;

function cvCard(n){ return n&&n.closest?n.closest('.cvcard'):null; }
function cvSurf(n){ const c=cvCard(n); return c&&c.querySelector('.cv-surface'); }
function cvBoxes(surf){ return surf?[...surf.querySelectorAll('.cv-box')]:[]; }
function cvNum(v){ return parseFloat(v)||0; }
function cvPos(b){
  return {x:cvNum(b.style.left),y:cvNum(b.style.top),
          w:b.offsetWidth||cvNum(b.style.width)||CV_W,h:b.offsetHeight||CV_MINH};
}
// Grow the surface to hold whatever is on it, so the card scrolls to reach a box
// placed past its bottom edge rather than clipping it.
function cvFit(surf){
  if(!surf) return;
  let r=0,b=0;
  cvBoxes(surf).forEach(el=>{ const p=cvPos(el); r=Math.max(r,p.x+p.w); b=Math.max(b,p.y+p.h); });
  // ...and never smaller than the card. The surface is what a click has to land on
  // to make a box, and an inline min-height beats .cv-surface{min-height:100%}, so
  // the fill has to be written here rather than left to the stylesheet. Without it
  // everything below the lowest box is bare .cvcard, and clicking there does nothing
  // — which is what a canvas looked like once the card became a fixed-height box.
  const card=surf.parentElement;
  surf.style.minHeight=Math.max(b+40,card?card.clientHeight:0)+'px';
  // No minWidth. Boxes are placed within the card's width, so widening the surface
  // to the rightmost box only ever bought a horizontal scrollbar nothing needed.
}
// Selection is a transient class, so it is stripped on the way to storage — what
// you had selected when you happened to stop typing is not part of the document.
function cvHTML(surf){
  const c=surf.cloneNode(true);
  c.querySelectorAll('.cv-sel').forEach(el=>el.classList.remove('cv-sel'));
  return c.outerHTML;
}
function cvSave(n){
  const card=cvCard(n); if(!card) return;
  const surf=card.querySelector('.cv-surface'); if(!surf) return;
  cvFit(surf);
  saveCard(card.dataset.cardid,cvHTML(surf));
}
// Every box body saves the card it sits on, not itself — one card, one slot.
function cvOnInput(el){ rtOnInput(el); cvSave(el); }

// The uid is saved with the box and is what its undo history is filed under, so a
// render that rebuilds the box doesn't lose what you'd typed into it.
function cvUid(){ return 'b'+Math.random().toString(36).slice(2,9) }
function cvBoxHTML(html,x,y,w){
  return `<div class="cv-box" style="left:${Math.round(x)}px;top:${Math.round(y)}px;width:${Math.round(w||CV_W)}px">`
    +`<div class="cv-bd" data-uid="${cvUid()}" contenteditable="true" oninput="cvOnInput(this)" onkeydown="richtextKD(event)">`
    +(html||'<p><br></p>')+`</div></div>`;
}
function cvNewBox(surf,x,y,html){
  const d=document.createElement('div');
  d.innerHTML=cvBoxHTML(html,x,y,CV_W);
  const box=d.firstElementChild;
  surf.appendChild(box);
  cvSelect(surf,[box]);
  const bd=box.querySelector('.cv-bd');
  // preventScroll: focusing a box you just made should not jump the page to it.
  rtSeedUndo(bd); rtPlaceCaretAtEnd(bd); bd.focus({preventScroll:true});
  cvSave(surf);
  return box;
}
// An empty box is a click you thought better of, not a thing you made. It goes
// when you look away, so a stray click never leaves litter behind.
function cvPurgeEmpty(surf,except){
  let gone=false;
  cvBoxes(surf).forEach(b=>{
    if(b===except) return;
    const bd=b.querySelector('.cv-bd');
    if(bd&&!bd.textContent.trim()&&!bd.querySelector('table,img,.rt-tog')){ b.remove(); gone=true; }
  });
  if(gone) cvSave(surf);
}

// ── Selection ──
function cvSelected(surf){ return cvBoxes(surf).filter(b=>b.classList.contains('cv-sel')); }
function cvSelect(surf,boxes,add){
  if(!add) cvBoxes(surf).forEach(b=>b.classList.remove('cv-sel'));
  (boxes||[]).forEach(b=>b.classList.add('cv-sel'));
}
function cvDeleteSelected(surf){
  const sel=cvSelected(surf); if(!sel.length) return false;
  sel.forEach(b=>b.remove());
  cvSave(surf); cvHideCtl();
  return true;
}

// ── Snapping ──
// Every other box offers three lines on each axis — its two edges and its middle —
// and so does the surface. The nearest within CV_SNAP wins, X and Y decided
// independently, so a box can snap to one box's left and another's top at once.
function cvSnapLines(surf,except){
  const xs=[],ys=[];
  const W=surf.clientWidth||surf.offsetWidth,H=surf.clientHeight||surf.offsetHeight;
  xs.push(0,W/2,W); ys.push(0,H/2,H);
  cvBoxes(surf).forEach(b=>{
    if(b===except||b.classList.contains('cv-sel')&&except) return;
    const p=cvPos(b);
    xs.push(p.x,p.x+p.w/2,p.x+p.w);
    ys.push(p.y,p.y+p.h/2,p.y+p.h);
  });
  return {xs,ys};
}
// Given where the box wants to be, return where it should go and which lines it
// landed on. Pure — no DOM, no layout — so the rule is testable on its own.
function cvSnap(x,y,w,h,lines,tol){
  tol=tol==null?CV_SNAP:tol;
  const fit=(v,size,cands)=>{
    let best=null;
    [[0,'start'],[size/2,'mid'],[size,'end']].forEach(([off])=>{
      cands.forEach(c=>{
        const d=Math.abs(v+off-c);
        if(d<=tol&&(!best||d<best.d)) best={d,at:c-off,line:c};
      });
    });
    return best;
  };
  const fx=fit(x,w,lines.xs),fy=fit(y,h,lines.ys);
  return {x:fx?fx.at:x,y:fy?fy.at:y,gx:fx?fx.line:null,gy:fy?fy.line:null};
}

// ── The overlay ──
// The handle strip and the eight resize handles are built once and then only moved.
// Rebuilding them was what made the canvas flash: nine elements destroyed and
// recreated on every pointermove and every frame of a drag, each new one starting
// life without the hover state or the pointer capture the old one had.
const CV_HANDLES=[['n',0,-1,.5,0,'ns-resize'],['s',0,1,.5,1,'ns-resize'],
  ['w',-1,0,0,.5,'ew-resize'],['e',1,0,1,.5,'ew-resize'],
  ['nw',-1,-1,0,0,'nwse-resize'],['ne',1,-1,1,0,'nesw-resize'],
  ['sw',-1,1,0,1,'nesw-resize'],['se',1,1,1,1,'nwse-resize']];
function cvCtl(){
  let el=document.getElementById('cv-ctl');
  if(el) return el;
  el=document.createElement('div'); el.id='cv-ctl';
  const hd=document.createElement('div');
  hd.className='cv-hd'; hd.title='Drag to move';
  // The handles read the hovered box at press time rather than closing over one,
  // which is what lets them outlive the box they were drawn for.
  hd.onpointerdown=e=>{ if(_cvHover) cvDragStart(e,_cvHover); };
  el.appendChild(hd);
  CV_HANDLES.forEach(([dir,,,,,cur])=>{
    const h=document.createElement('div');
    h.className='cv-rz'+(dir.length===2?' cv-c':'');
    h.dataset.dir=dir; h.style.cursor=cur;
    h.onpointerdown=e=>{ if(_cvHover) cvRzStart(e,_cvHover,dir); };
    el.appendChild(h);
  });
  document.body.appendChild(el);
  return el;
}
function cvHideCtl(){
  const el=document.getElementById('cv-ctl');
  // Guides and the marquee are transient and do go; the handles stay put, hidden.
  if(el){ el.style.display='none'; el.querySelectorAll('.cv-guide,.cv-marq').forEach(g=>g.remove()); }
  _cvHover=null;
}
function cvMk(cls,css){
  const el=document.createElement('div'); el.className=cls; el.style.cssText=css||'';
  cvCtl().appendChild(el); return el;
}
// The handle strip above the box, and the eight handles around it. Drawn for
// whichever box the pointer is over, and for every box in a multiple selection so
// a group reads as one thing.
function cvShowCtl(box){
  const surf=cvSurf(box); if(!surf) return;
  const ctl=cvCtl(); ctl.style.display='block';
  ctl.style.setProperty('--cvc',cvAccent(cvCard(box)));
  _cvHover=box;
  const r=box.getBoundingClientRect();
  const hd=ctl.querySelector('.cv-hd');
  hd.style.left=r.left+'px'; hd.style.top=(r.top-14)+'px'; hd.style.width=r.width+'px';
  hd.classList.toggle('cv-on',!!(_cvDrag&&_cvDrag.moved));
  // Eight handles: thin strips on the sides, dots on the corners. Moved, not remade.
  CV_HANDLES.forEach(([dir,dx,dy,fx,fy])=>{
    const corner=dir.length===2;
    const size=corner?10:8;
    const w=corner?size:(dx?size:r.width),h=corner?size:(dy?size:r.height);
    const el=ctl.querySelector('.cv-rz[data-dir="'+dir+'"]');
    if(!el) return;
    el.style.left=(r.left+r.width*fx-w/2)+'px';
    el.style.top=(r.top+r.height*fy-h/2)+'px';
    el.style.width=w+'px'; el.style.height=h+'px';
  });
}
// A canvas borrows the app's accent unless the card has its own colour, the same
// key scheme the Timeline uses — so the guides match the card they are drawn on.
function cvAccent(card){
  const id=card&&card.dataset.cardid;
  return (id&&D.chartColors&&D.chartColors['tl_'+id])||gradeAccent();
}

// ── Dragging ──
function cvDragStart(e,box){
  const surf=cvSurf(box); if(!surf) return;
  e.preventDefault();
  // Dragging any member of a selection drags the whole selection.
  const sel=cvSelected(surf);
  const group=(sel.length>1&&sel.includes(box))?sel:[box];
  if(group.length===1) cvSelect(surf,[box]);
  _cvDrag={surf,box,group,sx:e.clientX,sy:e.clientY,moved:false,
    start:group.map(b=>cvPos(b)),alt:e.altKey};
  // Grabbing raises: stacking is DOM order, so the thing you took hold of comes up.
  surf.appendChild(box);
}
function cvGuides(surf,gx,gy){
  cvCtl().querySelectorAll('.cv-guide').forEach(el=>el.remove());
  const r=surf.getBoundingClientRect();
  if(gx!=null) cvMk('cv-guide v',`left:${r.left+gx}px;top:${r.top}px;height:${r.height}px`);
  if(gy!=null) cvMk('cv-guide h',`left:${r.left}px;top:${r.top+gy}px;width:${r.width}px`);
}
function cvDragMove(e){
  const d=_cvDrag; if(!d) return;
  const dx=e.clientX-d.sx,dy=e.clientY-d.sy;
  if(!d.moved&&Math.hypot(dx,dy)<CV_DRAG) return; // a press is not a drag
  d.moved=true;
  const p0=d.start[0];
  let nx=p0.x+dx,ny=p0.y+dy,gx=null,gy=null;
  // Alt is the escape hatch: hold it and the box goes exactly where you put it.
  if(!e.altKey){
    const s=cvSnap(nx,ny,p0.w,p0.h,cvSnapLines(d.surf,d.box));
    nx=s.x; ny=s.y; gx=s.gx; gy=s.gy;
  }
  const ox=nx-p0.x,oy=ny-p0.y;
  d.group.forEach((b,i)=>{
    b.style.left=Math.max(0,Math.round(d.start[i].x+ox))+'px';
    b.style.top =Math.max(0,Math.round(d.start[i].y+oy))+'px';
  });
  cvShowCtl(d.box);
  cvGuides(d.surf,gx,gy);
}
function cvDragEnd(){
  const d=_cvDrag; _cvDrag=null; if(!d) return;
  cvCtl().querySelectorAll('.cv-guide').forEach(el=>el.remove());
  if(d.moved) cvSave(d.surf);
}

// ── Resizing ──
function cvRzStart(e,box,dir){
  e.preventDefault(); e.stopPropagation();
  const p=cvPos(box);
  _cvRz={surf:cvSurf(box),box,dir,sx:e.clientX,sy:e.clientY,p};
}
function cvRzMove(e){
  const z=_cvRz; if(!z) return;
  const dx=e.clientX-z.sx,dy=e.clientY-z.sy,p=z.p,d=z.dir;
  let x=p.x,y=p.y,w=p.w,h=p.h;
  if(d.includes('e')) w=p.w+dx;
  if(d.includes('w')){ w=p.w-dx; x=p.x+dx; }
  if(d.includes('s')) h=p.h+dy;
  if(d.includes('n')){ h=p.h-dy; y=p.y+dy; }
  // Clamp before committing, and keep the far edge still when dragging the near one
  // — otherwise hitting the minimum walks the box across the surface.
  if(w<CV_MINW){ if(d.includes('w')) x=p.x+p.w-CV_MINW; w=CV_MINW; }
  if(h<CV_MINH){ if(d.includes('n')) y=p.y+p.h-CV_MINH; h=CV_MINH; }
  z.box.style.left=Math.max(0,Math.round(x))+'px';
  z.box.style.top =Math.max(0,Math.round(y))+'px';
  z.box.style.width=Math.round(w)+'px';
  // Height stays automatic unless you actually pull on it, so a box grows with what
  // you type until the day you decide otherwise.
  if(d.includes('n')||d.includes('s')) z.box.style.height=Math.round(h)+'px';
  cvShowCtl(z.box);
}
function cvRzEnd(){ const z=_cvRz; _cvRz=null; if(z) cvSave(z.surf); }

// ── Click, and marquee ──
// A press on empty surface is either a new box or a marquee, and which one it was
// is not knowable until you let go — so decide at the end, on the distance moved.
document.addEventListener('pointerdown',e=>{
  const surf=e.target&&e.target.classList&&e.target.classList.contains('cv-surface')?e.target:null;
  if(!surf) return;
  const r=surf.getBoundingClientRect();
  _cvMarq={surf,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,
    add:e.shiftKey,moved:false};
});
function cvMarqMove(e){
  const m=_cvMarq; if(!m) return;
  if(!m.moved&&Math.hypot(e.clientX-m.sx,e.clientY-m.sy)<CV_MARQ) return;
  m.moved=true;
  const x=Math.min(m.sx,e.clientX),y=Math.min(m.sy,e.clientY);
  const w=Math.abs(e.clientX-m.sx),h=Math.abs(e.clientY-m.sy);
  cvCtl().style.display='block';
  cvCtl().style.setProperty('--cvc',cvAccent(cvCard(m.surf)));
  let box=cvCtl().querySelector('.cv-marq');
  if(!box) box=cvMk('cv-marq','');
  box.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  // Anything the rectangle touches, not only what it swallows whole.
  const hit=cvBoxes(m.surf).filter(b=>{
    const r=b.getBoundingClientRect();
    return r.left<x+w&&r.right>x&&r.top<y+h&&r.bottom>y;
  });
  cvSelect(m.surf,hit,m.add);
}
function cvMarqEnd(e){
  const m=_cvMarq; _cvMarq=null; if(!m) return;
  const marq=cvCtl().querySelector('.cv-marq'); if(marq) marq.remove();
  if(m.moved) return;                    // it was a marquee; the selection stands
  cvPurgeEmpty(m.surf);
  if(!m.add){ cvSelect(m.surf,[]); }
  // y-12 puts the caret under the cursor rather than below it, so the box appears
  // where you were pointing instead of a line down from it.
  cvNewBox(m.surf,Math.max(0,m.ox),Math.max(0,m.oy-12));
}

document.addEventListener('pointermove',e=>{
  if(_cvDrag) return cvDragMove(e);
  if(_cvRz) return cvRzMove(e);
  if(_cvMarq) return cvMarqMove(e);
  // Idle: show the chrome for whatever box is under the pointer.
  const box=e.target&&e.target.closest?e.target.closest('.cv-box'):null;
  if(box){ if(box!==_cvHover) cvShowCtl(box); return; }
  if(_cvHover&&!(e.target.closest&&e.target.closest('#cv-ctl'))) cvHideCtl();
});
document.addEventListener('pointerup',e=>{
  if(_cvDrag) return cvDragEnd(e);
  if(_cvRz) return cvRzEnd(e);
  if(_cvMarq) return cvMarqEnd(e);
});
// Click on a box selects it; Shift adds to what is already selected.
document.addEventListener('mousedown',e=>{
  const box=e.target&&e.target.closest?e.target.closest('.cv-box'):null;
  if(!box) return;
  const surf=cvSurf(box); if(!surf) return;
  if(e.shiftKey){ e.preventDefault(); box.classList.toggle('cv-sel'); return; }
  if(!box.classList.contains('cv-sel')) cvSelect(surf,[box]);
});
document.addEventListener('keydown',e=>{
  const inBody=e.target&&e.target.closest&&e.target.closest('.cv-bd');
  const surf=cvSurf(e.target)||(_cvHover&&cvSurf(_cvHover));
  if(!surf) return;
  if((e.ctrlKey||e.metaKey)&&/^a$/i.test(e.key)&&!inBody){
    e.preventDefault(); cvSelect(surf,cvBoxes(surf)); return;
  }
  // Delete only removes boxes when you are not inside one — inside, it is a key
  // that deletes a character, and nothing else.
  if((e.key==='Delete'||e.key==='Backspace')&&!inBody){
    if(cvDeleteSelected(surf)) e.preventDefault();
  }
});
// Leaving a box takes any empty one with it, the way an unfinished note is not a note.
document.addEventListener('focusout',e=>{
  const bd=e.target&&e.target.closest?e.target.closest('.cv-bd'):null;
  if(!bd) return;
  const surf=cvSurf(bd); if(!surf) return;
  setTimeout(()=>{ if(document.contains(surf)) cvPurgeEmpty(surf,document.activeElement&&document.activeElement.closest('.cv-box')); },0);
});

// ── Conversion ──
// The way an existing card becomes a canvas without retyping it, and back again if
// it turns out not to suit. Nothing is thrown away in either direction.
function convertCardTo(id,type){
  const def=cardDef(id); if(!def||def.type===type) return;
  const html=cardHTML(id)||'';
  if(type==='canvas'){
    const d=document.createElement('div');
    d.innerHTML=cvBoxHTML(html||'<p><br></p>',16,16,CV_W);
    saveCard(id,`<div class="cv-surface">${d.innerHTML}</div>`);
  }else{
    // Reading order, not stacking order: down the page, then across it.
    const d=document.createElement('div'); d.innerHTML=html;
    const boxes=[...d.querySelectorAll('.cv-box')]
      .sort((a,b)=>(cvNum(a.style.top)-cvNum(b.style.top))||(cvNum(a.style.left)-cvNum(b.style.left)));
    saveCard(id,boxes.map(b=>{ const bd=b.querySelector('.cv-bd'); return bd?bd.innerHTML:''; }).join('')||'');
  }
  // A canvas is a fixed box, so it needs a height to be one. Converting never set
  // it, which left a converted canvas at the 80px floor with its boxes scrolling
  // inside it — the same size a brand new canvas starts at instead.
  if(type==='canvas'&&!def.minH) def.minH=320;
  def.type=type;
  _cardsDirty(); render();
}

// Edit lives under the grid, not in the header: it is about the cards, and the two
// things you reach for together — Done and + Add a card — are now in one place
// instead of at opposite ends of the page.
function mkCardBar(){
  const d=document.createElement('div');
  d.className='pcard-bar';
  d.innerHTML=`<button class="btn${editMode?' btn-on':''}" onclick="toggleEdit()">${editMode?'&#10003; Done':'&#9998; Edit cards'}</button>`;
  return d;
}

function mkPlannerCard(def,ix){
  const d=document.createElement('div');
  d.className='pcard'+(editMode?' editing':'');
  d.dataset.span=def.span||1;
  d.style.gridColumn=`${cardCol(def)} / span ${cardSpan(def)}`;
  d.draggable=false;

  // The header is the drag handle in both modes — see _cardGrabStart.
  const head = editMode
    ? `<div class="pcard-hd pcard-grab" style="align-items:center;gap:6px"
           onpointerdown="_cardGrabStart(event,'${def.id}')">
         <span class="pgrab">⠿</span>
         <input class="pcard-lblin" value="${_esc(def.label)}" oninput="setCardLabel('${def.id}',this.value)"/>
         ${(def.type==='timeline'||def.type==='canvas')?`<span class="chart-color-dot"
             title="${def.type==='canvas'?'Canvas colour':'Timeline colour'}"
             style="background:${timelineAccent(def.id)}"
             onpointerdown="event.stopPropagation()"
             onclick="openChartColorPop(event,'tl_${def.id}')"></span>`:''}
         ${(def.type==='text'||def.type==='canvas')?`<button class="pcard-lnk"
             title="${def.type==='canvas'?'Stack the boxes back into one column':'Move what is here into a box you can place'}"
             onpointerdown="event.stopPropagation()"
             onclick="convertCardTo('${def.id}','${def.type==='canvas'?'text':'canvas'}')"
             >${def.type==='canvas'?'Convert to text':'Convert to canvas'}</button>`:''}
         <button class="pcard-x" title="Remove card" onclick="removePlannerCard('${def.id}')">×</button>
       </div>`
    : `<div class="pcard-hd pcard-grab" title="Drag to reorder"
           onpointerdown="_cardGrabStart(event,'${def.id}')">
         <span class="pgrab">⠿</span>
         <span class="pcard-lbl pcard-lbled" contenteditable="plaintext-only"
               spellcheck="false" title="Click to rename"
               onfocus="_cardLblFocus(this)" onblur="_cardLblCommit(this,'${def.id}')"
               onkeydown="_cardLblKD(event,this)">${_esc(def.label)}</span>
       </div>`;

  // A canvas takes its height rather than a floor for it. The surface grows a
  // minHeight to fit the lowest box, and with a floor that growth pushed the whole
  // card — and the row it sits in — taller every time a box moved down. Fixed, the
  // surface scrolls inside the card and the card stays the size you set it to.
  // flex:none matters as much as the height does. .pcard-bd is flex:1 — that is
  // flex-basis:0% — and a flex item takes its base size from flex-basis, not from
  // `height`, so a bare `height:Npx` here did nothing at all and the body dropped
  // to the .pcard-bd{min-height:80px} floor the moment the card re-rendered. That
  // is why a canvas you had just dragged taller snapped small on leaving edit mode.
  const mh=def.minH
    ? (def.type==='canvas'?`flex:none;height:${def.minH}px`:`min-height:${def.minH}px`)
    : '';
  let body,foot;
  if(def.type==='clock'){
    // Same host div mkTimeBlockCard uses, so buildClockSVG finds it by id and
    // needs no change. The clock is now a card like any other.
    // Dial and schedule wrap as one flex row: in a 1-column card the list's
    // flex-basis cannot fit beside the dial, so it drops underneath; from 2 columns
    // up they sit side by side. No setting, no container query — the card's own
    // width decides.
    body=`<div class="pcard-bd tb-clockbd" style="${mh}">
        <div id="tb-clock-wrap" class="tb-clock-host" style="width:100%;aspect-ratio:1"></div>
        <div id="tb-sched" class="tb-sched"></div>
      </div>`;
    foot='';
    setTimeout(()=>{
      if(!document.getElementById('tb-clock-wrap')) return;
      buildClockSVG();
      if(_tbClockTimer)clearInterval(_tbClockTimer);
      _tbClockTimer=setInterval(buildClockSVG,60000);
    },0);
  }else if(def.type==='timeline'){
    // The colour rides in as a custom property, so every marked state inside picks
    // it up from one place instead of each button carrying its own inline style.
    body=`<div class="pcard-bd tlcard" style="${mh};--tlc:${timelineAccent(def.id)}">${timelineCardBody(def.id)}</div>`;
    foot='';
  }else if(def.type==='canvas'){
    // The surface is restored from the card's own slot like any other content — the
    // positions came back with it, because they never left it.
    body=`<div class="pcard-bd cvcard" style="${mh};--cvc:${cvAccent({dataset:{cardid:def.id}})}"
        id="card-${def.id}" data-cardid="${def.id}"></div>`;
    foot='';
    setTimeout(()=>{
      const el=document.getElementById('card-'+def.id);
      if(!el) return;
      const stored=cardHTML(def.id);
      el.innerHTML=/cv-surface/.test(stored||'')?stored:'<div class="cv-surface"></div>';
      const surf=el.querySelector('.cv-surface');
      if(surf){
        cvFit(surf);
        // Boxes saved before uids existed get one now; it persists from the next
        // save on. rtSeedUndo only clears a history that disagrees with what's on
        // screen, so restoring the same content a box already had leaves it alone.
        surf.querySelectorAll('.cv-bd').forEach(bd=>{
          if(!bd.dataset.uid) bd.dataset.uid=cvUid();
          rtSeedUndo(bd);
        });
      }
    },0);
  }else if(def.type==='habits'){
    body=`<div class="pcard-bd" style="${mh}" id="hcard-${def.id}">${habitCardBody(def)}</div>`;
    // Renaming and removing levers is configuration and stays behind the global
    // edit toggle. Choosing which levers this card shows is not — the chooser
    // carries its own Done button, so the footer only has to open it.
    foot=(editMode&&!def.editing)?`<div class="pcard-ft">
        <button class="pcard-lnk" onclick="toggleHabitCardEdit('${def.id}')">Edit habits</button>
      </div>`:'';
  }else{
    const html=cardHTML(def.id);
    body=`<div class="pcard-bd notes-ta" style="${mh}" id="card-${def.id}" contenteditable="true"
        oninput="saveCard('${def.id}',rtOnInput(this))" onkeydown="richtextKD(event)"></div>`;
    // Nothing in a text card's footer any more: it never starts a new period, so
    // there is no previous one to carry forward from.
    foot='';
    // Restore on a 0ms timer, the same way the four cards always have, so
    // rtFreezeTables runs after the content is in.
    setTimeout(()=>{
      const el=document.getElementById('card-'+def.id);
      if(el){ el.innerHTML=html||''; rtSeedUndo(el); }
    },0);
  }

  // Resizing is no longer edit-mode only — it is as everyday as dragging a card
  // to reorder it, which already works outside edit mode. Outside edit mode the
  // grips are invisible until you hover the card (the pgrip-q class), so a page
  // you are only reading isn't ringed with handles.
  const gq=editMode?'':' pgrip-q';
  d.innerHTML=head+body+foot+`<div class="pgrip${gq}" title="Drag to set height · double-click to reset"
    onmousedown="_cardRzStart(event,'${def.id}')" ondblclick="setCardHeight('${def.id}',0)"></div>
    <div class="pgrip-x${gq}" title="Drag to set width · double-click to reset"
    onmousedown="_cardRzxStart(event,'${def.id}')" ondblclick="setCardSpan('${def.id}',1)"></div>`;

  return d;
}

// ── Card configuration ──
function setCardLabel(id,v){ const c=cardDef(id); if(c){ c.label=v; _cardsDirty(); } }
// Renaming a card is not configuration — it is the one thing you do to a card
// constantly — so the title is editable where it sits, with no mode to enter.
// It never calls render(): re-rendering mid-edit would take the caret with it.
function _cardLblFocus(el){ el.dataset.prev=el.textContent; }
function _cardLblCommit(el,id){
  // Collapse the newlines a paste can smuggle in. Empty commits: a card with no
  // title is a real choice, and the CSS keeps an invisible hit area there so it
  // stays clickable (the ⠿ handle is separate, so drag is unaffected either way).
  const v=el.textContent.replace(/\s+/g,' ').trim();
  el.textContent=v;
  setCardLabel(id,v);
}
function _cardLblKD(e,el){
  if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); el.blur(); }
  else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); el.textContent=el.dataset.prev||''; el.blur(); }
}
function setCardFlag(id,k,v){ const c=cardDef(id); if(c){ c[k]=v; _cardsDirty(); render(); } }
function setCardSpan(id,v){ const c=cardDef(id); if(c){ c.span=Math.min(4,Math.max(1,Number(v)||1)); _cardsDirty(); render(); } }
function setCardHeight(id,px){ const c=cardDef(id); if(c){ c.minH=Math.max(0,Math.round(px)); _cardsDirty(); render(); } }
function addPlannerCard(type){
  // A second clock cannot render — the dial is looked up by a single id — so it is
  // not offered, and this guard means it cannot be added by any other route either.
  if(type==='clock'&&cardDefs().some(c=>c.type==='clock')){ _paddOpen=false; render(); return; }
  const id='c'+Math.random().toString(36).slice(2,9);
  const defs=cardDefs();
  // A new card starts in the column after the last one, wrapping to the left when
  // it won't fit — where plain flow would have put it, which is where you expect
  // a card you just added to appear.
  const last=defs[defs.length-1];
  const nextCol=(def,sp)=>{
    if(!def) return 1;
    const c=cardCol(def)+cardSpan(def);
    return c+sp-1>PGRID_COLS?1:c;
  };
  const withCol=d=>Object.assign(d,{col:nextCol(last,cardSpan(d))});
  defs.push(withCol(
    // hidden:[] and not undefined — an empty array means "showing everything",
    // where a missing key means "inherit the old global hideToday flags".
    type==='habits' ? {id,type:'habits',label:'Habits',span:2,minH:0,cadence:'none',hidden:[]}
  : type==='clock'  ? clockCardDef(id)
  : type==='timeline' ? {id,type:'timeline',label:'TIMELINE',span:1,minH:0,cadence:'none'}
  : type==='canvas' ? {id,type:'canvas',label:'CANVAS',span:2,minH:320,cadence:'none'}
  : {id,type:'text',label:'New card',span:1,minH:0,cadence:'none'}));
  _paddOpen=false;
  _cardsDirty(); render();
}
// Removal keeps the stored content, so a card taken off the page can come back.
function removePlannerCard(id){
  const defs=cardDefs(), i=defs.findIndex(c=>c.id===id);
  if(i<0) return;
  if(!confirm(`Remove "${defs[i].label}" from this page? What you've written in it is kept.`)) return;
  defs.splice(i,1); _cardsDirty(); render();
}
// ── Reordering ──
// Not HTML5 drag-and-drop. A reorder is a list move, not a swap — pulling a card
// out shifts everything after it — and with HTML5 DnD you can't see that until
// you let go, so the result looks random. Here the grid reflows under the cursor:
// a placeholder sits where the card will land, so what you see is what you get.
// Pointer events also give touch for free.

// Which column the pointer is over, from the grid's own box. Separate from the
// index below because a drop now answers two questions — which column the card
// belongs to, and where in that list it sits — and only the second one moves
// other cards.
function _cardDropCol(x,gridRect,span){
  if(!gridRect||!gridRect.width) return 1;
  const track=gridRect.width/PGRID_COLS;
  const c=Math.floor((x-gridRect.left)/track)+1;
  return Math.min(PGRID_COLS-span+1,Math.max(1,c));
}
// Where the card would land, given the pointer and the other cards' boxes. Pure,
// so it can be tested without layout — jsdom has none. Reading order: insert
// before the first card the pointer hasn't reached yet.
function _cardDropIndex(x,y,boxes,dragIx){
  let ins=boxes.length;
  for(let i=0;i<boxes.length;i++){
    if(i===dragIx) continue;
    const b=boxes[i];
    const after = y<b.top ? true
                : y>b.bottom ? false
                : x < b.left+b.width/2;
    if(after){ ins=i; break; }
  }
  // Removing the card first shifts every later slot down by one.
  if(dragIx<ins) ins--;
  return Math.max(0,Math.min(boxes.length-1,ins));
}

let _cardDrag=null;
function _cardGrabStart(e,id){
  // Left button only, and never from a control inside the header.
  if(e.button!==0||e.target.closest('input,button,select,textarea,[contenteditable]')) return;
  const card=e.target.closest('.pcard'), grid=card&&card.closest('.pgrid');
  if(!grid) return;
  _cardDrag={id,card,grid,hd:e.currentTarget,x0:e.clientX,y0:e.clientY,
             pid:e.pointerId,live:false,ins:-1};
  try{ e.currentTarget.setPointerCapture(e.pointerId) }catch{}
}
// A few pixels of slop, so clicking the header (or its label field) is still a click.
function _cardDragLift(){
  const s=_cardDrag, r=s.card.getBoundingClientRect();
  s.live=true;
  s.dx=r.left-s.x0; s.dy=r.top-s.y0;
  const ph=document.createElement('div');
  ph.className='pcard-ph';
  ph.style.gridColumn=s.card.style.gridColumn;
  ph.style.height=r.height+'px';
  // The grid is 4px rows, so a placeholder with no row span collapses to 4px and
  // every card below it jumps — which is what made a drag look like it scrambled
  // the order. It claims exactly the rows the card it stands in for claimed.
  ph.style.gridRowEnd=s.card.style.gridRowEnd
    ||'span '+Math.max(1,Math.ceil((r.height+PGRID_GAP)/PGRID_ROW));
  s.span=cardSpan(cardDef(s.id)||{});
  s.col=cardCol(cardDef(s.id)||{});
  s.ph=ph;
  s.grid.insertBefore(ph,s.card);
  s.card.classList.add('pdrag');
  s.card.style.width=r.width+'px';
  s.card.style.height=r.height+'px';
  document.body.appendChild(s.card);
  _cardDragMoveTo(s.x0,s.y0);
}
function _cardDragMoveTo(x,y){
  const s=_cardDrag;
  s.card.style.transform=`translate(${x+s.dx}px,${y+s.dy}px)`;
}
document.addEventListener('pointermove',e=>{
  const s=_cardDrag; if(!s) return;
  if(!s.live){
    if(Math.abs(e.clientX-s.x0)+Math.abs(e.clientY-s.y0)<5) return;
    _cardDragLift();
  }
  e.preventDefault();
  _cardDragMoveTo(e.clientX,e.clientY);
  // Boxes of the cards still in the grid, with the placeholder standing in for
  // the one being dragged, so indexes line up with cardDefs().
  const kids=[...s.grid.children].filter(el=>el.classList.contains('pcard')||el===s.ph);
  const dragIx=kids.indexOf(s.ph);
  const boxes=kids.map(el=>el.getBoundingClientRect());
  const ins=_cardDropIndex(e.clientX,e.clientY,boxes,dragIx);
  const col=_cardDropCol(e.clientX,s.grid.getBoundingClientRect(),s.span);
  if(col!==s.col){
    s.col=col;
    s.ph.style.gridColumn=`${col} / span ${s.span}`;
  }
  if(ins!==s.ins){
    s.ins=ins;
    const rest=kids.filter(el=>el!==s.ph);
    s.grid.insertBefore(s.ph,rest[ins]||null);
  }
  // dragover-driven autoscroll doesn't fire for pointer drags, so do it here.
  const m=70, vh=innerHeight;
  if(e.clientY<m) scrollBy(0,-Math.ceil((m-e.clientY)/6));
  else if(e.clientY>vh-m) scrollBy(0,Math.ceil((e.clientY-(vh-m))/6));
},{passive:false});
function _cardDragEnd(commit){
  const s=_cardDrag; if(!s) return;
  _cardDrag=null;
  try{ s.hd.releasePointerCapture(s.pid) }catch{}
  if(!s.live) return;
  // The lifted card was moved to <body> to escape the grid's stacking context, so
  // it has to be taken out by hand — render() only clears #app.
  s.card.remove();
  s.ph.remove();
  if(commit&&s.ins>=0){
    const defs=cardDefs(), from=defs.findIndex(c=>c.id===s.id);
    if(from>=0){
      const def=defs[from];
      let dirty=false;
      // The column is the card's own property — changing it moves nothing else.
      if(s.col&&def.col!==s.col){ def.col=s.col; dirty=true; }
      if(s.ins!==from){
        const [moved]=defs.splice(from,1);
        defs.splice(Math.max(0,Math.min(defs.length,s.ins)),0,moved);
        dirty=true;
      }
      if(dirty) _cardsDirty();
    }
  }
  render();
}
document.addEventListener('pointerup',()=>_cardDragEnd(true));
document.addEventListener('pointercancel',()=>_cardDragEnd(false));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&_cardDrag) _cardDragEnd(false);
});
// Height by dragging the bottom edge, the same mousedown/move/up shape the clock
// blocks use. Committed on mouseup so a drag is one save, not sixty.
let _cardRz=null;
function _cardRzStart(e,id){
  e.preventDefault();
  const card=e.target.closest('.pcard'), bd=card.querySelector('.pcard-bd');
  _cardRz={id,bd,card,y:e.clientY,h:bd.getBoundingClientRect().height,px:0,
           cv:(cardDef(id)||{}).type==='canvas'};
  card.classList.add('rz');

// Lining a card up with its neighbours by eye is guesswork at 4px row granularity,
// so the drag snaps to the other cards' bottom edges — the same CV_SNAP tolerance
// and dashed line the canvas uses for box edges, applied to whole cards.
function _cardGuide(){
  let g=document.getElementById('pcard-guide');
  if(!g){ g=document.createElement('div'); g.id='pcard-guide'; document.body.appendChild(g); }
  return g;
}
function _cardGuideHide(){ const g=document.getElementById('pcard-guide'); if(g) g.style.display='none'; }
// The nearest other card's bottom within tolerance, or null. Pure apart from the
// rects handed in, so the arithmetic is testable without layout.
// One place decides how a height is applied, so the live drag and the render that
// follows it can't disagree about which property is actually holding the card open.
function _cardApplyH(bd,px,isCv){
  if(isCv){
    bd.style.flex='none'; bd.style.height=px+'px'; bd.style.minHeight='';
    // Grow the surface with the card, or the space you just dragged open is dead to
    // clicks until the next render.
    cvFit(bd.querySelector('.cv-surface'));
  }
  else bd.style.minHeight=px+'px';

function _cardSnapBottom(bottom,others,tol){
  let best=null,d=(tol==null?CV_SNAP:tol)+1;
  others.forEach(r=>{
    const gap=Math.abs(r.bottom-bottom);
    if(gap<d){ d=gap; best=r.bottom; }
  });

}
document.addEventListener('mousemove',e=>{
  if(!_cardRz) return;
  const s=_cardRz;
  s.px=Math.max(60,Math.round(s.h+(e.clientY-s.y)));
  _cardApplyH(s.bd,s.px,s.cv);
  const grid=s.card.closest('.pgrid');
  const others=grid?[...grid.children]
    .filter(el=>el!==s.card&&el.classList&&el.classList.contains('pcard'))
    .map(el=>el.getBoundingClientRect()).filter(r=>r.height):[];
  const mine=s.card.getBoundingClientRect();
  const snap=mine.height?_cardSnapBottom(mine.bottom,others):null;
  if(snap!=null){
    s.px=Math.max(60,s.px+Math.round(snap-mine.bottom));
    _cardApplyH(s.bd,s.px,s.cv);
    const gr=grid.getBoundingClientRect(), g=_cardGuide();
    g.style.cssText=`position:fixed;pointer-events:none;z-index:60;height:0;`

  } else _cardGuideHide();

  // rather than finding out where it went after you let go.

});
document.addEventListener('mouseup',()=>{
  if(!_cardRz) return;
  const {id,px,card}=_cardRz;
  card.classList.remove('rz'); _cardRz=null;
  _cardGuideHide();
  const c=cardDef(id); if(c){ c.minH=px; _cardsDirty(); }
});

// Width by dragging the right edge, snapping to whole columns so the grid stays
// a grid. Previewed live on the element, committed once on mouseup.
let _cardRzx=null;
function _cardRzxStart(e,id){
  e.preventDefault();
  const card=e.target.closest('.pcard'), grid=card.closest('.pgrid');
  if(!grid) return;
  const gw=grid.getBoundingClientRect().width, gap=14;
  _cardRzx={id,card,colW:(gw-gap*(PGRID_COLS-1))/PGRID_COLS,gap,left:card.getBoundingClientRect().left,span:def_span(id)};
  card.classList.add('rzx');

// PGRID_COLS is declared once, up with the column helpers.
function def_span(id){ return cardSpan(cardDef(id)||{}) }
document.addEventListener('mousemove',e=>{
  if(!_cardRzx) return;
  const {colW,gap,left,card}=_cardRzx;
  const want=Math.round((e.clientX-left+gap)/(colW+gap));
  const col=cardCol(cardDef(_cardRzx.id)||{});

  const span=Math.min(PGRID_COLS-col+1,Math.max(1,want||1));

document.addEventListener('mouseup',()=>{

  card.classList.remove('rzx'); _cardRzx=null;

// ── Carrying forward ──
// Nothing to carry: templates were removed, and now cards don't reset either, so
// what you wrote is simply still there tomorrow. Both the template strings and
// the old per-period entries stay in the data, ignored rather than deleted.

// ── Habits card ──
// Ticking writes the same completions the grid writes, through the same toggle(),
// so the tracker stays exactly as accurate without any of it being on this page.
// Which habits this card hides. hideToday used to live on the habit itself, which
// meant every habits card showed an identical set and hiding a lever on one hid it
// everywhere. The list belongs to the card. A def with no `hidden` key is one that
// predates this, so it inherits the old flags once and then owns its own copy.
function _cardHidden(def){
  if(!Array.isArray(def.hidden)){
    def.hidden=allHabits().filter(h=>h.hideToday).map(h=>h.id);
    _cardsDirty();
  }
  return def.hidden;
}
function habitCardBody(def){
  const day=PD.getDate();
  const groups=groupsForDay(PD.getFullYear(),PD.getMonth(),day);
  const rows=[];
  groups.forEach(g=>g.habits.forEach(h=>rows.push({h,g})));
  const hid=_cardHidden(def);
  // The chooser opens from the footer in edit mode and from the empty state at
  // rest, so a card can never end up with nothing on it and no way back.
  if(def.editing){
    return `<div class="hlist">${rows.map(({h,g})=>{
      const off=hid.includes(h.id);
      return `<div class="hlist-row">
        <i style="background:${g.color}"></i>
        ${editMode
          ? `<input class="nm" value="${_esc(h.name)}" onchange="renameHabitInline('${h.id}',this.value)"/>`
          : `<span class="nm" style="padding:3px 0">${_esc(h.name)}</span>`}
        <button class="hlist-eye${off?'':' on'}" title="${off?'Tracked, but hidden on this card':'Showing on this card'}"
          onclick="toggleHabitShowHere('${def.id}','${h.id}')">${off?'○':'◉'}</button>
        ${editMode?`<button class="pcard-x" title="Remove lever" onclick="removeHabitInline('${h.id}')">×</button>`:''}
      </div>`;}).join('')}
      <button class="pcard-lnk on" style="margin-top:6px" onclick="toggleHabitCardEdit('${def.id}')">Done</button>
    </div>`;
  }
  const shown=rows.filter(({h})=>!hid.includes(h.id));
  if(!shown.length) return `<button class="paddcard" style="width:100%;padding:12px 10px"
      onclick="toggleHabitCardEdit('${def.id}')">Choose what goes here</button>`;
  return `<div class="hpills">${shown.map(({h,g})=>{
    const on=isChk(h.id,day);
    return `<button class="hpill${on?' on':''}" onclick="toggleHabitFromCard('${h.id}')">
      <i style="background:${g.color}"></i>${_esc(h.name)}</button>`;
  }).join('')}</div>`;
}
function toggleHabitCardEdit(id){ const c=cardDef(id); if(c){ c.editing=!c.editing; _cardsDirty(); render(); } }
function toggleHabitFromCard(hid){ toggle(hid,PD.getDate()); }
// Writes through to the real habit list — a set you compose is a different object
// from a roster you're handed.
// Distinct from _findHabit below, which returns the habit alone — the card needs
// its group too, for the colour dot and for removal.
function _findHabitWithGroup(hid){
  for(const g of D.groups){ const h=g.habits.find(x=>x.id===hid); if(h) return {h,g}; }
  return null;
}
function renameHabitInline(hid,v){ const f=_findHabitWithGroup(hid); if(f&&v.trim()){ f.h.name=v.trim(); save(); render(); } }
// Hiding is per card now, so this takes the card as well as the habit. The

// ─── TIME BLOCK CLOCK ────────────────────────────────────────────
const TB_COLORS=['#3B82F6','#8B5CF6','#10B981','#F59E0B','#EC4899','#14B8A6','#FACC15','#6366F1','#EF4444','#06B6D4'];
const TB_RO=98,TB_RI=74,TB_RM=86;
function _tbUuid(){return Math.random().toString(36).slice(2,10);}
function _tbAngle(min){return (min/1440)*360-90;}
function _tbPt(r,deg){const rad=deg*Math.PI/180;return [110+r*Math.cos(rad),110+r*Math.sin(rad)];}
function _tbArcPath(r1,r2,a1,a2){
  const span=((a2-a1)+360)%360;const lg=span>180?1:0;
  const [ox1,oy1]=_tbPt(r2,a1);const [ox2,oy2]=_tbPt(r2,a2);
  const [ix1,iy1]=_tbPt(r1,a2);const [ix2,iy2]=_tbPt(r1,a1);
  return `M${ox1.toFixed(2)},${oy1.toFixed(2)} A${r2},${r2},0,${lg},1,${ox2.toFixed(2)},${oy2.toFixed(2)} L${ix1.toFixed(2)},${iy1.toFixed(2)} A${r1},${r1},0,${lg},0,${ix2.toFixed(2)},${iy2.toFixed(2)}Z`;
}
function _tbMouseMin(e){
  const svg=document.getElementById('tb-svg');if(!svg)return 0;
  const r=svg.getBoundingClientRect();
  // SVG viewBox 220x220, center at 110,110 — map to rendered size
  const scaleX=r.width/220,scaleY=r.height/220;
  const dx=e.clientX-(r.left+110*scaleX),dy=e.clientY-(r.top+110*scaleY);
  const angle=(Math.atan2(dy,dx)*180/Math.PI+90+360)%360;
  return Math.round(angle/360*1440/15)*15;
}
let _tbDrag=null;
let _tbTouchPending=null,_tbTouchTimer=null;
function _tbMouseDown(e){
  e.preventDefault();e.stopPropagation();
  const id=e.currentTarget.dataset.tbid;
  const block=(D.timeBlocks||[]).find(b=>b.id===id);
  if(!block)return;
  const curMin=_tbMouseMin(e);
  const ds=((curMin-block.startMin)+1440)%1440,de=((curMin-block.endMin)+1440)%1440;
  const mode=ds<20?'start':de<20||de>1420?'end':'move';
  _tbDrag={id,orig:{...block},origMin:curMin,mode,sx:e.clientX,sy:e.clientY,moved:false};
  const _t=document.getElementById('tb-tip');if(_t)_t.style.display='none';
  document.addEventListener('mousemove',_tbMouseMove);
  document.addEventListener('mouseup',_tbMouseUp,{once:true});
}
function _tbMouseMove(e){
  if(!_tbDrag)return;
  const dx=e.clientX-_tbDrag.sx,dy=e.clientY-_tbDrag.sy;
  if(!_tbDrag.moved&&Math.sqrt(dx*dx+dy*dy)<12)return;
  _tbDrag.moved=true;
  document.body.style.cursor='grabbing';
  const curMin=_tbMouseMin(e);
  let delta=curMin-_tbDrag.origMin;
  if(delta>720)delta-=1440;if(delta<-720)delta+=1440;
  const b=(D.timeBlocks||[]).find(b=>b.id===_tbDrag.id);if(!b)return;
  if(_tbDrag.mode==='move'){
    const dur=((_tbDrag.orig.endMin-_tbDrag.orig.startMin)+1440)%1440;
    b.startMin=(((_tbDrag.orig.startMin+delta)%1440)+1440)%1440;
    b.endMin=(b.startMin+dur)%1440;
  }else if(_tbDrag.mode==='start'){
    b.startMin=((curMin%1440)+1440)%1440;
  }else{
    b.endMin=((curMin%1440)+1440)%1440;
  }
  buildClockSVG();
}
function _tbMouseUp(e){
  document.removeEventListener('mousemove',_tbMouseMove);
  document.body.style.cursor='';
  if(!_tbDrag)return;
  if(!_tbDrag.moved){const b=(D.timeBlocks||[]).find(b=>b.id===_tbDrag.id);_tbDrag=null;openTimeBlockModal(b);return;}
  save();_tbDrag=null;buildClockSVG();
}
let _tbClockTimer=null;
function mkTimeBlockCard(){
  const d=document.createElement('div');
  d.className='stat tb-clock-stat';
  d.style.cssText='padding:10px 12px 24px 12px;display:flex;flex-direction:column;align-items:center;position:relative';
  d.innerHTML=`<div id="tb-clock-wrap" style="width:100%;max-width:280px;aspect-ratio:1;margin:0 auto"></div>`;
  setTimeout(()=>{buildClockSVG();if(_tbClockTimer)clearInterval(_tbClockTimer);_tbClockTimer=setInterval(buildClockSVG,60000);},0);
  return d;
}
function buildClockSVG(){
  const wrap=document.getElementById('tb-clock-wrap');if(!wrap)return;
  const CX=110,CY=110;
  const now=new Date();const todayDow=now.getDay();
  const nowMin=now.getHours()*60+now.getMinutes();
  const cc=chartConf();
  const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const timeStr=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const blocks=(D.timeBlocks||[]).filter(b=>!b.days||b.days.length===0||b.days.includes(todayDow));
  const pt=(r,deg)=>{const rad=deg*Math.PI/180;return [CX+r*Math.cos(rad),CY+r*Math.sin(rad)];};
  const ap=(r1,r2,a1,a2)=>{
    const span=((a2-a1)+360)%360,lg=span>180?1:0;
    const [ox1,oy1]=pt(r2,a1),[ox2,oy2]=pt(r2,a2);
    const [ix1,iy1]=pt(r1,a2),[ix2,iy2]=pt(r1,a1);
    return `M${ox1.toFixed(2)},${oy1.toFixed(2)} A${r2},${r2},0,${lg},1,${ox2.toFixed(2)},${oy2.toFixed(2)} L${ix1.toFixed(2)},${iy1.toFixed(2)} A${r1},${r1},0,${lg},0,${ix2.toFixed(2)},${iy2.toFixed(2)}Z`;
  };
  let arcs='',labels='',ticks='',defs='';
  // Tick marks
  for(let m=0;m<1440;m+=15){
    const a=_tbAngle(m),isHr=m%60===0,is6=m%360===0;
    const [x1,y1]=pt(TB_RO,a),[x2,y2]=pt(isHr?TB_RO-10:TB_RO-5,a);
    ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${cc.ticks}" stroke-width="${is6?2:isHr?1.2:.6}" opacity="${is6?.9:isHr?.65:.4}"/>`;
  }
  // 4 cardinal time labels — outside ring
  [[0,'12A'],[360,'6A'],[720,'12P'],[1080,'6P']].forEach(([m,lbl])=>{
    const a=_tbAngle(m),[x,y]=pt(TB_RO+13,a);
    ticks+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="7.5" font-weight="400" fill="${cc.ticks}" font-family="Inter,system-ui" opacity=".45">${lbl}</text>`;
  });
  // Detect time-range overlaps and assign radial lanes so both colors stay visible
  const _span=b=>((b.endMin-b.startMin)+1440)%1440;
  // Overlap check that correctly handles midnight-crossing blocks
  const _ovlp=(a,b)=>{
    const aSpan=_span(a),bSpan=_span(b);
    const relBS=((b.startMin-a.startMin)+1440)%1440;
    const relBE=((b.endMin-a.startMin)+1440)%1440;
    return relBS<aSpan||(relBE>0&&relBE<aSpan)||(relBS===0&&bSpan>0);
  };
  // Graph-coloring lane assignment — handles 3+ overlapping blocks correctly
  const ringW=TB_RO-TB_RI;
  const lanes=new Array(blocks.length).fill(0);
  // Sort indices by span desc so larger blocks get lower (outer) lanes
  const bySpan=[...blocks.keys()].sort((a,b)=>_span(blocks[b])-_span(blocks[a]));
  bySpan.forEach(i=>{
    const used=new Set();
    for(let j=0;j<blocks.length;j++){
      if(j!==i&&lanes[j]>=0&&_ovlp(blocks[i],blocks[j])) used.add(lanes[j]);
    }
    let lane=0; while(used.has(lane)) lane++;
    lanes[i]=lane;
  });
  const maxLane=Math.max(...lanes,0);
  const laneCount=maxLane+1;
  const laneH=ringW/laneCount;
  // Lane 0 = outermost, lane N = innermost
  const bRI=lanes.map(l=>Math.round(TB_RI+(laneCount-1-l)*laneH));
  const bRO=lanes.map(l=>Math.round(TB_RI+(laneCount-l)*laneH));
  const _visColor=(color)=>_readableColor(color);
  const byStart=[...blocks.keys()].sort((a,b)=>blocks[a].startMin-blocks[b].startMin);
  defs='<defs>';
  // Arc segments — draw arcs first, collect label metadata for collision pass
  const lblMeta=[];
  let hitArcs='';
  const MIN_HIT_MIN=25; // short blocks get a wider invisible tap/click target so they stay editable
  const tbName=b=>tbArrows(b.name||'');
  blocks.forEach((b,idx)=>{
    const span=_span(b);
    const a1=_tbAngle(b.startMin),a2=_tbAngle(b.endMin);
    const midMin=(b.startMin+span/2+1440)%1440;
    const midA=_tbAngle(midMin);
    const fmtT=m=>`${String(Math.floor((m%1440)/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
    const durMin=span%60,durHr=Math.floor(span/60);
    const durStr=(durHr?durHr+'h ':'')+(durMin?durMin+'m':'');
    const arcStroke=_isLightColor(b.color)?'stroke="rgba(0,0,0,0.18)" stroke-width="1.5"':_isDarkColor(b.color)?'stroke="rgba(255,255,255,0.25)" stroke-width="1.5"':'';
    const tipAttrs=`data-tbid="${b.id}" data-tipname="${esc(tbName(b))}" data-tiptime="${fmtT(b.startMin)} – ${fmtT(b.endMin)}" data-tipdur="${durStr}" data-tipcolor="${b.color}"`;
    arcs+=`<path d="${ap(bRI[idx],bRO[idx],a1,a2)}" fill="${b.color}" opacity=".68" ${arcStroke} style="cursor:grab;filter:drop-shadow(0 0 4px ${b.color}88);pointer-events:none" ${tipAttrs} class="tb-arc"/>`;
    if(span<MIN_HIT_MIN){
      const padMin=(MIN_HIT_MIN-span)/2;
      const ha1=_tbAngle(((b.startMin-padMin)+1440)%1440),ha2=_tbAngle(((b.endMin+padMin)%1440+1440)%1440);
      hitArcs+=`<path d="${ap(bRI[idx],bRO[idx],ha1,ha2)}" fill="transparent" style="cursor:grab" ${tipAttrs} class="tb-arc"/>`;
    }else{
      hitArcs+=`<path d="${ap(bRI[idx],bRO[idx],a1,a2)}" fill="transparent" style="cursor:grab" ${tipAttrs} class="tb-arc"/>`;
    }
    lblMeta.push({b,span,midA});
  });
  // Feathered shadow seam at boundaries between same-color adjacent blocks
  for(let k=0;k<byStart.length;k++){
    const prev=byStart[(k-1+byStart.length)%byStart.length],cur=byStart[k];
    const gap=((blocks[cur].startMin-blocks[prev].endMin)+1440)%1440;
    if(gap<5&&blocks[cur].color===blocks[prev].color){
      const seamA=_tbAngle(blocks[prev].endMin),seamW=0.5;
      const ri=Math.min(bRI[prev],bRI[cur]),ro=Math.max(bRO[prev],bRO[cur]);
      const sid=`tbs${k}`;
      const [gx1,gy1]=_tbPt(TB_RM,seamA-seamW/2),[gx2,gy2]=_tbPt(TB_RM,seamA+seamW/2);
      defs+=`<linearGradient id="${sid}" gradientUnits="userSpaceOnUse" x1="${gx1.toFixed(1)}" y1="${gy1.toFixed(1)}" x2="${gx2.toFixed(1)}" y2="${gy2.toFixed(1)}"><stop offset="0%" stop-color="rgba(0,0,0,0)"/><stop offset="50%" stop-color="rgba(0,0,0,0.55)"/><stop offset="100%" stop-color="rgba(0,0,0,0)"/></linearGradient>`;
      arcs+=`<path d="${ap(ri,ro,seamA-seamW/2,seamA+seamW/2)}" fill="url(#${sid})" style="pointer-events:none"/>`;
    }
  }
  defs+='</defs>';
  // Collision avoidance: larger blocks get inner tier, colliding smaller blocks pushed outward
  lblMeta.sort((a,b)=>b.span-a.span);
  lblMeta.forEach(l=>l.tier=0);
  for(let i=0;i<lblMeta.length;i++){
    for(let j=i+1;j<lblMeta.length;j++){
      const diff=Math.abs(((lblMeta[j].midA-lblMeta[i].midA+540)%360)-180);
      if(diff<22) lblMeta[j].tier=Math.max(lblMeta[j].tier,lblMeta[i].tier+1);
    }
  }
  // Render external radial labels
  lblMeta.forEach(({b,midA,tier})=>{
    const rLine=TB_RO+2,rText=TB_RO+11+tier*14;
    const [lx1,ly1]=pt(rLine,midA),[lx2,ly2]=pt(rText-4,midA),[tx,ty]=pt(rText+2,midA);
    const cosA=Math.cos(midA*Math.PI/180);
    const anchor=cosA>0.15?'start':cosA<-0.15?'end':'middle';
    const baseColor=_visColor(b.color);
    const lblColor=(_isLightColor(b.color)||_isDarkColor(b.color))?baseColor:_lighten(b.color,0.35);
    labels+=`<line x1="${lx1.toFixed(1)}" y1="${ly1.toFixed(1)}" x2="${lx2.toFixed(1)}" y2="${ly2.toFixed(1)}" stroke="${lblColor}" stroke-width="1.2" opacity=".7" style="pointer-events:none"/>`;
    labels+=`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="5.5" font-weight="700" letter-spacing=".03em" fill="${lblColor}" font-family="Inter,system-ui" style="pointer-events:none">${esc(tbName(b))}</text>`;
  });
  // Current time dot
  const nowA=_tbAngle(nowMin),[nx,ny]=pt(TB_RO-1,nowA);
  const nowDot=`<circle cx="${nx.toFixed(2)}" cy="${ny.toFixed(2)}" r="5" fill="${darkMode?'#fff':'#18181B'}" stroke="${darkMode?'#1A1A1E':'#fff'}" stroke-width="1.5" style="pointer-events:none"/>`;
  // Center time + day display — shows drag range while dragging
  const fmt=m=>`${String(Math.floor((m%1440)/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  let centerMain=timeStr,centerSub=DAY_NAMES[todayDow].toUpperCase(),centerSubSize='8';
  let centerDur='';
  if(_tbDrag&&_tbDrag.moved){
    const db=(D.timeBlocks||[]).find(b=>b.id===_tbDrag.id);
    if(db){
      centerMain=fmt(db.startMin);centerSub=`→ ${fmt(db.endMin)}`;centerSubSize='10';
      const sp=((db.endMin-db.startMin)+1440)%1440;
      const dh=Math.floor(sp/60),dm=sp%60;
      centerDur=(dh?dh+'h ':'')+(dm?dm+'m':'');
    }
  }
  const center=`<text x="${CX}" y="${CY-(centerDur?14:9)}" text-anchor="middle" dominant-baseline="middle" font-size="26" font-weight="600" fill="${cc.overall}" font-family="Inter,system-ui" letter-spacing="-.05em" style="pointer-events:none">${centerMain}</text>
  <text x="${CX}" y="${CY+(centerDur?4:9)}" text-anchor="middle" dominant-baseline="middle" font-size="${centerSubSize}" font-weight="700" fill="${cc.ticks}" font-family="Inter,system-ui" letter-spacing=".06em" style="pointer-events:none">${centerSub}</text>
  ${centerDur?`<text x="${CX}" y="${CY+18}" text-anchor="middle" dominant-baseline="middle" font-size="8" font-weight="600" fill="${cc.ticks}" font-family="Inter,system-ui" letter-spacing=".05em" opacity=".7" style="pointer-events:none">${centerDur}</text>`:''}` ;
  // Invisible click target for adding new blocks
  const clickRing=`<path d="${ap(TB_RI,TB_RO,-90+360,-90)}" fill="transparent" style="cursor:crosshair" id="tb-ring-bg"/>`;
  const trackFill=`<path d="${ap(TB_RI,TB_RO,-90,270)}" fill="${darkMode?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)'}" style="pointer-events:none"/>`;
  const svg=`<svg id="tb-svg" viewBox="0 0 220 220" width="100%" height="100%" style="overflow:visible;display:block">
    <circle cx="${CX}" cy="${CY}" r="${TB_RO}" fill="none" stroke="${cc.grid}" stroke-width="1" opacity=".6"/>
    <circle cx="${CX}" cy="${CY}" r="${TB_RI}" fill="none" stroke="${cc.grid}" stroke-width=".6" opacity=".3"/>
    ${defs}${trackFill}${clickRing}${ticks}${arcs}${labels}${hitArcs}${center}${nowDot}
  </svg>`;
  wrap.innerHTML=svg;
  wrap.querySelectorAll('.tb-arc').forEach(el=>{
    el.addEventListener('mousedown',_tbMouseDown);
    el.addEventListener('touchstart',e=>{
      const t=e.touches[0];
      const target=e.currentTarget;
      const sx=t.clientX,sy=t.clientY;
      _tbTouchPending={sx,sy};
      clearTimeout(_tbTouchTimer);
      _tbTouchTimer=setTimeout(()=>{
        _tbTouchTimer=null;
        if(!_tbTouchPending)return;
        _tbTouchPending=null;
        _tbMouseDown({preventDefault:()=>{},stopPropagation:()=>{},currentTarget:target,clientX:sx,clientY:sy});
      },180);
    },{passive:true});
  });
  if(!wrap._touchBound){
    wrap._touchBound=true;
    document.addEventListener('touchmove',e=>{
      const t=e.touches[0];
      if(_tbDrag){
        e.preventDefault();
        _tbMouseMove({clientX:t.clientX,clientY:t.clientY});
        return;
      }
      if(_tbTouchPending){
        const dx=t.clientX-_tbTouchPending.sx,dy=t.clientY-_tbTouchPending.sy;

    },{passive:false});
    const _tbTouchEnd=()=>{
      clearTimeout(_tbTouchTimer);_tbTouchTimer=null;_tbTouchPending=null;

    };

  }
  // Custom instant tooltip
  if(!document.getElementById('tb-tip')){
    const t=document.createElement('div');t.id='tb-tip';
    t.style.cssText='position:fixed;display:none;z-index:600;pointer-events:none;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:10px 13px;font-family:var(--font);box-shadow:0 8px 24px rgba(0,0,0,.13);white-space:nowrap;min-width:140px';
    document.body.appendChild(t);
  }

  const svg_tip=document.getElementById('tb-svg');
  if(svg_tip){
    svg_tip.addEventListener('mouseover',e=>{
      const a=e.target.closest('.tb-arc');
      if(a&&a.dataset.tipname&&!_tbDrag){

        tbTip.style.display='block';
      } else tbTip.style.display='none';
    });
    svg_tip.addEventListener('mousemove',e=>{if(tbTip.style.display==='block'){tbTip.style.left=(e.clientX+16)+'px';tbTip.style.top=(e.clientY-44)+'px';}});
    svg_tip.addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('.tb-arc'))tbTip.style.display='none';});
  }
  // Click on empty ring area to add
  const svg_el=document.getElementById('tb-svg');
  if(svg_el) svg_el.addEventListener('click',e=>{
    if(e.target.classList.contains('tb-arc')||_tbDrag?.moved) return;
    const clickMin=_tbMouseMin(e);

    }
  });

}

// Today's blocks as a list, so the times and durations are readable without
// hovering every arc. Deliberately standalone rather than woven into the arc loop:
// it re-derives today's blocks from D the same way buildClockSVG does, and is
// called from its tail, so the dial's geometry code stays untouched.
function buildTbSchedule(){
  const el=document.getElementById('tb-sched'); if(!el) return;
  const now=new Date(), dow=now.getDay(), nowMin=now.getHours()*60+now.getMinutes();
  const blocks=(D.timeBlocks||[]).filter(b=>!b.days||b.days.length===0||b.days.includes(dow))
                                 .slice().sort((a,b)=>a.startMin-b.startMin);
  // Same formatting as the arc tooltips, so the list and the hover can never disagree.
  const fmtT=m=>`${String(Math.floor((m%1440)/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  const spanOf=b=>((b.endMin-b.startMin)+1440)%1440;
  const durStr=n=>{ const h=Math.floor(n/60),m=n%60; return (h?h+'h':'')+(m?(h?' ':'')+m+'m':'')||'0m'; };
  // A block that crosses midnight covers now if now is past its start or before its end.
  const covers=(b,n)=>{ const s=spanOf(b); return s>0&&((n-b.startMin)+1440)%1440<s; };
  if(!blocks.length){ el.innerHTML='<div class="tb-none">No blocks today.</div>'; return; }
  let total=0;
  const rows=blocks.map(b=>{
    const s=spanOf(b); total+=s;
    return `<div class="tb-row${covers(b,nowMin)?' tb-now':''}" data-tbid="${esc(b.id)}">
      <span class="tb-dot" style="background:${esc(b.color)}"></span>
      <span class="tb-nm">${esc(tbArrows(b.name||'Untitled'))}</span>
      <span class="tb-rg">${fmtT(b.startMin)}–${fmtT(b.endMin)}</span>
      <span class="tb-du">${durStr(s)}</span>
    </div>`;
  }).join('');
  el.innerHTML=rows+`<div class="tb-tot"><span>Scheduled</span><span>${durStr(total)}</span></div>`;
  el.querySelectorAll('.tb-row').forEach(r=>{
    r.onclick=e=>{

// Swap the name for an input seeded with it. Enter or blur commits through
// saveTimeBlock, the same path the modal uses; Escape puts the name back.
function tbEditName(span,block){
  if(span.querySelector('input')) return;
  const inp=document.createElement('input');
  inp.className='tb-nmin';
  inp.value=block.name||'';
  inp.oninput=()=>tbNameInput(inp);
  span.textContent='';
  span.appendChild(inp);
  inp.focus(); inp.select();
  let done=false;
  const finish=commit=>{
    if(done) return; done=true;
    const v=tbArrows((inp.value||'').trim());
    if(commit&&v&&v!==block.name){ saveTimeBlock({...block,name:v}); }
    buildTbSchedule();
  };
  inp.onblur=()=>finish(true);
  inp.onclick=e=>e.stopPropagation();
  inp.onkeydown=e=>{
    e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); finish(true); }
    else if(e.key==='Escape'){ e.preventDefault(); finish(false); }
  };
}

// Typed arrow shorthands become real glyphs so they survive into the clock label,
// where the name is escaped before being written into the SVG.
function tbArrows(s){
  return String(s)
    .replace(/<-+>/g,'↔').replace(/<=+>/g,'⇔')
    .replace(/-+>/g,'→').replace(/=+>/g,'⇒')
    .replace(/<-+/g,'←').replace(/<=+/g,'⇐');
}
// Convert as you type, keeping the caret where the typing left it.
function tbNameInput(el){
  const p=el.selectionStart,v=el.value,n=tbArrows(v);
  if(n===v) return;
  el.value=n;
  const c=Math.max(0,p-(v.length-n.length));
  el.setSelectionRange(c,c);
}
function closeTimeBlockModal(){const el=document.getElementById('tb-overlay');if(el)el.remove();}
function tbToggleDay(btn){const on=btn.style.background.includes('var(--text1)');btn.style.background=on?'var(--surface2)':'var(--text1)';btn.style.color=on?'var(--text3)':'var(--bg)';}
function tbPickColor(btn){document.querySelectorAll('#tb-overlay [data-color]').forEach(b=>b.style.border='2.5px solid transparent');const cb=document.getElementById('tb-custom-color');if(cb)cb.style.border='2.5px solid transparent';btn.style.border='2.5px solid var(--text1)';}
function saveTimeBlockFromModal(id){
  const name=tbArrows((document.getElementById('tb-name').value||'').trim());if(!name)return;
  const sv=document.getElementById('tb-start').value,ev=document.getElementById('tb-end').value;
  const [sh,sm]=(sv||'00:00').split(':').map(Number),[eh,em]=(ev||'01:00').split(':').map(Number);
  const colorBtn=document.querySelector('#tb-overlay [data-color][style*="var(--text1)"]');
  const customColorBtn=document.getElementById('tb-custom-color');
  const customActive=customColorBtn&&customColorBtn.style.border.includes('var(--text1)');
  const color=customActive?(customColorBtn.dataset.custom||TB_COLORS[0]):colorBtn?colorBtn.dataset.color:TB_COLORS[0];
  const days=[...document.querySelectorAll('#tb-days .tb-day-btn')].filter(b=>b.style.background.includes('var(--text1)')).map(b=>parseInt(b.dataset.day));
  const overlay=document.getElementById('tb-overlay');
  const existingBlock=(D.timeBlocks||[]).find(b=>b.id===id);
  const gid=(overlay&&overlay.dataset.gid)||(existingBlock&&existingBlock.gid)||null;
  saveTimeBlock({id,name,startMin:sh*60+sm,endMin:eh*60+em,color,days,gid});
  closeTimeBlockModal();
}
function saveTimeBlock(block){
  if(!D.timeBlocks)D.timeBlocks=[];
  const idx=D.timeBlocks.findIndex(b=>b.id===block.id);
  if(idx>=0)D.timeBlocks[idx]=block;else D.timeBlocks.push(block);
  save();buildClockSVG();
}
function deleteTimeBlock(id){
  D.timeBlocks=(D.timeBlocks||[]).filter(b=>b.id!==id);
  save();closeTimeBlockModal();buildClockSVG();
}
function duplicateTimeBlock(id){
  const src=(D.timeBlocks||[]).find(b=>b.id===id); if(!src) return;
  const copy={...src,id:_tbUuid(),name:src.name,days:[...(src.days||[])]};
  saveTimeBlock(copy);          // persist the duplicate
  openTimeBlockModal(copy);     // reopen on the copy so its time/details can be adjusted
}
