//  AFTER ACTION REVIEW
// ─────────────────────────────────────────
// Entries are addressed by an explicit month. The journal card browses months of its own, and
// a save that assumed CY/CM would write the entry into whichever month the dashboard happened
// to be showing.
// md() creates the month record, so only the write path may use it.
// ── Notebooks ───────────────────────────────────────────────────────────────
// A journal card is a notebook: its own days, its own dots, its own search. Where a notebook's
// four bags live. The legacy notebook is the month object itself, so no entry written before
// notebooks existed has to move, and a rollback finds its data exactly where it left it.
function _nbBag(mo,nb,write){
  if(!mo) return {};
  if(!nb) return mo;
  if(!mo.nb){ if(!write) return {}; mo.nb={} }
  return mo.nb[nb]||(write?(mo.nb[nb]={}):{});
}
function getAARAt(y,m,day,nb){ return _nbBag(D.months[mk(y,m)],nb).aar?.[day]||'' }
function saveAAREntryAt(y,m,day,html,nb){
  const b=_nbBag(md(y,m),nb,true);
  if(!b.aar) b.aar={};
  if(html&&html!=='<br>') b.aar[day]=html;
  else { delete b.aar[day]; if(b.aarTmpl) delete b.aarTmpl[day]; }
  save();
}

// ── Loading a template is not writing an entry ──────────────────────────────
// A day you only scaffolded used to get the same dot as a day you wrote, because the test was
// "any non-empty HTML" and a template is plenty of HTML. So the moment a template is applied we
// record what it said, and a marker is drawn only while the entry says something else.
//
// Text and not markup: reopening an entry runs it back through the rich-text normalizer, which
// renumbers lists and freezes tables. That rewrites the HTML without changing a word, and a
// markup comparison would call the entry edited when nothing had been typed.
function _aarPristine(html,stamp){
  if(!html) return false;
  const t=aarText(html);
  if(stamp!==undefined) return t===stamp;
  // No stamp: either the template predates this bookkeeping, or the entry was never a template.
  // Fall back to the templates as they stand — without this, every day already scaffolded keeps
  // its dot forever, which is the thing being complained about.
  return !!t && (D.aarTemplates||[]).some(tp=>aarText(tp.content)===t);
}
// Narrow on purpose: an entry counts as present unless it is demonstrably an untouched template.
// One with no text but real content — a table, a rule — still counts, exactly as before.
function hasAAREntryAt(y,m,day,nb){
  const b=_nbBag(D.months[mk(y,m)],nb),html=b.aar?.[day];
  return !!html && !_aarPristine(html,b.aarTmpl?.[day]);
}
function hasWeekAAREntryAt(y,m,wn,nb){
  const b=_nbBag(D.months[mk(y,m)],nb),html=b.weekAar?.[wn];
  return !!html && !_aarPristine(html,b.weekAarTmpl?.[wn]);
}
// Called when a template is applied, keyed the same way jrFlush keys its save.
function _stampAARTemplate(editor,text){
  const y=+editor.dataset.y,m=+editor.dataset.m;
  if(!Number.isFinite(y)||!Number.isFinite(m)) return;
  const b=_nbBag(md(y,m),editor.dataset.nb,true);
  if(editor.dataset.week){ (b.weekAarTmpl||(b.weekAarTmpl={}))[+editor.dataset.week]=text; }
  else if(editor.dataset.day){ (b.aarTmpl||(b.aarTmpl={}))[+editor.dataset.day]=text; }
  save();
}

function getWeekAARAt(y,m,wn,nb){ return _nbBag(D.months[mk(y,m)],nb).weekAar?.[wn]||'' }
function saveWeekAAREntryAt(y,m,wn,html,nb){
  const b=_nbBag(md(y,m),nb,true);
  if(!b.weekAar) b.weekAar={};
  if(html&&html!=='<br>') b.weekAar[wn]=html;
  else { delete b.weekAar[wn]; if(b.weekAarTmpl) delete b.weekAarTmpl[wn]; }
  save();
}
// A journal card saves as you type, so a template loaded into one has to be committed here or
// it would vanish on the next repaint.
function _aarEditorCommit(editor){
  if(editor&&editor.classList.contains('jr-ed')) jrInput(editor);
}

// These three take the editor itself. They used to take the button they were fired from and walk
// up to its card — which only worked while the buttons lived inside the card. The ⋯ menu closes
// before the action runs, so the caller resolves the editor first (see _jrEd).
function clearAAREditor(editor){
  if(!editor) return;
  if(!confirm('Clear all content in this entry?')) return;
  editor.innerHTML='';
  _aarEditorCommit(editor);
  editor.focus();
}

function saveAsAARTemplate(editor){
  if(!editor) return;
  const content=rtHTML(editor).trim();
  if(!content||content==='<br>'){alert('Write something in the editor first.');return}
  const name=prompt('Name this template:');
  if(!name||!name.trim()) return;
  D.aarTemplates.push({id:uid(),name:name.trim(),content});
  save();
}

function loadAARTemplate(tid,editor){
  const t=D.aarTemplates.find(t=>t.id===tid);
  if(!t||!editor) return;
  const cur=rtHTML(editor).trim();
  if(cur&&cur!=='<br>'&&!confirm('Load template? This replaces your current entry.')) return;
  editor.innerHTML=t.content;
  rtFreezeTables();
  _aarEditorCommit(editor);
  // Remember what the template said, so the entry can be told apart from one you wrote in.
  _stampAARTemplate(editor,aarText(t.content));
  editor.focus();
}

function deleteAARTemplate(tid){
  if(!confirm('Delete this template?')) return;
  D.aarTemplates=D.aarTemplates.filter(t=>t.id!==tid);
  save();
  _cardMenuRepaint();
}

function addGroup(){
  const color=PAL[D.groups.length%PAL.length];
  const hid=uid();const sd=todayStr();
  D.groups.push({id:uid(),name:'New Group',color,startDate:sd,habits:[{id:hid,name:'New Lever',goalDays:31,startDate:sd}]});
  applyHabitStartDateSkips(hid,sd);
  save();render();
}

// Catch-all group so a habit can be added without creating a group first.
function _defaultGroup(){
  let g=D.groups.find(g=>g._default);
  if(!g){ g={id:uid(),name:'Habits',color:PAL[D.groups.length%PAL.length],startDate:todayStr(),_default:true,habits:[]}; D.groups.push(g); }
  return g;
}
function addLooseHabit(){
  const g=_defaultGroup();
  const h={id:uid(),name:'New Lever',goalDays:31,startDate:todayStr()};
  g.habits.push(h);
  applyHabitStartDateSkips(h.id,h.startDate);
  save();render();
}

function moveGroup(gid,dir){
  const i=D.groups.findIndex(g=>g.id===gid);
  if(i===-1) return;
  const j=i+dir;
  if(j<0||j>=D.groups.length) return;
  [D.groups[i],D.groups[j]]=[D.groups[j],D.groups[i]];
  save();render();
}

function moveHabit(gid,hid,dir){
  const g=D.groups.find(g=>g.id===gid);
  if(!g) return;
  const i=g.habits.findIndex(h=>h.id===hid);
  if(i===-1) return;
  const j=i+dir;
  if(j<0||j>=g.habits.length) return;
  [g.habits[i],g.habits[j]]=[g.habits[j],g.habits[i]];
  save();render();
}

function _dropGroup(targetGid,insertBefore=true){
  if(!_dg||_dg.type!=='group'||_dg.gid===targetGid) return;
  const fi=D.groups.findIndex(g=>g.id===_dg.gid);
  if(fi===-1) return;
  const [grp]=D.groups.splice(fi,1);
  const ti=D.groups.findIndex(g=>g.id===targetGid);
  if(ti===-1) return;
  D.groups.splice(insertBefore?ti:ti+1,0,grp);
  save();render();
}

function _dropHabit(targetGid,targetHid,insertBefore=true){
  if(!_dg||_dg.type!=='habit'||_dg.hid===targetHid) return;
  const srcG=D.groups.find(g=>g.id===_dg.gid);
  const tgtG=D.groups.find(g=>g.id===targetGid);
  if(!srcG||!tgtG) return;
  const fi=srcG.habits.findIndex(h=>h.id===_dg.hid);
  if(fi===-1) return;
  const [hab]=srcG.habits.splice(fi,1);
  const ti=tgtG.habits.findIndex(h=>h.id===targetHid);
  if(ti===-1) tgtG.habits.push(hab);
  else tgtG.habits.splice(insertBefore?ti:ti+1,0,hab);
  save();render();
}

function _dropFathomItem(targetId,insertBefore=true){
  if(!_dg||_dg.type!=='fathom'||_dg.fid===targetId) return;
  const items=D.fathom.items;
  const fi=items.findIndex(i=>i.id===_dg.fid);
  if(fi===-1) return;
  const [item]=items.splice(fi,1);
  const ti=items.findIndex(i=>i.id===targetId);
  if(ti===-1) items.push(item);
  else items.splice(insertBefore?ti:ti+1,0,item);
  save();render();
}

function _dropHabitOnGroup(targetGid){
  if(!_dg||_dg.type!=='habit') return;
  const srcG=D.groups.find(g=>g.id===_dg.gid);
  const tgtG=D.groups.find(g=>g.id===targetGid);
  if(!srcG||!tgtG||srcG===tgtG) return;
  const fi=srcG.habits.findIndex(h=>h.id===_dg.hid);
  if(fi===-1) return;
  const [hab]=srcG.habits.splice(fi,1);
  tgtG.habits.unshift(hab);
  save();render();
}

function deleteGroup(gid){
  const g=D.groups.find(g=>g.id===gid);
  if(!g) return;
  const kept=(g.habits||[]).filter(h=>!h.archived).length;
  if(!confirm(kept?`Delete this group? Its ${kept} lever${kept>1?'s':''} will be kept (moved out of the group).`:'Delete this group?')) return;
  if(g.habits&&g.habits.length){
    g.habits.forEach(h=>{ if(!h.color) h.color=g.color; }); // keep each habit's look after the group is gone
    _defaultGroup().habits.push(...g.habits);
  }
  D.groups=D.groups.filter(g=>g.id!==gid);
  save();render();
}

function renameGroup(gid,name){
  const g=activeGroups().find(g=>g.id===gid);
  if(g){g.name=name.trim()||g.name;save()}
}
function changeGroupStartDate(gid,date){
  const g=D.groups.find(g=>g.id===gid);
  if(g){g.startDate=date||todayStr();save();render()}
}

function addHabit(gid){
  const g=D.groups.find(g=>g.id===gid);
  if(g){const h={id:uid(),name:'New Lever',goalDays:31,startDate:todayStr()};g.habits.push(h);applyHabitStartDateSkips(h.id,h.startDate);save();render()}
}

function deleteHabit(gid,hid){
  const g=D.groups.find(g=>g.id===gid);
  const h=g?.habits.find(h=>h.id===hid);
  if(h){h.archived=true;save();render();}
}
function restoreHabit(gid,hid){
  const g=D.groups.find(g=>g.id===gid);
  const h=g?.habits.find(h=>h.id===hid);
  if(h){h.archived=false;save();render();}
}
function purgeHabit(gid,hid){
  const g=D.groups.find(g=>g.id===gid);
  if(g) g.habits=g.habits.filter(h=>h.id!==hid);
  Object.values(D.months).forEach(mo=>{
    const inSnapshot=_habitInAnySnapshot(mo,hid);
    if(!inSnapshot){delete mo.completions?.[hid];delete mo.skips?.[hid];}
  });
  save();render();
}
function clearHabitHistory(hid){
  if(!confirm('Clear all logged history for this lever? The lever stays active but all past completions and skips are erased.\n\nThis cannot be undone.')) return;
  Object.values(D.months).forEach(mo=>{
    const inSnapshot=_habitInAnySnapshot(mo,hid);
    if(!inSnapshot){if(mo.completions?.[hid])mo.completions[hid]={};if(mo.skips?.[hid])mo.skips[hid]={};}
  });
  for(const g of D.groups){const h=g.habits.find(h=>h.id===hid);if(h&&h.startDate){applyHabitStartDateSkips(hid,h.startDate);}break;}
  save();render();
}
function mkArchivedPanel(){
  const allArchived=D.groups.flatMap(g=>g.habits.filter(h=>h.archived).map(h=>({...h,gid:g.id,gc:g.color,gn:g.name})));
  if(!allArchived.length) return null;
  const panel=document.createElement('div');
  panel.className='arch-panel';
  panel.innerHTML=`<div class="arch-panel-title">Archived Levers</div>`+
    allArchived.map(h=>`<div class="arch-item">
      <div class="arch-item-name">${esc(h.name)}</div>
      <div class="arch-item-grp" style="color:${h.gc}">${esc(h.gn)}</div>
      <button class="restore-btn" onclick="restoreHabit('${h.gid}','${h.id}')">Restore</button>
      <button class="purge-btn" onclick="confirmDeleteHabit('${h.gid}','${h.id}')">Delete</button>
    </div>`).join('');
  return panel;
}

function updateHabitField(hid,field,val){
  const h=activeGroups().flatMap(g=>g.habits).find(h=>h.id===hid);
  if(h){h[field]=val;save();}
}
function renameHabit(hid,name){
  for(const g of activeGroups()){
    const h=g.habits.find(h=>h.id===hid);
    if(h){h.name=name.trim()||h.name;save();return}
  }
}
function toggleHabitFreqDay(hid,dow){
  for(const g of D.groups){
    const h=g.habits.find(h=>h.id===hid);
    if(h){
      if(!h.freq||h.freq.length>=7) h.freq=[0,1,2,3,4,5,6];
      const idx=h.freq.indexOf(dow);
      if(idx>=0){if(h.freq.length>1)h.freq.splice(idx,1);}
      else{h.freq.push(dow);h.freq.sort((a,b)=>a-b);}
      save();render();return;
    }
  }
}
function setHabitWeeklyTarget(hid,val){
  const n=Math.max(0,Math.min(7,parseInt(val,10)||0));
  for(const g of D.groups){
    const h=g.habits.find(h=>h.id===hid);
    if(h){h.weeklyTarget=n;save();render();return;}
  }
}
function setHabitDailyTarget(hid,val){
  const n=Math.max(1,Math.min(99,parseInt(val,10)||1));
  for(const g of D.groups){
    const h=g.habits.find(h=>h.id===hid);
    if(h){h.dailyTarget=n;save();render();return;}
  }
}
function habitWeeklyProgress(y,m,hid,weekIndex){
  const spans=getWeekSpans(y,m);
  const span=spans.find(s=>s.week===weekIndex);
  if(!span) return null;
  const groups=activeGroupsForWeek(y,m,weekIndex,span.end);
  let target=0;
  for(const g of groups){const h=g.habits.find(h=>h.id===hid);if(h){target=h.weeklyTarget||0;break;}}
  if(!target) return null;
  const mo=D.months[mk(y,m)];
  let done=0;
  for(let d=span.start;d<=span.end;d++){if(mo&&mo.completions[hid]&&mo.completions[hid][d])done++;}
  return {done,target};
}
function changeHabitStartDate(hid,date){
  for(const g of D.groups){
    const h=g.habits.find(h=>h.id===hid);
    if(h){
      const newDate=date||todayStr();
      const oldDate=h.startDate||newDate;
      if(newDate!==oldDate&&!confirm(`Changing the start date to ${fmtDate(newDate)} will affect skips and completions. Continue?`))return;
      h.startDate=newDate;applyHabitStartDateSkips(hid,h.startDate);
      if(newDate<oldDate){const start=new Date(newDate+'T00:00:00'),end=new Date(oldDate+'T00:00:00');Object.keys(D.months).forEach(k=>{const[ys,ms]=k.split('-');const mo=D.months[k];if(!mo.skips[hid])return;const days=dim(+ys,+ms-1);for(let d=1;d<=days;d++){const dt=new Date(+ys,+ms-1,d);if(dt>=start&&dt<end)mo.skips[hid][d]=false;}});}
      save();render();return;
    }
  }
}

function applyHabitStartDateSkips(hid,startDateIso){
  if(!startDateIso)return;
  const start=new Date(startDateIso+'T00:00:00');
  if(isNaN(start.getTime()))return;
  const maxFuture=new Date();maxFuture.setFullYear(maxFuture.getFullYear()+1);
  if(start>maxFuture)return;
  const startY=start.getFullYear(),startM=start.getMonth();
  const write=(y,m)=>{const mo=md(y,m);if(!mo.skips[hid])mo.skips[hid]={};if(!mo.completions[hid])mo.completions[hid]={};const days=dim(y,m);for(let d=1;d<=days;d++){if(new Date(y,m,d)<start){mo.completions[hid][d]=false;mo.skips[hid][d]=true;}}};
  Object.keys(D.months).forEach(k=>{const[ys,ms]=k.split('-');write(+ys,+ms-1);});
  let y=CY,m=CM;
  while(y<startY||(y===startY&&m<=startM)){write(y,m);m++;if(m>11){y++;m=0;}}
}
function applyFathomStartDateSkips(fid,startDateIso){
  const start=new Date(startDateIso+'T00:00:00');
  const startY=start.getFullYear(),startM=start.getMonth();
  const write=(y,m)=>{const k=mk(y,m);if(!D.months[k])D.months[k]={quote:'',notes:'',completions:{},skips:{},fathomCompletions:{},fathomSkips:{}};const mo=D.months[k];if(!mo.fathomCompletions)mo.fathomCompletions={};if(!mo.fathomSkips)mo.fathomSkips={};if(!mo.fathomSkips[fid])mo.fathomSkips[fid]={};if(!mo.fathomCompletions[fid])mo.fathomCompletions[fid]={};const days=dim(y,m);for(let d=1;d<=days;d++){if(new Date(y,m,d)<start){mo.fathomCompletions[fid][d]=false;mo.fathomSkips[fid][d]=true;}}};
  Object.keys(D.months).forEach(k=>{const[ys,ms]=k.split('-');write(+ys,+ms-1);});
  let y=CY,m=CM;
  while(y<startY||(y===startY&&m<=startM)){write(y,m);m++;if(m>11){y++;m=0;}}
}

function _bindTouchScroll(el){
  if(!el||el._ptScrollBound)return;
  el._ptScrollBound=true;
  let pid=null,sx=0,sy=0,sl=0,axis=null;
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;sl=el.scrollLeft;axis=null;
    el.setPointerCapture(pid);
  });
  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!axis&&Math.sqrt(dx*dx+dy*dy)>6){
      axis=Math.abs(dx)>=Math.abs(dy)?'x':'y';
      if(axis==='y'){el.releasePointerCapture(pid);pid=null;return;}
    }
    if(axis==='x')el.scrollLeft=sl-dx;
  });
  el.addEventListener('pointerup',()=>{pid=null;axis=null;});
  el.addEventListener('pointercancel',()=>{pid=null;axis=null;});
}

        tr.ondragover=e=>{
          if(_dg?.type==='habit'&&_dg.hid!==h.id){
            e.preventDefault();
            const{top,height}=tr.getBoundingClientRect();
            tr.classList.remove('dnd-ins-t','dnd-ins-b');
            tr.classList.add(e.clientY<top+height/2?'dnd-ins-t':'dnd-ins-b');
          }
        };
        tr.ondragleave=()=>{tr.classList.remove('dnd-ins-t','dnd-ins-b')};
        tr.ondrop=e=>{
          e.preventDefault();
          const{top,height}=tr.getBoundingClientRect();
          tr.classList.remove('dnd-ins-t','dnd-ins-b');
          _dropHabit(g.id,h.id,e.clientY<top+height/2);
        };
      } else {
        const _hztip=(h.why||h.mvp)?` data-why="${(h.why||'').replace(/"/g,'&quot;')}" data-mvp="${(h.mvp||'').replace(/"/g,'&quot;')}" onmouseenter="openHabitTip(event)" onmouseleave="closeHabitTip()" style="cursor:default"`:'';
        const _refDay=isCurMo?todayD:days;
        const _wi=weekOfDay(CY,CM,_refDay);
        const _wp=habitWeeklyProgress(CY,CM,h.id,_wi);
        const _wpBadge=_wp?`<span class="wk-target-badge" title="This week's target">${_wp.done}/${_wp.target}</span>`:'';
        const _hDot=`<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${hc};margin-right:5px;flex-shrink:0;vertical-align:middle"></span>`;
        nameTd.innerHTML=`<div class="hz-habit-name"${_hztip}>${_hDot}${esc(h.name)}${_wpBadge}</div>${g._default?'':`<div class="hz-habit-grp" style="color:${g.color}">${esc(g.name)}</div>`}`;
      }
      tr.appendChild(nameTd);

      let rowDone=0,rowTotal=0;
      for(let d=1;d<=days;d++){
        const dow=new Date(CY,CM,d).getDay();
        const isToday=d===todayD;
        const isFuture=isCurMo&&d>todayD;
        const isWeekStart=dow===WS()&&d>1;
        const cnt=chkCount(h.id,d);
        const tgt=Math.max(1,h.dailyTarget||1);
        const frac=Math.min(cnt,tgt)/tgt;
        const chk=frac>=1&&cnt>0;
        const skp=isSkip(h.id,d);
        const foff=h.freq&&h.freq.length<7&&!h.freq.includes(dow);
        const bstart=!chk&&h.startDate&&new Date(CY,CM,d)<new Date(h.startDate+'T00:00:00');
        if(!isFuture&&!skp&&!foff){rowDone+=frac;rowTotal++}
        const td=document.createElement('td');
        td.className='hz-chk-c'+(isToday?' today-col':'')+(isFuture?' future':'')+(isWeekStart?' hz-week-sep':'')+(foff?' freq-off-c':'');
        td.id=`hzcc-${h.id}-${d}`;
        td.dataset.color=hc;
        if(!isFuture&&!foff) td.onclick=()=>doHzToggle(h.id,d,hc);
        const _fp=_chkFillParts(hc,skp?0:frac,skp);
        const _numLbl=(tgt>=5&&cnt>0&&frac<1)?`<span style="font-size:9px;font-weight:700;color:var(--text3);line-height:1">${cnt}</span>`:'';
        td.innerHTML=`<div class="chk-box${chk?' checked':skp?' skipped':foff?' freq-off':bstart?' before-start':''}" id="hzcb-${h.id}-${d}" style="background:${_fp.bg};border-color:${_fp.bd}">${_numLbl}</div>`;
        tr.appendChild(td);
      }

      const doneTd=document.createElement('td');doneTd.className='sr sr-1 hz-sum-td first-sum';doneTd.id=`hzds-${h.id}`;
      doneTd.innerHTML=`${Math.round(rowDone)}<span style="color:var(--text3);font-size:9px">/${rowTotal}</span>`;
      tr.appendChild(doneTd);
      tbody.appendChild(tr);
    });
  });
  t.appendChild(tbody);
  return t;
}

function doHzToggle(hid,day,color){
  toggle(hid,day);
  // animate the checkbox
  const box=document.getElementById(`hzcb-${hid}-${day}`);
  if(box) _applyChkFill(box,color,chkCount(hid,day),habitTarget(hid,day),isSkip(hid,day));
  // update habit's row summary
  const today=new Date();
  const isCurMo=today.getFullYear()===CY&&today.getMonth()===CM;
  const todayD=isCurMo?today.getDate():dim(CY,CM);
  const days=dim(CY,CM);
  let rowDone=0,rowTotal=0;
  for(let d=1;d<=todayD;d++){
    if(isFreqExcluded(hid,d)) continue;
    if(!isSkip(hid,d)){rowDone+=chkFrac(hid,d);rowTotal++;}
  }
  const ds=document.getElementById(`hzds-${hid}`);
  if(ds) ds.innerHTML=`${Math.round(rowDone)}<span style="color:var(--text3);font-size:9px">/${rowTotal}</span>`;
  // update the per-day count row (in thead)
  const dpEl=document.getElementById(`hzdp-${day}`);
  if(dpEl) dpEl.innerHTML=_dayCount(day);
  // refresh chart + stats
  updStats();
  updateHzChart();
  updTide();
}

function buildHzChart(){
  const canvas=document.getElementById('hz-pc');
  if(!canvas) return;
  if(hzChartInst){hzChartInst.destroy();hzChartInst=null}

  const days=dim(CY,CM);
  const dayTh=document.querySelector('.hz-day-th');
  const colW=dayTh?dayTh.offsetWidth:40;
  // Canvas is inside <th colSpan=days>, so canvas.width = days*colW exactly.
  // With x:{min:1,max:days} and symmetric padding of half a column:
  //   Day D center in canvas = colW*0.5 + (D-1)*colW = (D-0.5)*colW
  //   Table column D center  = (D-0.5)*colW  ← guaranteed pixel-perfect
  const padL=colW*0.5;
  const padR=colW*0.5;

  const {overall,groups}=cumulData();
  const cc=chartConf();
  const datasets=[];
  datasets.push({label:'Perfection',data:(()=>{const fad=firstActiveDay();let mt=0;for(let d=1;d<=days;d++)mt+=dayProg(d).total;if(!mt)return[];const pts=[];let acc=0;for(let d=fad;d<=days;d++){acc+=dayProg(d).total;pts.push({x:d,y:Math.round(acc/mt*100)});}return pts;})(),borderColor:cc.ref,borderWidth:1.5,borderDash:[5,5],tension:0,fill:false,pointRadius:0,pointHoverRadius:0});
  datasets.push({label:'Trajectory',data:cumulProgressData(),borderColor:cc.cumul,backgroundColor:'transparent',borderWidth:1,borderDash:[4,3],tension:0,fill:false,pointRadius:0,pointHoverRadius:3});
  datasets.push({label:'Total',data:overall,borderColor:cc.overall,backgroundColor:cc.fill,borderWidth:2.5,tension:.4,fill:'origin',pointRadius:0,pointHoverRadius:5});
  groups.forEach(g=>{datasets.push({label:g.name,data:g.data,borderColor:g.color,backgroundColor:'transparent',borderWidth:1.5,tension:.4,fill:false,pointRadius:0,pointHoverRadius:4});});
  window._lgGrpNames=groups.map(g=>g.name);
  window._lgRefLabels=['Perfection','Trajectory'];
  hzChartInst=new Chart(canvas,{
    type:'line',
    data:{labels:Array.from({length:days},(_,i)=>i+1),datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      animation:{duration:0},
      interaction:{mode:'index',intersect:false},
      layout:{padding:{left:padL,right:padR,top:16,bottom:0}},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:cc.tipBg,titleColor:'#fff',bodyColor:cc.tipBdy,
          borderColor:cc.tipBdr,borderWidth:1,padding:9,
          titleFont:{size:11},bodyFont:{size:10},
          callbacks:{title:c=>`Day ${c[0].label}`,label:c=>` ${c.dataset.label}: ${c.parsed.y}%`}
        }
      },
      scales:{
        x:{type:'linear',min:1,max:days,ticks:{stepSize:5,font:{size:10,family:"'Inter',system-ui"},color:cc.ticks,maxRotation:0},grid:{color:cc.grid},border:{display:false}},
        y:{min:0,max:100,ticks:{display:false,stepSize:25},grid:{color:cc.grid},border:{display:false}}
      }
    }
  });
  requestAnimationFrame(()=>{
    if(!hzChartInst||!hzChartInst.chartArea) return;
    const ds=hzChartInst.data.datasets.find(d=>d.label==='Total');
    if(ds){ds.backgroundColor=chartFillGradient(hzChartInst.ctx,hzChartInst.chartArea);hzChartInst.update('none');}
  });
  _refreshPresetBtns();
  // A rebuilt chart starts with every series visible; restore the active preset so the
  // highlighted button and the lines on screen actually agree.
  _applyChartSolo();
}

function updateHzChart(){
  if(!hzChartInst){buildHzChart();return}
  const {overall,groups}=cumulData();
  const cp=cumulProgressData();
  hzChartInst.data.datasets.forEach(ds=>{
    if(ds.label==='Total') ds.data=overall;
    if(ds.label==='Trajectory') ds.data=cp;
    const g=groups.find(gg=>gg.name===ds.label);
    if(g) ds.data=g.data;
  });
  if(hzChartInst.chartArea){
    const ds=hzChartInst.data.datasets.find(d=>d.label==='Total');
    if(ds) ds.backgroundColor=chartFillGradient(hzChartInst.ctx,hzChartInst.chartArea);
  }
  hzChartInst.options.animation={duration:400,easing:'easeOutQuart'};
  hzChartInst.update();
  _refreshPresetBtns();
}

function buildFathomTodayTable(items,todayD,isCurMo){
  const wrap=document.createElement('div');
  wrap.style.cssText='padding:0 0 8px';
  // Date label
  const now=new Date();
  const lbl=document.createElement('div');
  lbl.style.cssText='font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:8px 14px 6px';
  lbl.textContent=isCurMo?`TODAY — ${now.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase()}`:'(PAST MONTH)';
  wrap.appendChild(lbl);
  const t=document.createElement('table');
  t.style.cssText='width:100%;border-collapse:collapse';
  const tb=document.createElement('tbody');
  items.forEach(item=>{
    // calc month done
    let done=0,total=0;
    const days=dim(CY,CM);
    for(let d=1;d<=days;d++){
      const dow=new Date(CY,CM,d).getDay();
      const foff=item.freq&&item.freq.length<7&&!item.freq.includes(dow);
      if(!foff){if(isChkFathom(item.id,d))done++;total++;}
    }
    const chk=todayD>0?isChkFathom(item.id,todayD):false;
    const tr=document.createElement('tr');
    tr.style.cssText='border-bottom:1px solid var(--border2)';
    // Question
    const tdQ=document.createElement('td');
    tdQ.style.cssText='padding:10px 8px 10px 14px;font-size:12px;color:var(--text2);font-weight:500;line-height:1.3';
    tdQ.textContent=item.name;
    // Checkbox
    const tdC=document.createElement('td');
    tdC.style.cssText='padding:8px 6px;text-align:center;width:44px';
    if(todayD>0){
      tdC.innerHTML=`<div class="chk-box${chk?' checked':''}" id="fhzcb-${item.id}-${todayD}" style="width:34px;height:34px;border-radius:8px;margin:0 auto;background:${chk?FATHOM_COLOR:'transparent'};border:2px solid ${chk?FATHOM_COLOR:'var(--border)'}"></div>`;
      tdC.onclick=()=>doFathomToggle(item.id,todayD);
      tdC.style.cursor='pointer';
    }
    // Month count
    const tdD=document.createElement('td');
    tdD.style.cssText='padding:8px 14px 8px 4px;text-align:right;width:60px;font-size:11px;color:var(--text3);white-space:nowrap';
    tdD.innerHTML=`${done}<span style="font-size:9px">/${total}</span>`;
    tr.appendChild(tdQ);tr.appendChild(tdC);tr.appendChild(tdD);
    tb.appendChild(tr);
  });
  t.appendChild(tb);wrap.appendChild(t);
  return wrap;
}

  fWkSpans.forEach((ws,wi)=>{

function doFathomToggle(iid,day){
  toggleFathom(iid,day);
  const chk=isChkFathom(iid,day);
  const skp=isSkipFathom(iid,day);
  const box=document.getElementById(`fhzcb-${iid}-${day}`);
  if(box){
    box.classList.toggle('checked',chk);
    box.classList.toggle('skipped',skp);
    box.style.background=chk?FATHOM_COLOR:'transparent';
    box.style.borderColor=chk?FATHOM_COLOR:'var(--border)';
    box.classList.remove('chk-pop');
    if(chk) requestAnimationFrame(()=>box.classList.add('chk-pop'));
  }
  // Update the day's count
  const dpEl=document.getElementById(`fdp-${day}`);
  if(dpEl) dpEl.innerHTML=_fDayCount(day);
  // Update item row summary
  const isCurMo=CY===new Date().getFullYear()&&CM===new Date().getMonth();
  const lastD=isCurMo?new Date().getDate():dim(CY,CM);
  let rowDone=0,rowTotal=0;
  for(let d=1;d<=lastD;d++){if(!isSkipFathom(iid,d)){if(isChkFathom(iid,d))rowDone++;rowTotal++;}}
  const ds=document.getElementById(`fhzds-${iid}`);
  if(ds) ds.innerHTML=`${rowDone}<span style="color:var(--text3);font-size:9px">/${rowTotal}</span>`;
  updFathomHeader();
  updStats();
  updTide();
}

function doFathomSkipToggle(iid,day){
  skipToggleFathom(iid,day);
  const chk=isChkFathom(iid,day);
  const skp=isSkipFathom(iid,day);
  const box=document.getElementById(`fhzcb-${iid}-${day}`);
  if(box){
    box.classList.toggle('checked',chk);
    box.classList.toggle('skipped',skp);
    box.style.background=chk?FATHOM_COLOR:'transparent';
    box.style.borderColor=chk?FATHOM_COLOR:'var(--border)';
  }
  const dpEl=document.getElementById(`fdp-${day}`);
  if(dpEl) dpEl.innerHTML=_fDayCount(day);
  const isCurMo=CY===new Date().getFullYear()&&CM===new Date().getMonth();
  const lastD=isCurMo?new Date().getDate():dim(CY,CM);
  let rowDone=0,rowTotal=0;
  for(let d=1;d<=lastD;d++){if(!isSkipFathom(iid,d)){if(isChkFathom(iid,d))rowDone++;rowTotal++;}}
  const ds=document.getElementById(`fhzds-${iid}`);
  if(ds) ds.innerHTML=`${rowDone}<span style="color:var(--text3);font-size:9px">/${rowTotal}</span>`;
  updFathomHeader();
  updStats();updTide();
}

function updFathomHeader(){
  const el=document.getElementById('fathom-hdr-grade'); if(!el) return;
  const {done,poss,hasData}=fathomMonthStats();
  el.innerHTML=hasData?`${done}/${poss}`:'';
  el.style.color='var(--text2)';
}

function addFathomItem(){
  if(!D.fathom) D.fathom={items:[]};
  const item={id:uid(),name:'New Item',startDate:todayStr()};
  D.fathom.items.push(item);
  applyFathomStartDateSkips(item.id,item.startDate);
  save();render();
}
function renameFathomItem(id,name){
  const item=D.fathom?.items?.find(i=>i.id===id);
  if(item){item.name=name.trim()||item.name;save();}
}
function toggleFathomFreqDay(id,dow){
  const item=D.fathom?.items?.find(i=>i.id===id);
  if(item){
    if(!item.freq||item.freq.length>=7) item.freq=[0,1,2,3,4,5,6];
    const idx=item.freq.indexOf(dow);
    if(idx>=0){if(item.freq.length>1)item.freq.splice(idx,1);}
    else{item.freq.push(dow);item.freq.sort((a,b)=>a-b);}
    save();render();
  }
}
function changeFathomStartDate(id,date){
  const item=D.fathom?.items?.find(i=>i.id===id);
  if(item){item.startDate=date||todayStr();applyFathomStartDateSkips(item.id,item.startDate);save();render();}
}
function clearFathomHistory(id){
  const item=(D.fathom?.items||[]).find(i=>i.id===id);
  const name=item?`"${item.name}"`:'this Fathom item';
  if(!confirm(`Clear all logged history for ${name}? The item stays active but all past completions and skips are erased.\n\nThis cannot be undone.`)) return;
  Object.values(D.months).forEach(mo=>{
    if(mo.fathomCompletions?.[id]) mo.fathomCompletions[id]={};
    if(mo.fathomSkips?.[id]) mo.fathomSkips[id]={};
  });
  save();render();
}
function archiveFathomItem(id){
  const item=(D.fathom?.items||[]).find(i=>i.id===id);
  if(item){item.archived=true;_lastArchived={type:'fathom',id};save();_showArchiveToast('Fathom item archived');render();}
}
function restoreFathomItem(id){
  const item=(D.fathom?.items||[]).find(i=>i.id===id);
  if(item){item.archived=false;save();render();}
}
function confirmDeleteFathomItem(id){
  const item=(D.fathom?.items||[]).find(i=>i.id===id);
  const name=item?`"${item.name}"`:'this Fathom item';
  const hasHist=Object.values(D.months).some(mo=>mo.fathomCompletions?.[id]&&Object.values(mo.fathomCompletions[id]).some(v=>v));
  const msg=hasHist?`Permanently delete ${name} and all its completion history?\n\nThis cannot be undone.`:`Delete ${name}?\n\nThis cannot be undone.`;
  if(confirm(msg)){D.fathom.items=(D.fathom.items||[]).filter(i=>i.id!==id);save();render();}
}
function deleteFathomItem(id){confirmDeleteFathomItem(id);}
function mkArchivedFathomPanel(){
  const allArchived=(D.fathom?.items||[]).filter(i=>i.archived);
  if(!allArchived.length) return null;
  const panel=document.createElement('div');
  panel.className='arch-panel';
  panel.innerHTML=`<div class="arch-panel-title">Archived Fathom Items</div>`+
    allArchived.map(item=>`<div class="arch-item">
      <div class="arch-item-name">${esc(item.name)}</div>
      <button class="restore-btn" onclick="restoreFathomItem('${item.id}')">Restore</button>
      <button class="purge-btn" onclick="confirmDeleteFathomItem('${item.id}')">Delete</button>
    </div>`).join('');
  return panel;
}

// ─────────────────────────────────────────
//  MULTI-CELL SELECTION
// ─────────────────────────────────────────
function _updSelBar(){
  const bar=document.getElementById('sel-bar');
  const cnt=document.getElementById('sel-count');
  if(!bar) return;
  if(_sel.size>0){bar.style.display='flex';if(cnt)cnt.textContent=`${_sel.size} cell${_sel.size>1?'s':''} selected`;}
  else bar.style.display='none';
}
function _selClear(){
  _sel.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('sel')});
  _sel.clear();_updSelBar();
}
function _parseSel(id){
  const m=id.match(/^(fhzcc|hzcc|cc)-(.+)-(\d+)$/);
  if(!m) return null;
  return {type:m[1]==='fhzcc'?'fathom':'habit',id:m[2],day:+m[3]};
}
function _setHabitState(hid,day,done,skip){
  const mo=md(CY,CM);
  if(!mo.completions[hid])mo.completions[hid]={};
  if(!mo.skips[hid])mo.skips[hid]={};
  mo.completions[hid][day]=done?habitTarget(hid,day):0; // drag-mark fills to the full daily target
  mo.skips[hid][day]=skip;
}
function _setFathomState(iid,day,done,skip){
  const mo=fathomMd();
  if(!mo.fathomCompletions[iid])mo.fathomCompletions[iid]={};
  if(!mo.fathomSkips[iid])mo.fathomSkips[iid]={};
  mo.fathomCompletions[iid][day]=done;
  mo.fathomSkips[iid][day]=skip;
}
function _selAddCell(el){
  if(!el||!el.id||el.classList.contains('future')||!_parseSel(el.id)) return;
  _sel.add(el.id);el.classList.add('sel');
}

// Drag-to-select + long-press-to-skip (capture phase so it runs before onclick)
document.addEventListener('mousedown',e=>{
  if(e.button!==0) return; // ignore right/middle click (right-click opens the comment popup)
  const c=e.target.closest('.chk-c:not(.future),.hz-chk-c:not(.future)');
  if(!c||!_parseSel(c.id)) return;
  _selMD=true;_selDrag=false;_selBlock=false;_selAnchor=c.id;
  clearTimeout(_lpTimer);_lpFired=false;
  _lpTimer=setTimeout(()=>{
    if(_selDrag) return;
    _lpFired=true;
    const p=_parseSel(c.id);
    if(!p) return;
    if(p.type==='fathom') doFathomSkipToggle(p.id,p.day);
    else doSkipToggle(p.id,p.day,c.dataset.color||'var(--accent)');
  },500);
},true);

document.addEventListener('mouseover',e=>{
  if(!_selMD) return;
  const c=e.target.closest('.chk-c:not(.future),.hz-chk-c:not(.future)');
  if(!c||!_parseSel(c.id)) return;
  if(!_selDrag){
    _selDrag=true;_selBlock=true;_selClear();_selPath=[];
    clearTimeout(_lpTimer);_lpTimer=null;
    if(_selAnchor){const a=document.getElementById(_selAnchor);if(a){_selAddCell(a);_selPath=[a.id];}}
  }
  const idx=_selPath.indexOf(c.id);
  if(idx!==-1){
    // backtrack: keep this cell, remove everything after it
    const removed=_selPath.splice(idx+1);
    removed.forEach(id=>{_sel.delete(id);const el=document.getElementById(id);if(el)el.classList.remove('sel');});
  } else {
    _selAddCell(c);_selPath.push(c.id);
  }
  _updSelBar();
},true);

document.addEventListener('mouseup',()=>{_selMD=false;clearTimeout(_lpTimer);_lpTimer=null;},true);

document.addEventListener('click',e=>{
  if(_lpFired){_lpFired=false;e.stopPropagation();return;}
  if(_selBlock){_selBlock=false;e.stopPropagation();return;}
  const c=e.target.closest('.chk-c:not(.future),.hz-chk-c:not(.future)');
  if(e.shiftKey&&c&&_parseSel(c.id)){
    e.stopPropagation();
    if(_sel.has(c.id)){_sel.delete(c.id);c.classList.remove('sel');}
    else _selAddCell(c);
    _updSelBar();return;
  }
  if(_sel.size>0) _selClear();
},true);

// Space = cycle all selected cells
document.addEventListener('keydown',e=>{
  if(e.code==='Escape'){_selClear();if(editMode||fathomEditMode){editMode=false;fathomEditMode=false;render();}return;}
  if(e.code!=='Space'||_sel.size===0) return;
  const t=e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||e.target.isContentEditable) return;
  e.preventDefault();
  // Tally states across selection
  let ec=0,dc=0,sc=0;
  _sel.forEach(id=>{
    const p=_parseSel(id);if(!p) return;
    const done=p.type==='fathom'?isChkFathom(p.id,p.day):isChk(p.id,p.day);
    const skip=p.type==='fathom'?isSkipFathom(p.id,p.day):isSkip(p.id,p.day);
    if(done)dc++;else if(skip)sc++;else ec++;
  });
  // Majority state → cycle to next: empty→done, done→skip, skip→empty
  const mx=Math.max(ec,dc,sc);
  let td=false,ts=false;
  if(mx===ec)td=true;
  else if(mx===dc)ts=true;
  // Apply to all selected cells
  _sel.forEach(id=>{
    const p=_parseSel(id);if(!p) return;
    if(p.type==='fathom') _setFathomState(p.id,p.day,td,ts);
    else _setHabitState(p.id,p.day,td,ts);
  });
  save();
  _keepSel=true;
  render();
});

// ── Per-cell comments (right-click a checkbox to add a note for that day) ──
function _cellIds(type,id,day){ return type==='fathom'?[`fhzcc-${id}-${day}`]:[`cc-${id}-${day}`,`hzcc-${id}-${day}`]; }
function getCellComment(type,id,day){
  const mo=D.months[mk(CY,CM)]; if(!mo) return '';
  const store=type==='fathom'?mo.fathomComments:mo.comments;
  return (store&&store[id]&&store[id][day])||'';
}
function setCellComment(type,id,day,text){
  const mo=md(CY,CM);
  const key=type==='fathom'?'fathomComments':'comments';
  if(!mo[key]) mo[key]={};
  if(!mo[key][id]) mo[key][id]={};
  text=(text||'').trim();
  if(text) mo[key][id][day]=text;
  else { delete mo[key][id][day]; if(!Object.keys(mo[key][id]).length) delete mo[key][id]; }
  save();
  _applyCommentMarker(type,id,day);
}
function _applyCommentMarker(type,id,day){
  const txt=getCellComment(type,id,day);
  _cellIds(type,id,day).forEach(cid=>{const el=document.getElementById(cid);if(!el)return;el.classList.toggle('has-comment',!!txt);if(txt)el.title=txt;else el.removeAttribute('title');});
}
function _applyAllCommentMarkers(){
  const mo=D.months[mk(CY,CM)]; if(!mo) return;
  [['comments','habit'],['fathomComments','fathom']].forEach(([k,type])=>{
    const store=mo[k]; if(!store) return;
    Object.keys(store).forEach(id=>Object.keys(store[id]).forEach(day=>{ if(store[id][day]) _applyCommentMarker(type,id,+day); }));
  });
}
function closeCommentPopup(){ const el=document.getElementById('comment-pop'); if(el)el.remove(); document.removeEventListener('mousedown',_commentOutside,true); document.removeEventListener('keydown',_commentKey,true); }
function _commentOutside(e){ const p=document.getElementById('comment-pop'); if(p&&!p.contains(e.target)) closeCommentPopup(); }
function _commentKey(e){ if(e.key==='Escape'){ closeCommentPopup(); } else if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ _commentSave(); } }
function openCommentPopup(type,id,day,x,y){
  closeCommentPopup();
  const cur=getCellComment(type,id,day);
  const btn=(label,handler,style)=>`<button onclick="${handler}" style="border:1px solid var(--border2);border-radius:var(--r2);padding:5px 11px;cursor:pointer;font-family:var(--font);font-size:12px;background:${style?.bg||'none'};color:${style?.fg||'var(--text2)'};${style?.border?`border-color:${style.border};`:''}">${label}</button>`;
  const pop=document.createElement('div');
  pop.id='comment-pop';
  pop.dataset.type=type; pop.dataset.cid=id; pop.dataset.day=day;
  pop.style.cssText=`position:fixed;z-index:1200;left:${x}px;top:${y}px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow-md);padding:11px;width:240px;box-sizing:border-box`;
  pop.innerHTML=`
    <div style="font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px">Comment</div>
    <textarea id="comment-ta" style="width:100%;height:72px;resize:vertical;border:1px solid var(--border);border-radius:var(--r2);background:var(--surface2);color:var(--text1);font-family:var(--font);font-size:12px;line-height:1.45;padding:7px;box-sizing:border-box;outline:none">${esc(cur)}</textarea>
    <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px">
      ${cur?btn('Delete','_commentDelete()',{fg:'var(--red)',border:'var(--border2)'}):''}
      ${btn('Cancel','closeCommentPopup()')}
      ${btn('Save','_commentSave()',{bg:'var(--text1)',fg:'var(--bg)',border:'var(--text1)'})}
    </div>`;
  document.body.appendChild(pop);
  const r=pop.getBoundingClientRect();
  if(r.right>window.innerWidth) pop.style.left=Math.max(8,window.innerWidth-r.width-8)+'px';
  if(r.bottom>window.innerHeight) pop.style.top=Math.max(8,window.innerHeight-r.height-8)+'px';
  const ta=document.getElementById('comment-ta'); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
  document.addEventListener('mousedown',_commentOutside,true);
  document.addEventListener('keydown',_commentKey,true);
}
function _commentSave(){ const p=document.getElementById('comment-pop'); if(!p)return; setCellComment(p.dataset.type,p.dataset.cid,+p.dataset.day,document.getElementById('comment-ta').value); closeCommentPopup(); }
function _commentDelete(){ const p=document.getElementById('comment-pop'); if(!p)return; setCellComment(p.dataset.type,p.dataset.cid,+p.dataset.day,''); closeCommentPopup(); }

// Right-click a habit/fathom checkbox to add or edit a per-day comment
document.addEventListener('contextmenu',e=>{
  const c=e.target.closest('.chk-c,.hz-chk-c');
  if(!c) return;
  e.preventDefault();
  const p=_parseSel(c.id);
  if(!p) return;
  openCommentPopup(p.type,p.id,p.day,e.clientX,e.clientY);
});

// Auto-scroll the page (or nearest scroll container) while dragging habits/groups
// near the top/bottom edge, so distant reorders are reachable. Gated on _dg so it
// only runs during an active drag, and covers every drag context that sets _dg.
let _dragScrollRAF=null,_dragScrollV=0,_dragScrollEl=null;
function _findScrollable(el){
  for(;el&&el!==document.body;el=el.parentElement){
    const s=getComputedStyle(el);
    if(/(auto|scroll)/.test(s.overflowY)&&el.scrollHeight>el.clientHeight) return el;
  }
  return null;
}
function _dragScrollTick(){
  if(_dragScrollV&&_dg){
    if(_dragScrollEl) _dragScrollEl.scrollTop+=_dragScrollV;
    else window.scrollBy(0,_dragScrollV);
    _dragScrollRAF=requestAnimationFrame(_dragScrollTick);
  } else { _dragScrollRAF=null; }
}
function _onDragScroll(e){
  if(!_dg){ _dragScrollV=0; return; }
  const EDGE=60,MAX=18;
  const el=_findScrollable(document.elementFromPoint(e.clientX,e.clientY));
  let top,bottom;
  if(el){ const r=el.getBoundingClientRect(); top=r.top; bottom=r.bottom; }
  else { top=0; bottom=window.innerHeight; }
  _dragScrollEl=el;
  const y=e.clientY;
  if(y<top+EDGE) _dragScrollV=-Math.ceil(MAX*(top+EDGE-y)/EDGE);
  else if(y>bottom-EDGE) _dragScrollV=Math.ceil(MAX*(y-(bottom-EDGE))/EDGE);
  else _dragScrollV=0;
  if(_dragScrollV&&!_dragScrollRAF) _dragScrollTick();
}
function _stopDragScroll(){ _dragScrollV=0; if(_dragScrollRAF){cancelAnimationFrame(_dragScrollRAF);_dragScrollRAF=null;} }
document.addEventListener('dragover',_onDragScroll,true);
document.addEventListener('dragend',_stopDragScroll,true);
document.addEventListener('drop',_stopDragScroll,true);

// Touch long-press to skip (mobile)
document.addEventListener('touchstart',e=>{
  const c=e.target.closest('.chk-c:not(.future),.hz-chk-c:not(.future)');
  if(!c||!_parseSel(c.id)) return;
  clearTimeout(_lpTimer);_lpFired=false;
  _lpTimer=setTimeout(()=>{
    _lpFired=true;
    const p=_parseSel(c.id);
    if(!p) return;
    if(p.type==='fathom') doFathomSkipToggle(p.id,p.day);
    else doSkipToggle(p.id,p.day,c.dataset.color||'var(--accent)');
  },500);
},{passive:true});
document.addEventListener('touchmove',()=>{clearTimeout(_lpTimer);_lpTimer=null;},{passive:true});
document.addEventListener('touchend',()=>{clearTimeout(_lpTimer);_lpTimer=null;},{passive:true});

updateSyncBadge();
loadFromCloud().then(()=>{ repairJulySkips(); migrateCardsToGlobal(); migrateCardsToPeriods(); migrateClockToCard(); migrateCardsToOneEntry(); migrateCardCols(); migrateJournalNotebooks(); render(); });
