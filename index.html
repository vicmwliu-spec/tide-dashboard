// Returns a readable version of a color — darkens very light colors in light mode for text/dots
function _colorLum(hex){try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(r*299+g*587+b*114)/1000;}catch{return 128;}}
function _colorSat(hex){try{const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx===mn)return 0;const l=(mx+mn)/2;return(mx-mn)/(l>0.5?2-mx-mn:mx+mn);}catch{return 0;}}
function _isLightColor(hex){return!darkMode&&_colorLum(hex)>220&&_colorSat(hex)<0.25;}
function _isDarkColor(hex){return darkMode&&_colorLum(hex)<25&&_colorSat(hex)<0.25;}
function _readableColor(hex){if(_isLightColor(hex))return'rgba(0,0,0,0.5)';if(_isDarkColor(hex))return'rgba(255,255,255,0.6)';return hex;}
function _lighten(hex,amt){try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`#${Math.min(255,Math.round(r+(255-r)*amt)).toString(16).padStart(2,'0')}${Math.min(255,Math.round(g+(255-g)*amt)).toString(16).padStart(2,'0')}${Math.min(255,Math.round(b+(255-b)*amt)).toString(16).padStart(2,'0')}`;}catch{return hex;}}
function _darken(hex,amt){try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`#${Math.round(r*(1-amt)).toString(16).padStart(2,'0')}${Math.round(g*(1-amt)).toString(16).padStart(2,'0')}${Math.round(b*(1-amt)).toString(16).padStart(2,'0')}`;}catch{return hex;}}

async function _pushToCloud(force){
  _syncStatus='syncing';
  updateSyncBadge();
  try{
    // Guard against clobbering a newer write from another device/tab: if the
    // cloud row has moved on since we last synced, pull it in instead of
    // blindly overwriting it with our (possibly stale) in-memory D.
    // force=true bypasses this guard (used by one-time data repairs that must
    // land authoritatively and beat a stale device's revert).
    const {data:cur,error:selErr}=await _sb.from('tide_data').select('updated_at').eq('id','main').single();
    if(selErr && selErr.code!=='PGRST116') throw selErr;
    // "Has the row changed since I last saw it?" is string inequality, not time ordering.
    // updated_at is written from the *pushing* device's clock and _lastSyncedAt records that
    // same string, so comparing them with new Date(...)> was comparing two machines' wall
    // clocks. A phone running a few minutes fast made its row look permanently newer, this
    // device's push was refused forever, and every refresh restored the phone's copy. Since
    // _lastSyncedAt is always exactly the row value this device last saw — nowIso after a
    // push, data.updated_at after a pull — inequality answers the real question and cannot
    // be fooled by skew.
    if(!force && cur?.updated_at && _lastSyncedAt && cur.updated_at!==_lastSyncedAt){
      // Someone else wrote. What happens next depends on whether there is work here that has
      // not gone up yet: pulling used to be unconditional, and it threw away the edit being
      // made right now — you typed, the debounce fired, the pull replaced D and re-rendered,
      // and the character went back to what the other device had.
      // The device being typed on wins: fall through to the upsert below rather than
      // pulling. This can discard an edit made elsewhere between this device's last sync
      // and now; that is the accepted cost of not silently dropping what someone is
      // typing. The visible-again pull keeps that window small.
      if(!_hasUnpushed()){
        _syncStatus='conflict';
        updateSyncBadge();
        await loadFromCloud();
        render();
        return;
      }
    }
    const nowIso=new Date().toISOString();
    const {error}=await _sb.from('tide_data').upsert({id:'main',data:D,updated_at:nowIso});
    if(error) throw error;
    _setSynced(nowIso);
    _syncStatus='synced';
  }catch(e){
    console.warn('Sync failed:',e);
    _syncStatus='offline';
  }
  updateSyncBadge();
}

async function loadFromCloud(){
  try{
    const {data,error}=await _sb.from('tide_data').select('data,updated_at').eq('id','main').single();
    if(error) throw error;
    const cloudHasData=data?.data && Object.keys(data.data).length>0 && data.data.groups;
    // Every save writes localStorage at once but only schedules the cloud push 1500ms later,
    // so a reload inside that window used to land here with the cloud still holding the copy
    // from before the last edit — and adopting it wrote that older copy back over localStorage
    // too, losing the edit for good. Anything done in the last second and a half before a
    // refresh went that way; clicking "space" above a table and reloading to check is exactly
    // that shape, which is how this was found. So: if this device has written since its last
    // successful push, and the cloud row has not moved on since then, the local copy is the
    // newer one — keep it and push it rather than overwriting it. Requires a recorded push, so
    // a device that has never synced still takes the cloud copy as it always did.
    const unpushed=_hasUnpushed();
    // Inequality, not ordering — same reason as the guard in _pushToCloud: _lastSyncedAt is
    // the row value this device last saw, and asking whether it still matches cannot be
    // fooled by another device's clock running fast.
    const cloudMoved=!!(data?.updated_at&&_lastSyncedAt&&data.updated_at!==_lastSyncedAt);
    if(cloudHasData&&unpushed&&!cloudMoved){
      await _pushToCloud();
    } else if(cloudHasData){
      D=data.data;
      if(!D.aarTemplates) D.aarTemplates=[];
      localStorage.setItem(SK,JSON.stringify(D));
      _setSynced(data.updated_at||new Date().toISOString());
      _syncStatus='synced';
    } else {
      // Cloud is empty — upload our local data so other devices can get it
      await _pushToCloud();
    }
  }catch(e){
    console.warn('Cloud load failed, using local data:',e);
    _syncStatus='offline';
  }
  updateSyncBadge();
}

// Does this device hold work the cloud has not seen? Both stamps come from this device's own
// clock, so comparing them to each other is safe in a way that comparing either of them to
// another device's updated_at is not.
function _hasUnpushed(){
  const localAt=localStorage.getItem(SK_AT);
  return !!(localAt&&_lastSyncedAt&&localAt>_lastSyncedAt);
}

// A write that stays on this device until something else pushes it. The boot chain runs the
// migrations, and several of them write — migrateJournalNotebooks called save(), and
// _cardsDirty *is* save() — so merely opening the app scheduled a push of that device's whole
// D. A phone opened and put down republished its stale copy over the desktop's work without
// anyone editing anything. Migrations are idempotent and run per device, so none of them
// needs to reach the cloud on its own; the next genuine edit carries them.
// Deliberately does not stamp SK_AT. That stamp means "user work the cloud has not seen", and
// it is what wins a conflict below — so a migration claiming it would let a phone that was
// merely opened outrank the desktop someone is typing on, which is the bug this exists to
// stop. A migration is derived state: any device can recompute it, so no device gets priority.
function saveLocal(){
  localStorage.setItem(SK,JSON.stringify(D));
}

function save(){
  localStorage.setItem(SK,JSON.stringify(D));
  // Stamped every write, so a boot can tell local work the cloud has not seen from a device
  // that is simply behind. Written after D, so a crash between the two reads as "not saved"
  // rather than claiming a write that did not land.
  localStorage.setItem(SK_AT,new Date().toISOString());
  clearTimeout(_syncTimer);
  // Cleared as it fires, so _syncFlush below can tell a push that is still owed from one that
  // has already gone — a timeout id stays truthy long after the timer has run.
  _syncTimer=setTimeout(()=>{ _syncTimer=null; _pushToCloud(); },1500);
}
// A tab going away takes its pending push with it. Firing it early does not make the push
// synchronous — nothing can — but it shortens the window, and the boot guard above is what
// actually makes the edit safe if this never reaches the server.
function _syncFlush(){
  if(!_syncTimer) return;
  clearTimeout(_syncTimer); _syncTimer=null;
  _pushToCloud();
}
window.addEventListener('pagehide',_syncFlush);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ _syncFlush(); return; }
  // Coming back. loadFromCloud() otherwise runs exactly once, at boot — there is no storage
  // listener and no subscription — so a tab left open all day held a snapshot from whenever
  // it loaded, and every save from it pushed that whole stale document. Re-reading on the way
  // in is what keeps "the device being typed on wins" in _pushToCloud from being a licence to
  // clobber: by the time you type, this tab is current.
  // Never while this device owes a push, or the pull would overwrite the very work that has
  // not gone up yet — which is the failure this whole change is about.
  if(_syncTimer||_hasUnpushed()) return;
  loadFromCloud().then(render);
});

// One-time repair: the July 2026 recovery left every habit's skips corrupted
// (marked skipped on days 11-12, i.e. on/after their start date), which zeroed
// out the month's stats. Regenerate July's start-date skips from each habit's
// real startDate. Scoped to July only so other months' manual skips are kept.
function repairJulySkips(){
  if(D._skipRepair_2026_07) return;
  const mo=D.months['2026-07'];
  if(mo){
    mo.skips={};
    const days=dim(2026,6);
    D.groups.forEach(g=>g.habits.forEach(h=>{
      if(!h.startDate) return;
      const start=new Date(h.startDate+'T00:00:00');
      if(isNaN(start.getTime())) return;
      for(let d=1;d<=days;d++){
        if(new Date(2026,6,d)<start){ (mo.skips[h.id]||(mo.skips[h.id]={}))[d]=true; }
      }
    }));
  }
  D._skipRepair_2026_07=true;
  localStorage.setItem(SK,JSON.stringify(D));
  _pushToCloud(true); // force-push cleaned data so a stale device can't revert it
}

// One-time migration: all 3 top-row cards (Quote, Priority, Notes) are global
// (shared across every month) so their content carries over. Quote used to be
// per-month, and a prior migration briefly stashed the global Priority/Notes
// into the current month's object — recover each field into its global slot.
function migrateCardsToGlobal(){
  if(D._migCardsGlobal) return;
  const monthsDesc=Object.keys(D.months||{}).sort().reverse(); // most-recent month first
  function recover(field){
    if(D[field]) return D[field];                 // already global
    const cur=D.months[mk(CY,CM)];                 // where the prior migration stashed priority/notes
    if(cur&&cur[field]) return cur[field];
    for(const k of monthsDesc){ if(D.months[k]&&D.months[k][field]) return D.months[k][field]; } // most-recent non-empty
    return '';
  }
  D.priority=recover('priority');
  D.notes=recover('notes');
  D.quote=recover('quote'); // quote was per-month; seed global from current month, else most-recent non-empty
  D._migCardsGlobal=true;
  localStorage.setItem(SK,JSON.stringify(D));
}

// ─── Planner cards ───────────────────────────────────────────────
// The four top-row cards were four global strings; they became one configurable
// set of cards instead. Cards no longer reset on a schedule — what you write in
// one stays there — so every def is cadence:'none' and reads the '_' key. The
// cadence plumbing below is kept, unused, because the stored data is keyed by it
// and older per-period entries are still in there.
function defaultCardDefs(){
  return [
    {id:'intention',type:'text',label:'THIS MONTH / PERIOD',span:1,minH:0,cadence:'none'},
    {id:'priority', type:'text',label:'WEEKLY',             span:1,minH:0,cadence:'none'},
    {id:'quote',    type:'text',label:'THIS WEEK',          span:1,minH:0,cadence:'none'},
    {id:'notes',    type:'text',label:'TODAY',              span:1,minH:0,cadence:'none'},
    clockCardDef(),
  ];
}
// '2026-08' | '2026-08-W3' | '2026-08-09' | '_'. Week numbering comes from
// weekOfDay(), so a card's WK n always matches the number the grid shows.
function cardPeriodKey(cadence,d){
  const y=d.getFullYear(),m=d.getMonth();
  if(cadence==='none') return '_';
  if(cadence==='month') return mk(y,m);
  if(cadence==='week') return `${mk(y,m)}-W${weekOfDay(y,m,d.getDate())}`;
  return `${mk(y,m)}-${String(d.getDate()).padStart(2,'0')}`;
}
function cardDefs(){ return (D.cards&&D.cards.defs)||[] }
function cardDef(id){ return cardDefs().find(c=>c.id===id)||null }
// ─── Card columns ───────────────────────────────────────────────
// A card's column is stored, not inferred from its position in the list. Before,
// the list was flowed across four columns, so moving one card renumbered every
// card after it and the flow backfilled the hole by pulling a later card up and
// to the left. With an explicit grid-column-start, the list only decides vertical
// order within a column; nothing ever slides sideways to fill a gap.
const PGRID_COLS=4;
function cardSpan(def){ return Math.min(PGRID_COLS,Math.max(1,Number(def&&def.span)||1)) }
// Clamped so a card can never start where its span would run off the right edge.
function cardCol(def){
  const sp=cardSpan(def);
  const c=Math.round(Number(def&&def.col)||0);
  return Math.min(PGRID_COLS-sp+1,Math.max(1,c||1));
}
// Where each def sits today under plain left-to-right flow. Used once, to give
// existing cards the column they already appear in, so nothing moves on upgrade.
function flowedCols(defs){
  const out=[]; let cur=1;
  defs.forEach(d=>{
    const sp=cardSpan(d);
    if(cur+sp-1>PGRID_COLS) cur=1;
    out.push(cur);
    cur+=sp;
    if(cur>PGRID_COLS) cur=1;
  });
  return out;
}
function migrateCardCols(){
  const defs=cardDefs();
  if(!defs.length||defs.every(d=>d.col)) return;
  const cols=flowedCols(defs);
  defs.forEach((d,i)=>{ if(!d.col) d.col=cols[i] });
  saveLocal(); // boot migration: local only, never a push — see saveLocal
}
function cardHTML(id,d){
  const def=cardDef(id); if(!def) return '';
  const bag=(D.cards.data||{})[id];
  return (bag&&bag[cardPeriodKey(def.cadence,d||PD)])||'';
}
// One save path for every card, replacing saveIntention/savePriority/saveQuote/
// saveNotes. Empty deletes the key rather than storing '<br>', as saveAAREntry does.
function saveCard(id,html,d){
  const def=cardDef(id); if(!def) return;
  const k=cardPeriodKey(def.cadence,d||PD);
  const bag=D.cards.data[id]||(D.cards.data[id]={});
  // An empty card is empty however the editor happens to spell it. The block guard
  // keeps a paragraph in every container so there is always somewhere to type, so
  // "nothing written here" now arrives as <p><br></p> as often as as <br>.
  const v=/^(<br>|<p><br><\/p>|<div><br><\/div>)$/.test(html||'')?'':html;
  if(v) bag[k]=v; else delete bag[k];
  save();
}

// One-time migration: move each global card into the period it belongs to. The old
// globals are left in place, not deleted, so a rollback loses nothing.
function migrateCardsToPeriods(){
  if(D.cards&&D.cards.defs) return;
  const d=new Date();
  const data={};
  const put=(id,html)=>{ if(html) (data[id]||(data[id]={}))['_']=html };
  put('intention',D.intention);
  put('priority',D.priority);
  put('quote',D.quote);
  put('notes',D.notes);
  D.cards={defs:defaultCardDefs(),data};
  localStorage.setItem(SK,JSON.stringify(D));
}

// Cards used to reset every day/week/month, so existing content is keyed to the
// period it was written in and would be unreachable now that every card reads '_'.
// Promote each card's newest non-empty entry. The older entries are left in the
// data, not deleted — invisible, but nothing is thrown away.
function migrateCardsToOneEntry(){
  if(!D.cards||!D.cards.defs||D._migOneEntry) return;
  D._migOneEntry=1;
  D.cards.defs.forEach(def=>{
    def.cadence='none';
    const bag=(D.cards.data||{})[def.id];
    if(!bag||bag['_']) return;
    // Period keys sort chronologically as strings within a cadence, and a card
    // only ever had one cadence at a time, so the last key is the newest entry.
    const k=Object.keys(bag).filter(x=>bag[x]).sort().pop();
    if(k) bag['_']=bag[k];
  });
  localStorage.setItem(SK,JSON.stringify(D));
}

function clockCardDef(id){
  return {id:id||'clock',type:'clock',label:'TODAY’S SHAPE',span:1,minH:0,cadence:'none'};
}
// The clock used to sit outside the grid, so anyone with existing card defs has
// no card for it. Add one once, at the end, rather than letting it disappear.
function migrateClockToCard(){
  if(!D.cards||!D.cards.defs) return;
  if(D.cards.defs.some(c=>c.type==='clock')) return;
  if(D._migClockCard) return;
  D._migClockCard=1;
  D.cards.defs.push(clockCardDef());
  localStorage.setItem(SK,JSON.stringify(D));
}

// hex #RRGGBB -> rgba with alpha; passthrough if not a 6-digit hex.
function _rgbaFromColor(c,a){
  if(typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c)){
    const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  return c;
}
function chartConf(){
  const d=darkMode;
  const ov=D.chartColors||{};
  const overall=ov.overall||(d?'#EDEDEE':'#18181B');
  return {
    ref:    ov.ref    ||(d?'rgba(255,255,255,.10)':'#E4E4E0'),
    overall,
    fill:   _rgbaFromColor(overall,d?0.12:0.08), // shade always follows the Overall curve color
    grid:   d?'#232328':'#F3F3F0',
    ticks:  d?'#5C5C70':'#BBBBBB',
    legend: d?'#5C5C70':'#999999',
    tipBg:  d?'#1A1A1E':'#111111',
    tipBdr: d?'#2E2E33':'#333333',
    tipBdy: d?'#8E8EA0':'#AAAAAA',
    cumul:  ov.cumul  ||(d?'rgba(168,162,158,0.5)':'rgba(120,113,108,0.5)'),
  };
}

// Single calm accent for all % scores. Driven by the "Compounding" chart color
// (D.chartColors.sePath) so changing that recolors every score; falls back to a
// theme-aware teal when not customized. Returns a real hex (some callers slice it).
function gradeAccent(){ return (D.chartColors&&D.chartColors.sePath)||(darkMode?'#6BBDB0':'#4E9B8A'); }
function applyGradeAccent(){ document.documentElement.style.setProperty('--grade',gradeAccent()); }
function gradeColor(){ return gradeAccent(); }
// A habit's effective color: its own if set, else its group's (unless the group
// is the invisible "ungrouped" bucket), else the calm accent.
function habitColor(h,g){ return (h&&h.color) || (g&&!g._default?g.color:gradeAccent()); }

function chartFillGradient(ctx,chartArea){
  const color=gradeColor();
  const r=parseInt(color.slice(1,3),16),g=parseInt(color.slice(3,5),16),b=parseInt(color.slice(5,7),16);
  const grad=ctx.createLinearGradient(0,chartArea.top,0,chartArea.bottom);
  grad.addColorStop(0,`rgba(${r},${g},${b},.35)`);
  grad.addColorStop(1,`rgba(${r},${g},${b},.03)`);
  return grad;
}

function todayStats(){
  const t=new Date();
  const yr=t.getFullYear(),mo=t.getMonth(),day=t.getDate();
  const dow=t.getDay();
  const mkey=mk(yr,mo);
  const mdata=D.months[mkey];
  const todayGroups=groupsForDay(yr,mo,day);
  const h=todayGroups.flatMap(g=>g.habits.filter(hb=>{
    if(hb.archived) return false;
    if(hb.freq&&hb.freq.length<7&&!hb.freq.includes(dow)) return false;
    if(hb.startDate&&new Date(hb.startDate+'T00:00:00')>t) return false;
    return true;
  }).map(hb=>({...hb})));
  let done=0,total=0;
  h.forEach(hb=>{if(!(mdata?.skips?.[hb.id]?.[day])){total++;done+=_countFrac(mdata?.completions?.[hb.id]?.[day],hb.dailyTarget);}});
  const pct=total?Math.floor(done/total*100):0;
  const groups=todayGroups.filter(g=>!g._default).map(g=>{
    let gDone=0,gTotal=0;
    g.habits.filter(hb=>!hb.archived).forEach(hb=>{
      if(hb.freq&&hb.freq.length<7&&!hb.freq.includes(dow)) return;
      if(!(mdata?.skips?.[hb.id]?.[day])){gTotal++;gDone+=_countFrac(mdata?.completions?.[hb.id]?.[day],hb.dailyTarget);}
    });
    return {id:g.id,name:g.name,color:g.color,done:gDone,total:gTotal,pct:gTotal?Math.floor(gDone/gTotal*100):0};
  });
  return {done,total,pct,groups};
}

// ─────────────────────────────────────────
function mk(y,m){ return `${y}-${String(m+1).padStart(2,'0')}` }

function md(y,m){
  const k=mk(y,m);
  if(!D.months[k]) D.months[k]={quote:'',notes:'',completions:{},skips:{}};
  if(!D.months[k].skips) D.months[k].skips={};
  return D.months[k];
}

function dim(y,m){ return new Date(y,m+1,0).getDate() }
function fdow(y,m){ return new Date(y,m,1).getDay() }

// Which day a week starts on, and the three things everything else needs from it. Spelled out
// once here so no call site has to remember the arithmetic: getting one of them wrong would
// slide a grid out of step with the spans it is drawing.
function WS(){ const v=D.weekStart; return (typeof v==='number'&&v>=0&&v<=6)?v:1 }
function dowOff(dow){ return (dow-WS()+7)%7 }                       // position of a JS day in the week
function dowOrder(){ return [0,1,2,3,4,5,6].map(i=>(WS()+i)%7) }    // header/picker render order

// Returns [{week:N, start:d, end:d}, ...] for the current month
function getWeekSpans(y,m){
  const days=dim(y,m);
  const fd=dowOff(new Date(y,m,1).getDay()); // days of the first week that fall before the 1st
  const spans=[];
  let curWeek=0,wStart=1;
  for(let d=1;d<=days;d++){
    const wn=Math.ceil((d+fd)/7);
    if(wn!==curWeek){
      if(curWeek>0) spans.push({week:curWeek,start:wStart,end:d-1});
      curWeek=wn; wStart=d;
    }
  }
  spans.push({week:curWeek,start:wStart,end:days});
  return spans;
}

function allHabits(){ return D.groups.flatMap(g=>g.habits.map(h=>({...h,gid:g.id,gc:g.color,gn:g.name}))) }

function activeGroups(){
  const m=D.months[mk(CY,CM)];
  return (m&&m.snapshot)?m.snapshot.groups:D.groups;
}
function _snapPoints(snap){
  if(!snap) return [];
  if(snap.points) return snap.points;
  if(snap.groups) return [{through:Infinity,groups:snap.groups}];
  return [];
}
function _habitInAnySnapshot(mo,hid){
  if(!mo) return false;
  if(mo.snapshot?.groups?.some(sg=>sg.habits.some(sh=>sh.id===hid))) return true;
  if(mo.weekSnapshots){
    for(const snap of Object.values(mo.weekSnapshots)){
      for(const pt of _snapPoints(snap)){
        if(pt.groups.some(sg=>sg.habits.some(sh=>sh.id===hid))) return true;
      }
    }
  }
  return false;
}
function activeGroupsForWeek(y,m,weekIndex,day){
  const mo=D.months[mk(y,m)];
  const snap=mo&&mo.weekSnapshots&&mo.weekSnapshots[weekIndex];
  if(day===undefined){
    if(mo&&mo.weekArchived&&mo.weekArchived[weekIndex]&&snap){
      const points=_snapPoints(snap);
      if(points.length) return points[points.length-1].groups;
    }
    return (mo&&mo.snapshot)?mo.snapshot.groups:D.groups;
  }
  const points=_snapPoints(snap);
  const pt=points.find(p=>day<=p.through);
  if(pt) return pt.groups;
  return (mo&&mo.snapshot)?mo.snapshot.groups:D.groups;
}
function isWeekArchived(weekIndex){
  const m=D.months[mk(CY,CM)];
  return !!(m&&m.weekArchived&&m.weekArchived[weekIndex]);
}
function weekOfDay(y,m,day){
  if(m===undefined){ day=y; m=CM; y=CY; }
  const spans=getWeekSpans(y,m);
  const s=spans.find(sp=>day>=sp.start&&day<=sp.end);
  return s?s.week:1;
}
function groupsForDay(y,m,day){
  if(m===undefined){ day=y; m=CM; y=CY; }
  return activeGroupsForWeek(y,m,weekOfDay(y,m,day),day);
}
function activeFathomItems(){
  const m=D.months[mk(CY,CM)];
  return (m&&m.snapshot)?m.snapshot.fathomItems:(D.fathom?.items||[]).filter(i=>!i.archived);
}
function isMonthArchived(){
  const m=D.months[mk(CY,CM)];
  return !!(m&&m.archived);
}
function hasMonthSnapshot(){
  const m=D.months[mk(CY,CM)];
  return !!(m&&m.snapshot);
}

// ── Daily-target helpers ──
// Fractional credit for a raw count value against a target (0..1). Legacy booleans coerce.
function _countFrac(v,target){ const t=Math.max(1,target||1); return Math.min(Number(v)||0,t)/t; }
// The habit's daily target for a given day (resolves via the day's active groups). Default 1.
function habitTarget(hid,day){
  for(const g of groupsForDay(day)){const h=g.habits.find(h=>h.id===hid);if(h)return Math.max(1,h.dailyTarget||1);}
  return 1;
}
// Numeric completion count for the current month (legacy true->1).
function chkCount(hid,day){
  const mo=D.months[mk(CY,CM)];
  if(!mo||!mo.completions[hid]) return 0;
  return Number(mo.completions[hid][day])||0;
}
// Partial credit (0..1) for the current month.
function chkFrac(hid,day){ return _countFrac(chkCount(hid,day),habitTarget(hid,day)); }
function isChk(hid,day){
  // Fully complete = count reached the daily target.
  return chkCount(hid,day)>=habitTarget(hid,day)&&chkCount(hid,day)>0;
}
function isSkip(hid,day){
  const mo=D.months[mk(CY,CM)];
  return !!(mo?.skips?.[hid]?.[day]);
}
function isFreqExcluded(hid,day){
  for(const g of groupsForDay(day)){const h=g.habits.find(h=>h.id===hid);if(h){if(!h.freq||h.freq.length>=7)return false;return!h.freq.includes(new Date(CY,CM,day).getDay());}}
  return false;
}

function toggle(hid,day){
  let startMoved=false;
  for(const g of groupsForDay(day)){
    const h=g.habits.find(h=>h.id===hid);
    if(h&&h.startDate){
      const cellDate=new Date(CY,CM,day);
      if(cellDate<new Date(h.startDate+'T00:00:00')){
        const newStart=`${CY}-${String(CM+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        if(!confirm(`"${h.name}" starts on ${fmtDate(h.startDate)}. Move the start date back to ${fmtDate(newStart)} to log this day?`))return;
        h.startDate=newStart;
        applyHabitStartDateSkips(hid,h.startDate);
        startMoved=true;
      }
    }
    break;
  }
  const mo=md(CY,CM);
  if(!mo.completions[hid]) mo.completions[hid]={};
  if(!mo.skips[hid]) mo.skips[hid]={};
  mo.skips[hid][day]=false;
  // Increment toward the daily target; clicking at (or above) full resets to 0.
  const t=habitTarget(hid,day);
  const c=Number(mo.completions[hid][day])||0;
  mo.completions[hid][day]=c>=t?0:c+1;
  save();
  if(startMoved) render(); else partialUpdate(hid,day);
}
function skipToggle(hid,day){
  const mo=md(CY,CM);
  if(!mo.completions[hid]) mo.completions[hid]={};
  if(!mo.skips[hid]) mo.skips[hid]={};
  const skip=!!mo.skips[hid][day];
  mo.completions[hid][day]=0;
  mo.skips[hid][day]=!skip;
  save();
}

function dayProg(day){
  const cellDate=new Date(CY,CM,day);
  const dow=cellDate.getDay();
  const h=groupsForDay(day).flatMap(g=>g.habits.map(hb=>({...hb,gid:g.id}))).filter(hb=>{
    if(hb.archived) return false;
    if(hb.startDate&&new Date(hb.startDate+'T00:00:00')>cellDate) return false;
    if(hb.freq&&hb.freq.length<7&&!hb.freq.includes(dow)) return false;
    return true;
  });
  let done=0,total=0;
  h.forEach(hb=>{if(!isSkip(hb.id,day)){total++;done+=chkFrac(hb.id,day);}});
  return {done,total,pct:total?Math.floor(done/total*100):0};
}

function habitProg(hid){
  const days=dim(CY,CM);
  let isArch=false;
  for(const g of activeGroups()){const h=g.habits.find(h=>h.id===hid);if(h){isArch=!!h.archived;break;}}
  if(isArch) return {goal:days,actual:0,pct:0,last:0};
  const today=new Date();
  const isCur=today.getFullYear()===CY&&today.getMonth()===CM;
  const last=isCur?today.getDate():days;
  let done=0,possible=0;
  for(let d=1;d<=last;d++){if(isFreqExcluded(hid,d))continue;if(!isSkip(hid,d)){possible++;done+=chkFrac(hid,d);}}
  return {goal:days,actual:done,pct:possible?Math.round(done/possible*100):0,last:possible};
}

function monthStats(){
  const habits=activeGroups().flatMap(g=>g.habits.filter(hb=>!hb.archived));
  const days=dim(CY,CM);
  const today=new Date();
  const isCur=today.getFullYear()===CY&&today.getMonth()===CM;
  const td=isCur?today.getDate():days;
  const dLeft=isCur?days-td:0;
  let comp=0,poss=0;
  for(let d=1;d<=td;d++){const p=dayProg(d);comp+=p.done;poss+=p.total;}
  const rate=poss?Math.floor(comp/poss*100):0;
  const futPoss=habits.length*dLeft;
  const maxRate=(poss+futPoss)?Math.floor((comp+futPoss)/(poss+futPoss)*100):0;
  const monthGroups=activeGroups().filter(g=>!g._default).map(g=>{
    const hs=g.habits.filter(hb=>!hb.archived);
    let gd=0,gt=0;
    for(let d=1;d<=td;d++){
      const dow=new Date(CY,CM,d).getDay();
      const dayG=groupsForDay(d).find(dg=>dg.id===g.id);
      const dayHs=dayG?dayG.habits.filter(hb=>!hb.archived):[];
      dayHs.forEach(hb=>{if(hb.freq&&hb.freq.length<7&&!hb.freq.includes(dow))return;if(!isSkip(hb.id,d)){gt++;gd+=chkFrac(hb.id,d);}});
    }
    const gFutPoss=hs.length*dLeft;
    const maxRate=(gt+gFutPoss)?Math.floor((gd+gFutPoss)/(gt+gFutPoss)*100):0;
    return {...g,pct:gt?Math.floor(gd/gt*100):0,gt,gd,maxRate};
  });
  const isPast=CY<today.getFullYear()||(CY===today.getFullYear()&&CM<today.getMonth());
  const isFuture=!isCur&&!isPast;
  return {comp,poss,rate,dLeft,td,isCur,isPast,isFuture,maxRate,monthGroups,futPoss};
}

function allTimeTotal(){
  let t=0;
  Object.values(D.months).forEach(m=>{
    Object.values(m.completions).forEach(hc=>{
      Object.values(hc).forEach(v=>{if(v)t++});
    });
  });
  return t;
}


function cumulData(){
  const days=dim(CY,CM);
  const h=activeGroups().flatMap(g=>g.habits.map(hb=>({...hb,gid:g.id})));
  if(!h.length) return {overall:[],groups:[]};
  const overall=[];
  for(let d=1;d<=days;d++){
    const p=dayProg(d);
    overall.push({x:d,y:p.pct});
  }
  // Per-day % line for a single habit (100 when checked, else 0) — matches group/overall style.
  const habitLine=(hb,g)=>{
    const pts=[];
    for(let d=1;d<=days;d++) pts.push({x:d,y:isSkip(hb.id,d)?0:Math.round(chkFrac(hb.id,d)*100)});
    return {id:hb.id,name:hb.name,color:habitColor(hb,g),data:pts};
  };
  let groups=[];
  if(chartUnit==='habit'){
    // One line per habit across every group.
    activeGroups().forEach(g=>g.habits.filter(hb=>!hb.archived).forEach(hb=>groups.push(habitLine(hb,g))));
  } else {
    // One line per real group; ungrouped habits (the _default bucket) show as
    // individual habit lines so there's no phantom "Habits" group.
    activeGroups().forEach(g=>{
      if(g._default){
        g.habits.filter(hb=>!hb.archived).forEach(hb=>groups.push(habitLine(hb,g)));
        return;
      }
      const pts=[];
      for(let d=1;d<=days;d++){
        let done=0,tot=0;
        g.habits.forEach(hb=>{if(!isSkip(hb.id,d)){tot++;done+=chkFrac(hb.id,d);}});
        pts.push({x:d,y:tot?Math.floor(done/tot*100):0});
      }
      groups.push({id:g.id,name:g.name,color:g.color,data:pts});
    });
  }
  return {overall,groups};
}
function firstActiveDay(){
  const days=dim(CY,CM);
  for(let d=1;d<=days;d++){if(dayProg(d).total>0)return d;}
  return 1;
}
function cumulProgressData(){
  const days=dim(CY,CM);
  const now=new Date();
  const todayD=(CY===now.getFullYear()&&CM===now.getMonth()+1)?now.getDate():days;
  let monthTotal=0;
  for(let d=1;d<=days;d++) monthTotal+=dayProg(d).total;
  if(!monthTotal) return [];
  const pts=[];let done=0;
  for(let d=1;d<=days;d++){
    if(d<=todayD){const p=dayProg(d);done+=p.done;pts.push({x:d,y:Math.round(done/monthTotal*100)});}
  }
  return pts;
}

function render(){
  applyGradeAccent();
  const wasSel=_keepSel;
  _keepSel=false;
  if(!wasSel) _sel.clear();
  const app=document.getElementById('app');
  if(chartInst){chartInst.destroy();chartInst=null}
  if(hzChartInst){hzChartInst.destroy();hzChartInst=null}
  if(seChartInst){seChartInst.destroy();seChartInst=null}
  // Every action on the page rebuilds it from scratch, and for the instant the app
  // is empty the document is short enough that the browser clamps the scroll to 0 —
  // which is why adding a card or pressing anything in edit mode threw you back to
  // the top. Nothing was scrolling; the page was collapsing underneath you. Hold the
  // height across the teardown so it can't, and put the offset back either way.
  const _sy=_renderToTop?0:window.scrollY;
  _renderToTop=false;
  app.style.minHeight=app.offsetHeight+'px';
  app.innerHTML='';
  app.appendChild(mkHeader());
  if(view==='today'){
    // The card grid is the whole page. The clock is a card in it like anything
    // else, so there is nothing on this view that sits outside the grid.
    // No card bar: there is no edit mode to enter or leave here any more. Every card
    // carries its own ⋯, and the ⊕ in a card's bottom gap adds the next one.
    app.appendChild(mkCardGrid());
  } else if(view==='year'){
    const seCard=document.createElement('div');
    seCard.className='chart-card';
    seCard.style.marginBottom='14px';
    const _seoc=D.chartColors||{};
    const _seLegendItems=[
      {key:'seSuccess',color:_seoc.seSuccess||'#F59E0B',label:'Upwards',dashed:false},
      {key:'seFailure',color:_seoc.seFailure||'#DC2626',label:'Downwards',dashed:false},
      {key:'sePath',color:gradeAccent(),label:'Compounding',dashed:false},
    ].map(({key,color,label,dashed})=>`<div style="display:flex;flex-direction:column;align-items:center;gap:3px">
      ${key?`<span class="chart-color-dot" title="${label}" style="background:${color}" onclick="openChartColorPop(event,'${key}')"></span>`:`<div style="width:11px;height:11px"></div>`}
      <div style="width:20px;height:2px;${dashed?`background:repeating-linear-gradient(90deg,${color} 0,${color} 4px,transparent 4px,transparent 8px)`:`background:${color}`}"></div>
      <span style="font-size:10px;color:var(--text3);white-space:nowrap">${label}</span>
    </div>`).join('');
    seCard.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><span style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)">Alignment</span><div style="display:flex;gap:14px;align-items:flex-end">${_seLegendItems}</div></div><div class="chart-wrap" style="height:260px"><canvas id="se-all-time"></canvas></div>`;
    app.appendChild(seCard);
    setTimeout(()=>buildSlightEdgeChart('se-all-time'),0);
    app.appendChild(mkAnnual());
  } else {
    app.appendChild(mkStats());
    app.appendChild(mkGridHorizontal());
    if(editMode){const ap=mkArchivedPanel();if(ap)app.appendChild(ap);}
    app.appendChild(mkFathomGrid());
    app.appendChild(mkTide());
    _applyAllCommentMarkers();
  }
  document.addEventListener('click',closePop,{capture:true});
  if(wasSel){
    _sel.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('sel');else _sel.delete(id)});
  }
  _updSelBar();
  _updEditBar();
  // Release the pin now the real content is back, and restore the offset. The
  // second restore is for the case where a card's own 0ms fill changes the height.
  app.style.minHeight='';
  if(window.scrollY!==_sy) window.scrollTo(0,_sy);
  setTimeout(()=>{ if(window.scrollY!==_sy) window.scrollTo(0,_sy); },0);
  // Runs after the card editors have filled themselves in (they restore on a 0ms timer).
  setTimeout(rtFreezeTables,0);
  // Same reason: cards are only their real height once their content has landed.
  packCards();
  setTimeout(packCards,0);
  // Re-arm the observer over the cards this render just built.
  packObserve();
}
// How many of the grid's fine rows each card needs. Cards are laid out in 4px rows
// with no row gap, so a card spans ceil((its height + the 14px gap) / 4) of them and
// the gap comes out of the span. Shorten a card and it claims fewer rows, which is
// what lets the card below it rise into the space instead of leaving a hole.
const PGRID_ROW=4, PGRID_GAP=14;
// Cards that start at the same height belong to the same row — the grid's 4px rows have no
// notion of a row of cards, so the row is whatever the eye sees, which is a shared top edge.
// Given each card's measured top, natural height and opt-out flag, the height each one should
// be held open to; 0 means leave it as it is. A card that opts out neither stretches nor drags
// the row taller — that is the whole point of opting out: a tall journal beside three short
// text cards should not triple them.
// Tops are subpixel — a border, a scaled screen — so a row is a cluster within a pixel and a
// half of each other, not an exact match. Rounding each top to an integer instead would split
// two cards that sit half a pixel apart across a .5 boundary, which is a row that levels itself
// on some screens and not others.
const PGRID_ROWTOL=1.5;
function _rowTargets(items){
  const out=items.map(()=>0);
  const ix=items.map((it,i)=>i).filter(i=>!items[i].free)
    .sort((a,b)=>items[a].top-items[b].top);
  let row=[],top=null;
  const settle=()=>{
    if(!row.length) return;
    const h=Math.max(...row.map(i=>items[i].h));
    row.forEach(i=>out[i]=h);
  };
  ix.forEach(i=>{
    if(top===null||items[i].top-top<=PGRID_ROWTOL){ row.push(i); if(top===null) top=items[i].top; }
    else { settle(); row=[i]; top=items[i].top; }
  });
  settle();
  return out;
}
// Six is a guard against a layout that will not settle, not a tuning knob. Each pass evens the
// topmost row that was not even yet, and a row below only becomes a row once the row above it
// is level, so a grid of N rows converges in N passes and then reports no change.
const PGRID_PASSES=6;
let _packing=false;
function packCards(){
  // Our own writes reach the ResizeObserver. Without this the pass that levels a row would
  // schedule the pass that levels it again.
  if(_packing) return;
  _packing=true;
  // A pass measures by collapsing: it clears every card's span, and .pgrid is grid-auto-rows:4px,
  // so for that instant the whole grid is one 4px row per card and the document is a fraction of
  // its real height. Scrolled down, the browser clamps scrollY to the new maximum, and putting the
  // spans back does not bring you back — the page jumps. So hold the height across the collapse.
  // render() pins the same way for the same reason (:1837); it may still be holding its own pin
  // when the 0ms pack fires, which is why the previous value is put back rather than ''.
  const app=document.getElementById('app');
  const pin=app?app.style.minHeight:'';
  if(app) app.style.minHeight=app.offsetHeight+'px';
  try{
    for(let pass=0;pass<PGRID_PASSES;pass++) if(!_packPass()) break;
  } finally { _packing=false; if(app) app.style.minHeight=pin; }
}
// One pass: level every row, then set the spans from the levelled heights. Returns whether it
// changed any card's height, which is what tells packCards to go round again.
function _packPass(){
  let changed=false;
  document.querySelectorAll('.pgrid').forEach(g=>{
    const cards=[...g.children].filter(c=>c.classList&&
      (c.classList.contains('pcard')||c.classList.contains('paddcard')));
    // Clear the span and the previous stretch first, so what gets measured below is the
    // height the card wants rather than the height the last pass gave it.
    const was=new Map();
    cards.forEach(c=>{ c.style.gridRowEnd=''; was.set(c,c.style.minHeight);
      if(c.style.minHeight) c.style.minHeight=''; });
    // A lifted card is out of the flow, and anything unmeasurable (a hidden view, or a test
    // environment with no layout) is left alone rather than guessed at.
    const live=cards.filter(c=>!c.classList.contains('pdrag'))
      .map(c=>({el:c,r:c.getBoundingClientRect()})).filter(x=>x.r.height);
    // The add-card tile is not a card and has no def; it never stretches and never sets a row.
    const items=live.map(x=>({top:x.r.top,h:x.r.height,
      free:!x.el.classList.contains('pcard')||!!cardDef(x.el.dataset.cardid)?.freeH}));
    _rowTargets(items).forEach((t,i)=>{
      if(t>Math.round(items[i].h)) live[i].el.style.minHeight=t+'px';
    });
    // Changed means changed since before this pass cleared it. A pass that lands on the same
    // pixels it started with is the exit, and is also the pass that fires no resize.
    cards.forEach(c=>{ if(c.style.minHeight!==was.get(c)) changed=true; });
    live.forEach(x=>{
      const h=x.el.getBoundingClientRect().height;
      if(h) x.el.style.gridRowEnd='span '+Math.max(1,Math.ceil((h+PGRID_GAP)/PGRID_ROW));
    });
  });
  return changed;
}
// Through _packSoon, not packCards directly: a resize storm — dragging a window, a scrollbar
// appearing, or a phone's URL bar collapsing as you scroll — otherwise runs the whole six-pass
// routine once per event, synchronously. This is also the one caller that used to ignore
// _packHold, so an incidental resize could interrupt a width drag mid-gesture.
window.addEventListener('resize',_packSoon);
// A card can grow long after the render that placed it — you type a line, a table
// gains a row, a webfont lands late. .pgrid is align-items:start, so a card is sized
// by its own content and not stretched to its grid area: outgrow the span and the
// card spills past its box and is painted over by the one below instead of pushing
// it down. So the spans follow the real heights rather than the heights at render.
let _packRAF=0;
// A width drag previews by setting an inline pixel width, which the ResizeObserver sees as a
// resize like any other. Repacking from that is both pointless and harmful: the drag relays
// out once on release by design, and packCards measures each card against a grid it is
// halfway through resetting — so a span measured mid-drag can be wrong, and the next frame
// measures that card inside its newly wrong box, which is how a neighbour ends up shrunk and
// stays shrunk. Hold packing for the gesture; mouseup packs once, correctly.
let _packHold=0;
function _packSoon(){
  if(_packHold||_packRAF) return;
  _packRAF=requestAnimationFrame(()=>{ _packRAF=0; packCards(); });
}
const _packRO=typeof ResizeObserver!=='undefined'?new ResizeObserver(_packSoon):null;
// Cards are rebuilt on every render, so the old ones are dropped rather than piling
// up. Observing deliberately does not happen inside packCards: a fresh observe fires
// a callback immediately, and repacking from that would never settle.
function packObserve(){
  if(!_packRO) return;
  _packRO.disconnect();
  document.querySelectorAll('.pgrid > .pcard').forEach(c=>_packRO.observe(c));
}
