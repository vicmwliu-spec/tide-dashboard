<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="build" content="0821-b1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>TIDE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F7F5;
  --surface:#FFFFFF;
  --surface2:#F3F3F0;
  --border:#E4E4E0;
  --border2:#EBEBEA;
  --text1:#111111;
  --text2:#555555;
  --text3:#999999;
  --accent:#2563EB;
  /* "This is editable" is its own idea and gets its own colour. The accent blue
     read like a browser focus ring; this is the teal the app already uses for
     --grade, so edit mode borrows from the palette instead of adding to it. */
  --edit:#4E9B8A;
  --edit-soft:#EAF3F1;
  /* An open card only needs to read as open, so its outline is the resting border a
     few shades down rather than a colour. --edit itself stays: the Timeline and the
     drag placeholder are meant to carry the accent. */
  --edit-line:#9CA3AF;
  --today-bg:#EFF6FF;
  --today-border:#93C5FD;
  --green:#16A34A;
  --amber:#B45309;
  --red:#DC2626;
  --grade:#4E9B8A;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 8px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --r:10px;--r2:6px;
  --font:'Inter',system-ui,sans-serif;
}
html,body{font-family:var(--font);background:var(--bg);color:var(--text1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* Draw the text that is actually stored. Inter ships a default-on contextual alternate whose
   lookup maps x -> multiply.case when a digit precedes it, so "Zone 2 x2" rendered as "Zone 2 x2"
   with a multiplication sign while "Resistance x3" -- a letter before the space -- did not. The
   character in the DOM and in the database is a plain ASCII x in every case; only the glyph
   differed, which is why retyping it never helped and why searching the source for the character
   found nothing. calt cannot be disabled one rule at a time, so this turns the feature off.
   The cost, accepted deliberately: Inter's calt holds only this rule and the ASCII arrow
   ligatures, so a typed "->" now renders as "->" rather than an arrow. Time blocks are unaffected
   -- tbArrows() converts those to real arrow characters before they reach the font.
   Form controls are named explicitly because they do not inherit font properties, and the .quote-ta
   /.notes-ta/.priority-ta/.intention-ta textareas would otherwise keep the substitution.
   no-contextual rather than font-feature-settings:'calt' 0, which would sit in a different cascade
   layer from the font-variant-numeric:tabular-nums used throughout. scratchpad/calt.test.py shapes
   the real Inter with HarfBuzz and asserts both halves of this. */
html,body,input,textarea,button,select{font-variant-ligatures:no-contextual}
/* Extra room at the foot so the lowest card isn't flush against the window edge. */
#app{max-width:min(2000px,96vw);margin:0 auto;padding:20px 20px 64px}

/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.hdr-l{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.app-logo{font-size:26px;font-weight:800;letter-spacing:.14em;white-space:nowrap;color:var(--text1)}
.month-nav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:5px 12px;box-shadow:var(--shadow)}
.month-lbl{font-size:14px;font-weight:600;min-width:136px;text-align:center;color:var(--text1);cursor:pointer;border-radius:4px;padding:2px 6px;transition:background .12s}
.month-lbl:hover{background:var(--border)}
.nav-btn{background:none;border:none;cursor:pointer;color:var(--text2);padding:2px 7px;border-radius:4px;font-size:17px;line-height:1;transition:background .12s}
.nav-btn:hover{background:var(--border);color:var(--text1)}
.hdr-r{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:var(--r2);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text1);transition:all .12s;white-space:nowrap;font-family:var(--font)}
.btn:hover{background:var(--bg);border-color:var(--text3)}
.btn-pri{background:var(--text1);color:#fff;border-color:var(--text1)}
.btn-pri:hover{background:#333;border-color:#333}
.btn-on{background:#EEF2FF;color:#4338CA;border-color:#C7D2FE}
.btn-today{background:var(--today-bg);color:var(--accent);border-color:var(--today-border)}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:3px;gap:3px;box-shadow:var(--shadow)}
.seg button{font-family:var(--font);font-size:12px;font-weight:500;padding:5px 14px;border-radius:4px;border:none;background:none;color:var(--text2);cursor:pointer;transition:all .12s}
.seg button:hover{color:var(--text1)}
.seg button.on{background:var(--text1);color:var(--bg);font-weight:600}

/* ── Quote ── */
.quote-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 18px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px;box-shadow:var(--shadow)}
.quote-icon{color:var(--text3);font-size:22px;line-height:1;margin-top:1px;flex-shrink:0}
/* 13px and a whole 20px line, matching .rt-table and .rt-table td below: a table inside one
   of these cards sets its own type rather than inheriting, so the two have to be kept in step
   or prose and table rows read at different sizes in the same card. Whole pixels, not 1.6 of
   13px, for the device-pixel-rounding reason spelled out above .rt-table td. */
.quote-ta{flex:1;background:none;border:none;outline:none;font-family:var(--font);font-size:13px;font-weight:400;color:var(--text1);resize:none;line-height:20px;overflow:hidden}
.quote-ta::placeholder{color:var(--text3)}
/* ── Priority ── */
.priority-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 18px;margin-bottom:0;display:flex;align-items:flex-start;gap:10px;box-shadow:var(--shadow);min-height:80px}
.priority-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);white-space:nowrap;margin-top:3px;flex-shrink:0}
.priority-ta{flex:1;background:none;border:none;outline:none;font-family:var(--font);font-size:13px;font-weight:400;color:var(--text1);resize:none;line-height:20px;overflow:hidden;word-break:break-word;min-height:1.4em}
.priority-ta[contenteditable=true]:empty::before{content:attr(data-placeholder);color:var(--text3);pointer-events:none}
/* ── Notes ── */
.notes-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 18px;margin-bottom:0;display:flex;align-items:flex-start;gap:10px;box-shadow:var(--shadow);min-height:80px}
.notes-ta{flex:1;background:none;border:none;outline:none;font-family:var(--font);font-size:13px;font-weight:400;color:var(--text1);resize:none;line-height:20px;overflow:hidden;word-break:break-word;min-height:1.4em}
.notes-ta[contenteditable=true]:empty::before{content:attr(data-placeholder);color:var(--text3);pointer-events:none}
/* ── Intention ── */
.intention-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 18px;margin-bottom:0;display:flex;align-items:flex-start;gap:10px;box-shadow:var(--shadow);min-height:80px}
.intention-ta{flex:1;background:none;border:none;outline:none;font-family:var(--font);font-size:13px;font-weight:400;color:var(--text1);resize:none;line-height:20px;overflow:hidden;word-break:break-word;min-height:1.4em}
.intention-ta[contenteditable=true]:empty::before{content:attr(data-placeholder);color:var(--text3);pointer-events:none}
/* ── Top row ── */
.top-row{display:flex;gap:14px;margin-bottom:14px;align-items:stretch}
.top-row .intention-card,.top-row .quote-card,.top-row .priority-card,.top-row .notes-card{flex:1;width:0;margin-bottom:0}

/* ── Planner card grid ──
   There is no fixed section on the Today view — only cards. Width is a per-card
   property (span 1–4); height is a floor set by dragging the bottom edge. */
/* Ruled in fine rows rather than one row per band: a row of a CSS grid is as
   tall as its tallest card, so shortening a card used to leave a hole under it
   instead of letting the next card rise. Each card claims the rows it actually
   needs — see packCards — and the 14px gap is carried in the span. */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);column-gap:14px;row-gap:0;
  grid-auto-rows:4px;align-items:start;margin-bottom:14px;
  /* Room for the top insert point of the first card in each column. The vertical gap between
     cards comes from packCards' span arithmetic, not from row-gap, so above the topmost card
     there is no gap at all and its .pins-t would hang outside the grid. */
  padding:14px 14px 0;
  /* A card's grid-column-start is written inline by mkCard, so a start of 3 or 4
     inside a narrowed 2-column grid used to conjure implicit columns and crush the
     row. The narrow breakpoints below reset every start to auto, and this makes a
     stray one harmless rather than silently costing a column of width. */
  grid-auto-columns:0}
/* Scroll anchoring picks an element to hold still and shifts the scroll position to keep it there
   when things around it move. These are the worst possible candidates for that: a packing pass
   clears every card's gridRowEnd, and with grid-auto-rows:4px that drops each card to a single row
   before the span goes back on, so an anchored card appears to leap up the page and the browser
   "corrects" by a matching distance. Excluding them leaves anchoring working everywhere else. */
.pgrid,.pgrid>*{overflow-anchor:none}
/* Timeline card: the month as a calendar, weeks numbered as the rest of the app
   numbers them. Days are buttons — clicking one moves the page to that day.
   Every marked state reads --tlc, which the card sets from your chosen colour;
   the fallback is only there so the rules stand up on their own. */
.tlcard{display:flex;flex-direction:column;gap:8px;padding:4px 16px 14px}
.tl-grid{display:flex;flex-direction:column;gap:3px}
.tl-hd,.tl-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;flex:1}
.tl-hd{margin-left:26px}
.tl-h{font-size:9px;font-weight:600;letter-spacing:.06em;color:var(--text3);text-align:center}
/* On the Timeline the weekday strip is also the control for which day a week starts on, changed
   where its effect is visible. Only where it opts in: the Journal draws the same strip as a plain
   header, since the gear in the page header already carries the setting everywhere. Kept quiet
   until hovered so it reads as a header first and a button second. */
.tl-hd.tl-hd-btn{cursor:pointer;border-radius:5px;transition:background .12s}
.tl-hd.tl-hd-btn:hover{background:var(--hover,rgba(127,127,127,.10))}
.tl-hd.tl-hd-btn:hover .tl-h{color:var(--text2)}
#ws-pop{position:fixed;z-index:9990;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:10px 12px}
#ws-pop .ws-t{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text3);margin-bottom:7px;white-space:nowrap}
#ws-pop .ws-days{display:flex;gap:3px}
#ws-pop .ws-d{width:30px;height:26px;border:1px solid var(--border);background:transparent;
  border-radius:6px;font-family:var(--font);font-size:10px;font-weight:600;color:var(--text2);
  cursor:pointer;padding:0}
#ws-pop .ws-d:hover{border-color:var(--text3)}
#ws-pop .ws-d.on{background:var(--text1);color:var(--bg);border-color:var(--text1)}
.tl-wk{display:flex;align-items:center;gap:6px}
.tl-wn{width:20px;flex:none;font-size:9px;font-weight:600;color:var(--text3);text-align:right;font-variant-numeric:tabular-nums}
.tl-d{height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;
  border:1px solid var(--border);background:transparent;font-family:var(--font);font-size:11px;
  color:var(--text2);cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.tl-d:hover{border-color:var(--tlc,var(--edit));color:var(--text1)}
.tl-d.past{color:var(--text3);border-color:transparent;background:var(--surface2)}
.tl-d.sel{background:var(--tlc,var(--edit));border-color:var(--tlc,var(--edit));color:#fff;font-weight:600}
.tl-d.now{box-shadow:inset 0 0 0 2px var(--tlc,var(--edit));border-color:transparent;color:var(--text1);font-weight:600}
.tl-d.now.sel{color:#fff}
.tl-pad{border-color:transparent;background:transparent;cursor:default}
/* Month paging. The chevrons borrow the header's .nav-btn idiom — transparent until
   hovered — so the card reads as the same app rather than a widget with its own manners.
   The label between them is a button too: while the card is browsing away from the
   dashboard's month it turns the card's colour and takes you back. */
.tl-nav{display:flex;align-items:center;justify-content:center;gap:2px;margin-bottom:2px}
.tl-nb{background:none;border:none;cursor:pointer;color:var(--text3);padding:1px 7px;
  border-radius:4px;font-size:14px;line-height:1;font-family:var(--font);transition:background .12s,color .12s}
.tl-nb:hover{background:var(--border);color:var(--text1)}
.tl-ml{background:none;border:none;cursor:pointer;font-family:var(--font);font-size:11px;
  font-weight:600;color:var(--text2);padding:2px 8px;border-radius:4px;min-width:104px;
  text-align:center;font-variant-numeric:tabular-nums;transition:background .12s,color .12s}
.tl-ml:hover{background:var(--border);color:var(--text1)}
.tl-ml.off{color:var(--tlc,var(--edit))}
/* The space under the calendar, typable — the same pane the journal card puts under its own
   grid. A sibling of the grid and above .tl-foot, so the month's own line stays the card's
   baseline. flex:1 with a one-line floor: it takes whatever height the card has spare, and a
   card nobody types in grows by a single line rather than by a whole empty pane. */
.tl-note{flex:1;overflow-y:auto;min-height:34px;outline:none;font-size:13px;line-height:20px;
  color:var(--text1);border-top:1px solid var(--border);padding-top:8px}
/* margin-top on top of .tlcard's 8px gap. The footer is a different kind of thing from
   the grid above it, and at 8px it read as a seventh week. */
.tl-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:6px;
  font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
/* Where you are, on two lines: the position, then what is left of the month.
   Three roles, three classes. "Day" is the same 9px tracked eyebrow as the weekday
   heads and the quarter mark, so the footer speaks the card's own label language
   instead of being a bold sentence in the middle of it; the number takes --tlc, the
   exact colour filling the selected chip above, so the two read as one statement. */
.tl-pos{display:flex;flex-direction:column;gap:3px;line-height:1.3}
.tl-day{display:flex;align-items:baseline;gap:5px}
.tl-dl{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.tl-day b{font-size:15px;font-weight:600;line-height:1;color:var(--tlc,var(--edit));font-variant-numeric:tabular-nums}
.tl-dt{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
.tl-rem{font-size:10px;color:var(--text3)}
/* The quarter's three months, named. No bar, so nothing appears to lead anywhere. */
.tl-q{display:flex;align-items:center;gap:5px;white-space:nowrap}
.tl-q em{font-style:normal;font-weight:700;font-size:9px;letter-spacing:.08em;color:var(--text3);margin-right:2px}
.tl-q i{font-style:normal;color:var(--border)}
.tl-qm{color:var(--text3)}
.tl-qm.on{color:var(--tlc,var(--edit));font-weight:700}
/* ── Journal card ──
   A picker beside a page. The picker is the same month grid the timeline draws — it reuses
   every .tl-* rule above — plus two marks that only mean something here: a dot for a day
   with an entry, and a week number you can click. The grid is a fixed column and the page
   takes the rest, so widening the card widens the writing, not the calendar. */
.jrcard{display:flex;flex-direction:column;min-height:0}
.jr{display:flex;gap:14px;align-items:stretch;min-height:0;flex:1}
.jr-side{width:214px;flex:none;display:flex;flex-direction:column;gap:8px;min-width:0}
.jr-list{flex:1;overflow-y:auto;min-height:0}
.jr-grid{margin-top:2px}
/* The dot sits under the numeral rather than beside it: nothing moves when an entry
   appears, and a month of them reads as a row of marks instead of a row of decorations. */
.jr-grid .tl-d{position:relative}
.jr-grid .tl-d.has::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:3px;height:3px;border-radius:50%;background:var(--tlc,var(--edit))}
.jr-grid .tl-d.sel.has::after,.jr-grid .tl-d.now.has::after{background:currentColor}
.jr-wn{background:none;border:none;padding:0;cursor:pointer;font-family:var(--font)}
.jr-wn:hover{color:var(--text1)}
.jr-wn.has{color:var(--tlc,var(--edit));font-weight:700}
.jr-wn.sel{color:var(--tlc,var(--edit));text-decoration:underline;text-underline-offset:2px}
.jr-q{width:100%;box-sizing:border-box;padding:5px 9px;border:1px solid var(--border);
  border-radius:var(--r2);background:var(--surface);color:var(--text1);
  font-family:var(--font);font-size:11px}
.jr-q:focus{outline:none;border-color:var(--tlc,var(--edit))}
.jr-hit{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;background:none;
  border:none;border-left:2px solid transparent;padding:5px 8px;cursor:pointer;font-family:var(--font)}
.jr-hit:hover{background:var(--surface2)}
.jr-hit.on{background:var(--surface2);border-left-color:var(--tlc,var(--edit))}
.jr-hd{font-size:11px;font-weight:600;color:var(--text1);display:flex;gap:5px;align-items:baseline}
.jr-hd i{font-style:normal;font-size:9px;color:var(--text3);font-variant-numeric:tabular-nums}
.jr-hs{font-size:10.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-empty{font-size:11px;color:var(--text3);font-style:italic;padding:8px}
.jr-main{flex:1;min-width:0;display:flex;flex-direction:column;
  border-left:1px solid var(--border);padding-left:14px}
.jr-cap{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--text2);
  padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px}
.jr-pane{display:none;background:none;border:none;cursor:pointer;color:var(--text3);
  font-size:13px;padding:0 2px;line-height:1;font-family:var(--font)}
.jr-pane:hover{color:var(--text1)}
.jr-ed{flex:1;overflow-y:auto;min-height:0;outline:none;font-size:13px;line-height:20px;color:var(--text1)}
/* Commitments, under the calendar. A full rich-text host — the same lists, counts, tables and
   slash menu as anywhere else — so it is one editor used in a third place rather than a third
   editor to keep in step. It is a sibling of .jr-list and deliberately not inside it: paging
   the month replaces that element's innerHTML wholesale, which would take the caret with it.
   The sidebar has two modes and they want opposite things. Browsing, the grid is exactly as
   tall as its weeks and the commitments take whatever is left, so they sit directly under the
   calendar. Searching, the hits take the whole column — what you are looking through is the
   entries, not this. */
.jr-commit{flex:1;overflow-y:auto;min-height:64px;outline:none;font-size:13px;line-height:20px;
  color:var(--text1);border-top:1px solid var(--border);padding-top:8px}
.jr-side[data-mode="grid"] .jr-list{flex:none}
.jr-side[data-mode="search"] .jr-commit{display:none}
/* One column at a time when there is no room for two — a narrow card or a phone come to the
   same thing, so .jr-narrow is set from the card's measured width rather than from a media
   query and a span rule that would disagree with each other. The ▦ button is the only way
   across, so it appears exactly when it is needed. */
.jr-narrow .jr-pane{display:block}
.jr-narrow .jr{gap:0}
.jr-narrow .jr-main{border-left:none;padding-left:0}
.jr-narrow .jr[data-pane="grid"] .jr-main{display:none}
.jr-narrow .jr[data-pane="grid"] .jr-side{width:auto;flex:1}
.jr-narrow .jr[data-pane="entry"] .jr-side{display:none}
/* min-width:0 because a grid item's automatic minimum is its content: a card
   holding a table wider than its column would otherwise refuse to shrink and push
   the whole grid sideways, instead of letting the table scroll inside .rt-tw. */
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;min-width:0}
/* position:relative so the grab handle can hang in the left padding. In flow the handle
   plus its gap pushed the title to ~32px while the body starts at 16px — a title indented
   past the content it labels, and at rest the handle is transparent, so the gap read as
   nothing but crooked whitespace. Out of flow, the title lines up with the body and the
   handle still appears where it always did. */
.pcard-hd{display:flex;align-items:baseline;gap:8px;padding:11px 16px 3px;flex-wrap:wrap;position:relative}
/* No text-transform: a title reads exactly as it was typed, upper or lower case.
   Labels stored before this (TODAY, THIS WEEK) keep their capitals because that is
   how they are stored — retyping one is all it takes. */
.pcard-lbl{font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--text3)}
/* The title is editable in place, but must not look like a field until you are in
   it — at rest it is indistinguishable from the old static label. The transparent
   border reserves the space the focus ring takes, so nothing shifts on click. */
.pcard-lbled{cursor:text;outline:none;border:1px solid transparent;border-radius:4px;margin:-2px -4px;padding:1px 3px;min-width:1ch;white-space:pre-wrap}
.pcard:hover .pcard-lbled{border-color:var(--border2)}
.pcard-lbled:focus{border-color:var(--accent);background:var(--surface2);color:var(--text2);cursor:text}
/* A blank title is a real choice, so it shows nothing at rest. It still has to be
   findable, so hovering the card puts a faint prompt in the space it would occupy. */
.pcard-lbled:empty{min-width:44px;display:inline-block;min-height:12px}
.pcard:hover .pcard-lbled:empty::before{content:'+ title';opacity:.5;font-size:9px;letter-spacing:.05em}
.pcard-lbled:empty:focus::before{content:none}
.pcard-bd{padding:8px 16px 14px;min-height:80px;flex:1}
/* A block at the very top of a card sits at exactly the body's top padding, so
   a table inserted first lines up identically on every card. */
.pcard-bd>*:first-child,#aar-editor>*:first-child,.jr-ed>*:first-child,.jr-commit>*:first-child,.tl-note>*:first-child{margin-top:0}
.pcard-bd>*:last-child,#aar-editor>*:last-child,.jr-ed>*:last-child,.jr-commit>*:last-child,.tl-note>*:last-child{margin-bottom:0}
.pcard-lnk{background:none;border:none;font-family:var(--font);font-size:11px;color:var(--text3);cursor:pointer;padding:2px 5px;border-radius:4px}
.pcard-lnk:hover{color:var(--accent);background:var(--surface2)}
.pcard-lnk.on{color:var(--accent);background:var(--today-bg)}
/* Still used by the lever chooser inside a habits card. Card deletion moved to the ⋯
   menu: sitting next to the title, this read as "delete the title". */
.pcard-x{background:none;border:none;color:var(--text3);font-size:17px;line-height:1;cursor:pointer;padding:0 4px;border-radius:4px;font-family:var(--font);flex-shrink:0}
.pcard-x:hover{background:var(--border);color:var(--red)}
/* Clock card: dial + today's schedule. */
.tb-clockbd{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
/* The dial is the card, so it wins the row: it grows to 300px (larger than the
   Tracker's 280) and the schedule wraps underneath rather than squeezing it. */
.tb-clockbd>.tb-clock-host{flex:1 1 260px;max-width:300px}
.tb-sched{flex:1 1 240px;min-width:0;font-size:11px;color:var(--text2)}
.tb-sched:empty{display:none}
.tb-row{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:5px;cursor:pointer}
.tb-row:hover{background:var(--surface2)}
.tb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tb-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The in-place rename input, sized to sit inside the row without moving it. */
.tb-nmin{width:100%;box-sizing:border-box;font:inherit;color:var(--text1);
  background:var(--surface);border:1px solid var(--edit);border-radius:4px;padding:0 3px;outline:none}
/* Times and durations are columns of digits, so they get tabular figures and a
   fixed width — otherwise every row starts in a slightly different place. */
.tb-rg{font-variant-numeric:tabular-nums;color:var(--text3);flex-shrink:0}
.tb-du{font-variant-numeric:tabular-nums;color:var(--text3);flex-shrink:0;width:44px;text-align:right}
.tb-row.tb-now{background:var(--today-bg)}
.tb-row.tb-now .tb-nm{color:var(--text1);font-weight:600}
.tb-tot{display:flex;justify-content:space-between;gap:7px;margin-top:5px;padding:5px 5px 0;border-top:1px solid var(--border2);font-size:10px;color:var(--text3);font-variant-numeric:tabular-nums}
.tb-none{padding:4px 5px;color:var(--text3);font-size:11px}
/* The whole header is the drag handle, in both modes. touch-action:none so a
   touch drag reorders instead of scrolling the page. */
.pcard-grab{cursor:grab;touch-action:none}
.pcard.pdrag .pcard-grab{cursor:grabbing}
.pgrab{color:transparent;font-size:13px;letter-spacing:-1px;user-select:none;flex-shrink:0;transition:color .1s;
  position:absolute;left:6px;top:9px}
.pcard:hover .pgrab{color:var(--border)}
.pcard-grab:hover .pgrab{color:var(--text3)}
/* Lifted card follows the pointer; the placeholder holds its slot in the grid. */
.pcard.pdrag{position:fixed;top:0;left:0;z-index:60;pointer-events:none;box-shadow:0 12px 28px rgba(0,0,0,.18);opacity:.95}
.pcard-ph{border:2px dashed var(--edit);border-radius:var(--r);background:var(--edit-soft);min-height:60px}
/* Resize grip — min-height is a floor, never a clip, so nothing written is hidden. */
.pgrip{position:absolute;left:0;right:0;bottom:-3px;height:9px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;z-index:2}
.pgrip::after{content:'';width:40px;height:3px;border-radius:3px;background:var(--border)}
.pgrip:hover::after,.pcard.rz .pgrip::after{background:var(--edit-line)}
.pgrip-x{position:absolute;top:0;bottom:0;right:-3px;width:9px;cursor:ew-resize;display:flex;align-items:center;justify-content:center;z-index:2}
.pgrip-x::after{content:'';height:40px;width:3px;border-radius:3px;background:var(--border)}
.pgrip-x:hover::after,.pcard.rzx .pgrip-x::after{background:var(--edit-line)}
/* Outside edit mode the grips are there but quiet: they fade in when you hover
   the card, and stay lit while you are actually dragging one, since the pointer
   wanders off the card during a resize. */
.pcard .pgrip-q{opacity:0;transition:opacity .12s}
.pcard:hover .pgrip-q,.pcard.rz .pgrip,.pcard.rzx .pgrip-x{opacity:1}
.pcard.rz,.pcard.rzx{user-select:none}
/* Lifted while it is being widened: the preview overhangs its grid area rather than
   pushing anything, so it has to paint over the card it is reaching across. */
.pcard.rzx{outline:1px solid var(--edit-line);outline-offset:-1px;z-index:5}
/* ⋯ carries everything a card can have done to it. Hidden until you hover the card — the
   same rule the resize grips use — so a card at rest is a title and its content, nothing
   else. It stays lit while its own menu is open, or it would vanish under the pointer. */
.pcard-more{margin-left:auto;background:none;border:none;color:var(--text3);font-size:15px;line-height:1;
  cursor:pointer;padding:1px 5px;border-radius:4px;font-family:var(--font);flex-shrink:0;
  opacity:0;transition:opacity .12s,background .12s,color .12s}
.pcard:hover .pcard-more,.pcard-more.on,.pcard-more:focus-visible{opacity:1}
.pcard-more:hover,.pcard-more.on{background:var(--surface2);color:var(--text1)}
/* Anchored to the header, which is position:relative for the grab handle already. */
.pcard-menu{position:absolute;top:100%;right:6px;z-index:40;min-width:158px;
  border:1px solid var(--border);border-radius:var(--r);background:var(--surface);
  box-shadow:var(--shadow-md);padding:5px;display:flex;flex-direction:column;gap:1px}
.pm-i{font-size:12px;padding:6px 9px;display:flex;align-items:center;gap:7px}
.pm-sep{height:1px;background:var(--border);margin:4px 2px}
.pm-del{color:var(--red)}
.pm-del:hover{background:var(--red);color:#fff}
/* Add a card here: an insert point sits in the 14px gap around each card, so a new card
   lands in the column you pointed at and next to the card you pointed at —
   rather than always at the end of the page. Nothing until you reach for it.
   It is not a grid row of its own: the grid packs cards into 4px rows by explicit column,
   and a full-width row between two of them would cut every column in half.

   One sits on each side, in the 14px gap the grid leaves. Deliberately NOT the grey circled
   + the tables use for "add row/column": that is a button you press, this is a place a card
   lands, and the two were indistinguishable when they shared a glyph. So at rest it is a
   blue hairline with rounded caps — an insertion mark, not a control — and only under the
   pointer does it thicken and grow a small capsule with a + in it. */
.pins{position:absolute;z-index:6;display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:0;transition:opacity .12s}
.pcard:hover .pins,.pins:hover,.pins.on{opacity:1}
.pins-t{left:0;right:0;top:-14px;height:14px}
.pins-b{left:0;right:0;bottom:-14px;height:14px}
.pins-l{top:0;bottom:0;left:-14px;width:14px;flex-direction:column}
.pins-r{top:0;bottom:0;right:-14px;width:14px;flex-direction:column}
/* The rule itself. Horizontal points draw it across, vertical ones down. */
.pins::before{content:'';position:absolute;background:#3B82F6;border-radius:2px;opacity:.35;
  transition:opacity .12s,height .12s,width .12s}
.pins-t::before,.pins-b::before{left:3px;right:3px;height:1px}
.pins-l::before,.pins-r::before{top:3px;bottom:3px;width:1px}
.pins:hover::before,.pins.on::before{opacity:1}
.pins-t:hover::before,.pins-t.on::before,.pins-b:hover::before,.pins-b.on::before{height:2px}
.pins-l:hover::before,.pins-l.on::before,.pins-r:hover::before,.pins-r.on::before{width:2px}

/* Everything above that reveals itself on hover is opacity:0, not pointer-events:none — which is
   fine with a mouse, because the pointer that can reach it has already revealed it. A finger never
   does. On a touchscreen the .pins are invisible but fully live 14px bands hanging outside all four
   edges of every card, and .pins-t/.pins-b land exactly in the gap between two stacked cards, which
   is where you put your finger to scroll a one-column layout. Tapping one opens an insert point or
   adds a card, which is what made the phone feel like it moved things at random.

   Gated on the input device rather than a width: at a width, these would break in a narrow desktop
   window and stay broken on a tablet. */
@media (hover:none) and (pointer:coarse){
  .pins{pointer-events:none}
  /* Both grips are pixel work, and they are wired onmousedown, so on touch they only fire through
     the synthesized compatibility event — present enough to steal a tap, too erratic to resize
     with. Width-resize also has nothing to say here: the grid is a single fixed column. */
  .pgrip,.pgrip-x{display:none}
  /* The one piece of hidden chrome that has to become reachable instead: ⋯ is the only route to
     rename, convert, free height and delete, so hiding it on touch hides the card's whole menu. */
  .pcard-more{opacity:1}
  /* Vertical belongs to the browser from the first frame — see _cardGrabStart, where a touch now
     has to be held before it becomes a drag. pan-y rather than none is what makes scrolling off a
     card header correct even if the JS below it is wrong. */
  .pcard-grab{touch-action:pan-y}
  /* The pick-up needs to be visible on a screen with no cursor to change shape. Shadow only —
     _cardDragMoveTo owns transform, so a scale here would be overwritten on the next move. */
  .pcard.pdrag{box-shadow:0 14px 32px rgba(0,0,0,.28)}
}
/* The capsule. Zero-sized until wanted, so the resting state stays a bare line. */
.pins i{position:relative;display:flex;align-items:center;justify-content:center;
  width:0;height:0;overflow:hidden;border-radius:7px;background:#3B82F6;color:#fff;
  font-size:11px;line-height:1;font-style:normal;transition:width .12s,height .12s}
.pins i::before{content:'+'}
.pins:hover i,.pins.on i{width:18px;height:14px}
.pins-l:hover i,.pins-l.on i,.pins-r:hover i,.pins-r.on i{width:14px;height:18px}
.pins-menu{position:absolute;z-index:40;width:236px;cursor:default;text-align:left}
.pins-t .pins-menu,.pins-b .pins-menu{top:15px;left:50%;transform:translateX(-50%)}
.pins-l .pins-menu{top:50%;left:15px;transform:translateY(-50%)}
.pins-r .pins-menu{top:50%;right:15px;transform:translateY(-50%)}
.paddcard{border:1px dashed var(--border);border-radius:var(--r);background:none;color:var(--text3);font-family:var(--font);font-size:12px;cursor:pointer;padding:14px 10px;display:flex;align-items:center;justify-content:center;gap:6px}
.paddcard:hover{border-color:var(--edit-line);color:var(--edit-line)}
/* The add picker: one button, and the choice explained where you make it rather
   than guessed from three near-identical labels. */
.padd-menu{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-md);padding:5px;display:flex;flex-direction:column;gap:2px}
.padd-item{display:block;width:100%;text-align:left;background:none;border:none;font-family:var(--font);cursor:pointer;padding:8px 9px;border-radius:var(--r2);color:var(--text1)}
.padd-item:hover{background:var(--surface2)}
.padd-item b{display:block;font-size:12px;font-weight:600}
.padd-item span{display:block;font-size:10.5px;color:var(--text3);margin-top:2px;line-height:1.4}
.padd-note{padding:8px 9px;font-size:10.5px;color:var(--text3);line-height:1.4}
/* Templates ▸ in a journal card's ⋯ menu. Below .padd-item on purpose: that rule sets
   display:block at the same specificity, so anything relying on flex has to come after it.
   The submenu hangs off the LEFT edge — the ⋯ menu is already pinned to the card's right, so
   there is no room on that side — and overlaps its parent by a pixel, or the pointer falls
   through the gap on the way in and the menu shuts under it. :focus-within opens it from the
   keyboard, which hover alone cannot. */
.pm-has-sub{display:flex;align-items:center;justify-content:space-between;position:relative;cursor:default}
.pm-arw{color:var(--text3);font-size:10px}
.pm-sub{display:none;position:absolute;right:calc(100% - 1px);top:-5px;z-index:41;min-width:216px;
  border:1px solid var(--border);border-radius:var(--r);background:var(--surface);
  box-shadow:var(--shadow-md);padding:5px;flex-direction:column;gap:1px}
.pm-has-sub:hover .pm-sub,.pm-has-sub:focus-within .pm-sub{display:flex}
.pm-sub-row{display:flex;align-items:center;gap:1px;border-radius:var(--r2)}
.pm-sub-row:hover{background:var(--surface2)}
.pm-sub-load{flex:1;min-width:0;text-align:left;background:none;border:none;cursor:pointer;
  font-family:var(--font);font-size:12px;color:var(--text1);padding:6px 4px 6px 9px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-sub-b{background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;
  font-family:var(--font);line-height:1;padding:5px;border-radius:4px;flex-shrink:0}
.pm-sub-b:hover:not(:disabled){background:var(--border);color:var(--text1)}
.pm-sub-b:disabled{opacity:.28;cursor:default}
.pm-sub-x:hover:not(:disabled){background:var(--red);color:#fff}
.pm-sub-empty{font-size:11.5px;color:var(--text3);font-style:italic;padding:6px 9px;line-height:1.45}
/* The one setting a journal card wears in the open, beside the month arrows. */
.jr-dot{margin-right:4px}
/* Habits card — pills only. No streak, no count, no grade. */
.hpills{display:flex;flex-wrap:wrap;gap:7px}
.hpill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:5px 13px 5px 10px;font-size:12.5px;color:var(--text2);cursor:pointer;font-family:var(--font);transition:all .12s}
.hpill:hover{border-color:var(--text3)}
.hpill i{width:8px;height:8px;border-radius:50%;flex-shrink:0;opacity:.45;font-style:normal}
.hpill.on{background:var(--surface2);color:var(--text3);text-decoration:line-through}
.hpill.on i{opacity:1}
.hlist{display:flex;flex-direction:column;gap:5px}
.hlist-row{display:flex;align-items:center;gap:8px}
.hlist-row i{width:8px;height:8px;border-radius:50%;flex-shrink:0;font-style:normal}
.hlist-row input.nm{flex:1;min-width:0;font-family:var(--font);font-size:13px;color:var(--text1);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:4px 8px;outline:none}
.hlist-row input.nm:focus{border-color:var(--accent)}
.hlist-eye{background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;padding:2px 5px;border-radius:4px;font-family:var(--font);flex-shrink:0}
.hlist-eye.on{color:var(--accent)}
.hlist-eye:hover{background:var(--border)}
/* Fewer columns as the window narrows, so a card never gets too thin to read —
   4 above 1500px, then 3, then 2, then 1. Every rule below writes the whole
   grid-column shorthand, which is what resets the start mkCard set inline; a rule
   that only overrode the span left the start behind, and the card was placed in an
   implicit column past the edge of the grid. Nothing here touches the stored col or
   span, so widening the window restores the layout exactly as it was. */
@media (max-width:1500px){
  .pgrid{grid-template-columns:repeat(3,1fr)}
  .pcard{grid-column:auto / span 1 !important}
  .pcard[data-span="2"]{grid-column:auto / span 2 !important}
  .pcard[data-span="3"],.pcard[data-span="4"]{grid-column:auto / span 3 !important}
}
@media (max-width:1180px){
  .pgrid{grid-template-columns:repeat(2,1fr)}
  .pcard{grid-column:auto / span 1 !important}
  .pcard[data-span="2"],.pcard[data-span="3"],.pcard[data-span="4"]{grid-column:auto / span 2 !important}
}
/* 768px, matching the mobile stylesheet below — at 680 the band from 680 to 768 got two card
   columns wearing phone-sized chrome. column-gap, never the gap shorthand: gap would set row-gap
   too, and row-gap is deliberately 0 because the vertical gap is carried in packCards' spans.
   Writing gap:8px here put 8px on top of the 14px already in the span, which is why cards sat
   22px apart on a phone and 14px everywhere else. */
@media (max-width:768px){
  .pgrid{grid-template-columns:1fr;column-gap:8px}
  .pcard,.pcard[data-span="2"],.pcard[data-span="3"],.pcard[data-span="4"]{grid-column:auto / span 1 !important}
}
.top-left-col{width:35%;flex-shrink:0;display:flex;flex-direction:column;gap:10px}

/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.stat-lbl{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.stat-val{font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1}
.stat-sub{font-size:11px;color:var(--text3);margin-top:3px}

/* ── Chart ── */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-title{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
.chart-wrap{position:relative;height:300px;overflow:hidden}

/* ── Grid ── */
.grid-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.grid-bar{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--border);gap:10px}
.grid-bar-l{font-size:12px;font-weight:600;color:var(--text2)}
.grid-scroll{overflow-x:auto}
.grid-scroll::-webkit-scrollbar{height:5px}
.grid-scroll::-webkit-scrollbar-track{background:transparent}
.grid-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.tbl{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
.tbl th,.tbl td{border-bottom:1px solid var(--border2);border-right:1px solid var(--border2)}
.tbl th:last-child,.tbl td:last-child{border-right:none}
.week-tbl{margin-bottom:4px}
.week-bar-r{position:sticky;top:0;z-index:5}

/* Sticky */
.sl{position:sticky;left:0;z-index:2;background:var(--surface)}
.sr{position:sticky;z-index:2;background:var(--surface)}
.sr-1{right:0}
.sr-2{right:56px}
.st{position:sticky;top:0;z-index:3;background:var(--surface)}
.sl.st{z-index:4}
.sr.st{z-index:4}

/* Group row */
.grp-row th{height:30px;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border-bottom:2px solid var(--border)}
.grp-th{text-align:center;padding:0 8px;border-left:2px solid var(--border);border-right:2px solid var(--border) !important}
.grp-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700}
#tb-name::placeholder{color:var(--text3);opacity:.55}
.grp-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;outline:1.5px solid transparent}
.grp-dot.lum-light{outline-color:rgba(0,0,0,0.18)}
.grp-dot.lum-dark{outline-color:rgba(255,255,255,0.25)}
.grp-name-in{background:none;border:none;outline:none;font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;cursor:default;min-width:50px;max-width:100px;text-align:center}

/* Habit name row */
.hbt-row th{padding:7px 8px;font-size:11px;font-weight:500;color:var(--text2);white-space:nowrap;border-bottom:2px solid var(--border);text-align:center;min-width:72px}
.hbt-row .day-hdr{text-align:left;padding-left:14px;min-width:76px;border-right:2px solid var(--border) !important}
.hbt-row .sum-hdr{min-width:56px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.hbt-row .sum-hdr.first-sum{border-left:2px solid var(--border)}
.hbt-in{background:none;border:none;outline:none;font-family:var(--font);font-size:11px;font-weight:500;color:var(--text2);text-align:center;cursor:default;width:100%;padding:0}
.wk-target-in{width:34px;font-family:var(--font);font-size:11px;color:var(--text2);background:var(--bg2,transparent);border:1px solid var(--border2);border-radius:4px;padding:1px 3px;text-align:center}
.wk-target-badge{display:inline-block;margin-left:6px;font-size:9px;font-weight:600;color:var(--text3);background:var(--border);border-radius:8px;padding:1px 6px;vertical-align:middle}

/* Day rows */
.day-r{transition:background .08s}
.day-r:hover{background:var(--surface2)}
.day-r:hover .sl,.day-r:hover .sr{background:var(--surface2)}
.today-r{background:var(--today-bg)}
.today-r .sl,.today-r .sr{background:var(--today-bg)}
.day-c{padding:5px 14px;border-right:2px solid var(--border) !important;white-space:nowrap}
.day-num{font-size:12px;font-weight:600;line-height:1.2}
.day-dow{font-size:10px;color:var(--text3);font-weight:500}
.today-r .day-num{color:var(--accent)}
.today-badge{display:inline-block;background:var(--accent);color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;letter-spacing:.05em;vertical-align:middle;margin-left:4px;text-transform:uppercase}

/* Check cells */
.chk-c{text-align:center;padding:3px 5px;cursor:pointer;user-select:none}
.chk-c:hover{background:var(--border2)}
.chk-c.future{opacity:.35;cursor:default;pointer-events:none}

#aar-editor ul:not(.rt-todo)>li[data-st],.quote-ta ul:not(.rt-todo)>li[data-st],.priority-ta ul:not(.rt-todo)>li[data-st],.notes-ta ul:not(.rt-todo)>li[data-st],.intention-ta ul:not(.rt-todo)>li[data-st],.cv-bd ul:not(.rt-todo)>li[data-st],.jr-ed ul:not(.rt-todo)>li[data-st],.jr-commit ul:not(.rt-todo)>li[data-st],.tl-note ul:not(.rt-todo)>li[data-st]{list-style:none;position:relative}
#aar-editor ul:not(.rt-todo)>li[data-st]::before,.quote-ta ul:not(.rt-todo)>li[data-st]::before,.priority-ta ul:not(.rt-todo)>li[data-st]::before,.notes-ta ul:not(.rt-todo)>li[data-st]::before,.intention-ta ul:not(.rt-todo)>li[data-st]::before,.cv-bd ul:not(.rt-todo)>li[data-st]::before,.jr-ed ul:not(.rt-todo)>li[data-st]::before,.jr-commit ul:not(.rt-todo)>li[data-st]::before,.tl-note ul:not(.rt-todo)>li[data-st]::before{

#aar-editor ul>li[data-st="doing"]::before,.quote-ta ul>li[data-st="doing"]::before,.priority-ta ul>li[data-st="doing"]::before,.notes-ta ul>li[data-st="doing"]::before,.intention-ta ul>li[data-st="doing"]::before,.cv-bd ul>li[data-st="doing"]::before,.jr-ed ul>li[data-st="doing"]::before,.jr-commit ul>li[data-st="doing"]::before,.tl-note ul>li[data-st="doing"]::before{content:'◐';color:var(--edit)}

/* Rich-text simple table (Notion-style) */
/* The wrapper owns the width, as a share of the card, and the table fills it. An
   explicit width is what lets the table inside be a percentage at all — a
   shrink-to-fit inline-block asked to hold a width:100% child is circular — and it
   is what the last column handle drags. inline-block stays so two tables narrow
   enough to share a row do, and wrap onto the next when they don't. */
.rt-tw{overflow-x:auto;margin:10px 0;width:100%;display:inline-block;vertical-align:top}
/* Gap only between a pair you deliberately made, which is why both halves carry the
   class. Adjacency alone used to be enough, and adjacency happens by accident: drag a
   table to sit under another, or paste one beside one, and the second was shunted 10px
   right for no reason anybody asked for. A pair is now something you say, not something
   the DOM infers. */
.rt-tw.rt-pair + .rt-tw.rt-pair{margin-left:10px}
/* width:100% here as well as on .rt-fixed, so a table fits its card in the moment
   between being pasted in and rtEnsureCols giving it a colgroup. */
.rt-table{border-collapse:collapse;width:100%;font-size:13px;font-family:var(--font);table-layout:fixed}
/* A whole number of pixels, not 1.55 of 13px. Every other term in a table's height — the
   padding here, .rt-tw's margins, .pcard-bd's padding, the collapsed borders — is an integer,
   so that .15 was the only thing device-pixel snapping could round two ways, and two cards
   holding the same tables drifted a couple of pixels apart further down the column. */
.rt-table td{border:1px solid var(--border);padding:6px 9px;min-width:96px;max-width:320px;vertical-align:top;line-height:20px;word-wrap:break-word;outline:none}
/* Header row / header column are opt-in classes (rt-hopt marks a table as migrated) */
.rt-table.rt-hr tr:first-child td,.rt-table.rt-hc tr td:first-child{background:var(--surface2);font-weight:600}
.rt-table:not(.rt-hopt) tr:first-child td{background:var(--surface2);font-weight:600}
/* Position decides header-ness by default, which is wrong the moment a cell moves:
   split the first cell of a header column and only the left piece is :first-child
   any more. These two let a cell say what it is outright, in either direction. Two
   classes plus two elements matches the rule above — :first-child counts as a class,
   so the tr is needed to draw level — and they win on coming later rather than on a
   specificity trick. */
.rt-table.rt-hopt tr td.rt-hd{background:var(--surface2);font-weight:600}
.rt-table.rt-hopt tr td.rt-nohd{background:transparent;font-weight:400}
/* Per-column widths live in the colgroup as percentages, so "fits the card" is a
   property of the layout rather than something JS has to recompute on every resize.
   width:100% with table-layout:fixed means the columns divide the card and text
   wraps into taller rows instead of overflowing.

   The floor is the inline min-width rtNormalizeCols writes (one RT_MINW per column).
   While the card is wider than that, width:100% wins and the table fits exactly;
   once it isn't — six columns in the single-column phone layout — min-width wins and
   .rt-tw{overflow-x:auto} scrolls. That is the whole "shrink, then scroll" rule, in
   one declaration, correct at window sizes nobody thought to test. */
.rt-table.rt-fixed{width:100%;min-width:0;table-layout:fixed}
.rt-table.rt-fixed td{min-width:0;max-width:none}
/* Selected cells tint with an inset shadow rather than a background. The header
   rules above set `background` at a higher specificity, so a header cell simply
   never showed it was selected; a different property cannot be outranked, and the
   tint lays over whatever shade the cell already carries. */
.rt-table td.rt-sel{box-shadow:inset 0 0 0 999px rgba(59,130,246,.20)}
/* Floating table controls — rendered on <body>, never saved into card HTML */
#rt-ctl,#rt-tog-ctl{position:fixed;inset:0;pointer-events:none;z-index:900;display:none}
/* z-index over the "space" strip below, which is 14px tall and covers the 4px band the column
   grips sit in. Both are fixed and neither carried a z-index, so the one built later won every
   click and the grips could not be grabbed at all. Stated here rather than left to the order
   rtShowCtl happens to create them in. */
#rt-ctl .rt-btn,#rt-ctl .rt-grip,#rt-tog-ctl .rt-btn{position:fixed;pointer-events:auto;cursor:pointer;z-index:2}
#rt-tog-ctl .rt-btn,#rt-ctl .rt-btn{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text3);font-size:14px;line-height:1;box-shadow:var(--shadow-md)}
/* Invisible padding ring so the button is easy to hit and hard to slip off */
#rt-ctl .rt-btn::before{content:'';position:absolute;inset:-8px;border-radius:50%}
#rt-ctl .rt-btn:hover{color:var(--text1);background:var(--surface2)}
#rt-ctl .rt-grip{background:var(--border);border-radius:2px;opacity:.55;cursor:grab}
#rt-ctl .rt-grip:hover{opacity:1;background:#3B82F6}
#rt-ctl .rt-grip.rt-mv{opacity:1;background:#3B82F6;cursor:grabbing}
/* Column resize handles */
#rt-ctl .rt-rz{position:fixed;pointer-events:auto;cursor:col-resize;width:7px}
#rt-ctl .rt-rz::after{content:'';position:absolute;left:3px;top:0;bottom:0;width:1px;background:transparent}
#rt-ctl .rt-rz:hover::after,#rt-ctl .rt-rz.rt-rz-on::after{background:#3B82F6}
/* A boundary that a highlighted selection has armed. An ordinary handle is invisible until
   hovered, which is fine when the gesture is the obvious one — but "this drag moves only the
   rows you highlighted" is not something a tooltip can carry, and the whole feature reads as
   broken if you cannot tell it is on before you commit to the drag. So this one shows itself
   at rest and only brightens under the pointer. */
#rt-ctl .rt-rz.rt-rz-sel::after{background:#3B82F6;opacity:.5}
#rt-ctl .rt-rz.rt-rz-sel:hover::after,#rt-ctl .rt-rz.rt-rz-sel.rt-rz-hot::after,
#rt-ctl .rt-rz.rt-rz-sel.rt-rz-on::after{opacity:1;left:2px;width:2px}
/* Drop indicator while reordering a row/column */
#rt-ctl .rt-ins{position:fixed;background:#3B82F6;pointer-events:none;border-radius:1px}
/* Resize guides: alignment line, width badge, matched-column highlight */
#rt-ctl .rt-guide{position:fixed;pointer-events:none;width:0;border-left:1px dashed #3B82F6;opacity:.9}
/* Locked onto a boundary another row already has. Solid rather than dashed, and the full
   height of the table, so "this now lines up" reads at a glance instead of being measured. */
#rt-ctl .rt-guide-a{border-left-style:solid;opacity:1}
/* Somewhere this border could land. Quiet enough that several at once read as a backdrop
   rather than as a decision already made. */
#rt-ctl .rt-guide-c{opacity:.25}
#rt-ctl .rt-badge{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-md);border-radius:var(--r2);padding:3px 7px;font-family:var(--font);font-size:11px;line-height:1.45;color:var(--text1);white-space:nowrap;text-align:center}
#rt-ctl .rt-badge .rt-snap{display:block;color:#3B82F6;font-size:10px}
#rt-ctl .rt-menu .rt-sep{height:1px;background:var(--border);margin:4px 6px}
/* Table options menu (header row/column) */
#rt-ctl .rt-menu{position:fixed;pointer-events:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow-md);padding:4px;min-width:158px;font-family:var(--font)}
#rt-ctl .rt-menu .rt-item{padding:7px 10px;border-radius:calc(var(--r2) - 2px);font-size:13px;color:var(--text1);cursor:pointer;display:flex;align-items:center;gap:9px}
#rt-ctl .rt-menu .rt-item:hover{background:var(--surface2)}
#rt-ctl .rt-menu .rt-ck{color:#3B82F6;font-size:12px;width:13px;text-align:center}
/* A direction with nowhere to go stays in place, visibly unavailable, so the menu
   never reshuffles under the pointer. */
#rt-ctl .rt-menu .rt-item.rt-off{opacity:.35;cursor:default}
#rt-ctl .rt-menu .rt-item.rt-off:hover{background:none}
/* Four directions, or two sides to insert on, are one decision with several answers —
   so they get one row and one label, not one row each. The row itself is not clickable;
   the little buttons in it are. */
#rt-ctl .rt-menu .rt-item.rt-multi{cursor:default}
#rt-ctl .rt-menu .rt-item.rt-multi:hover{background:none}
#rt-ctl .rt-menu .rt-multi .rt-opts{margin-left:auto;display:flex;gap:2px}
#rt-ctl .rt-menu .rt-multi .rt-opt{width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);background:var(--surface);color:var(--text1);border-radius:calc(var(--r2) - 3px);
  font:inherit;font-size:12px;line-height:1;cursor:pointer;padding:0}
#rt-ctl .rt-menu .rt-multi .rt-opt:hover{background:var(--surface2)}
#rt-ctl .rt-menu .rt-multi .rt-opt[disabled]{opacity:.3;cursor:default}
#rt-ctl .rt-menu .rt-multi .rt-opt[disabled]:hover{background:var(--surface)}
/* Whole-block drag grip. A tall pill, not a circle: it sits right above the round
   ⋯ button and the two were indistinguishable when they shared a shape. */
/* Specificity has to match #rt-ctl .rt-btn above, or the round border-radius wins. */
#rt-ctl .rt-tgrip,#rt-tog-ctl .rt-tgrip{width:20px;height:20px;border-radius:6px;font-size:11px;cursor:grab;letter-spacing:-1px}
#rt-ctl .rt-tgrip::before,#rt-tog-ctl .rt-tgrip::before{border-radius:6px}
#rt-ctl .rt-tgrip:hover,#rt-tog-ctl .rt-tgrip:hover{color:var(--text1);background:var(--surface2);border-color:var(--text3)}
#rt-ctl .rt-tgrip:active,#rt-tog-ctl .rt-tgrip:active,
#rt-ctl .rt-tgrip.rt-mv,#rt-tog-ctl .rt-tgrip.rt-mv{cursor:grabbing;background:#3B82F6;color:#fff;border-color:#3B82F6}
/* Cell-selection toolbar: merge/unmerge/even-out, above the table it acts on */
#rt-ctl .rt-selbar{position:fixed;pointer-events:auto;display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow-md);padding:3px}
#rt-ctl .rt-selbtn{font-family:var(--font);font-size:11.5px;line-height:1;color:var(--text1);background:none;border:none;border-radius:calc(var(--r2) - 2px);padding:5px 8px;cursor:pointer;white-space:nowrap}
#rt-ctl .rt-selbtn:hover{background:var(--surface2)}
/* "Split into how many" popover. Borrows the ⋯ menu's shell so it looks like the rest
   of the table chrome, and only has to add the two number fields and the button. */
#rt-ctl .rt-splitpop{min-width:0;padding:7px}
#rt-ctl .rt-splitrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--text2);padding:3px 2px}
#rt-ctl .rt-splitrow input{width:52px;font-family:var(--font);font-size:12px;color:var(--text1);background:var(--surface2);border:1px solid var(--border);border-radius:calc(var(--r2) - 2px);padding:3px 5px;outline:none}
#rt-ctl .rt-splitrow input:focus{border-color:#3B82F6}
#rt-ctl .rt-splitgo{width:100%;margin-top:5px;background:#3B82F6;color:#fff;padding:5px 8px}
#rt-ctl .rt-splitgo:hover{background:#2f76e0}
/* "space" strip: the way to get a caret past a table that sits flush against the top or
   bottom of a card. Drawn on the overlay so it takes up no layout space, and invisible
   until pointed at — it only exists while the table's controls are up, so it is never
   hidden anywhere you aren't already looking. The label is the card's own 9px tracked
   eyebrow, the same one the weekday heads and the day label use, and the rule is a plain
   hairline: a dashed line was the only one in the app. */
#rt-ctl .rt-openln{position:fixed;pointer-events:auto;z-index:1;height:14px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);
  border-top:1px solid var(--border);cursor:text;opacity:0;transition:opacity .12s ease}
#rt-ctl .rt-openln:hover{opacity:1;color:var(--text2);border-top-color:var(--text3)}
/* Toggle block. Collapsing is this attribute and this one rule — the body stays in
   the document, so folding never costs you anything and the state saves itself. */
.rt-tog{margin:6px 0}
.rt-tog-h{display:flex;align-items:flex-start;gap:6px}
.rt-tog-c{flex:none;width:16px;height:20px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;color:var(--text3);font-size:9px;transition:transform .12s ease}
.rt-tog-c::before{content:'\25B6'}
.rt-tog-c:hover{color:var(--text1)}
.rt-tog[data-open="1"] > .rt-tog-h > .rt-tog-c{transform:rotate(90deg)}
.rt-tog-s{flex:1;min-width:0;font-weight:600}
.rt-tog-b{margin-left:22px;padding-left:8px;border-left:1px solid var(--border)}
.rt-tog[data-open="0"] > .rt-tog-b{display:none}

/* Canvas card. A box's position IS its content, so left/top/width live in the
   markup and serialize with everything else — no second store, no schema. All the
   chrome (drag strip, resize handles, guides, marquee) is drawn on #cv-ctl, so
   nothing here can ever reach what gets saved. */
.cvcard{position:relative;overflow:auto;padding:0}
.cv-surface{position:relative;min-height:100%;min-width:100%}
.cv-box{position:absolute;box-sizing:border-box;border:1px solid transparent;border-radius:var(--r2);
  padding:3px 5px;min-width:60px;min-height:24px}
.cv-box:hover{border-color:var(--border)}
.cv-box.cv-sel{border-color:var(--cvc,#3B82F6)}
.cv-bd{outline:none;min-height:18px;font-size:14px;line-height:1.55;color:var(--text1);word-wrap:break-word}
.cv-bd:empty::before{content:'Type…';color:var(--text3)}
/* The overlay. Same discipline as #rt-ctl: fixed, transparent to the pointer
   except where a control actually is. */
#cv-ctl{position:fixed;inset:0;pointer-events:none;z-index:900;display:none}
#cv-ctl .cv-hd{position:fixed;pointer-events:auto;height:12px;cursor:grab;border-radius:3px;
  background:var(--cvc,#3B82F6);opacity:.35}
#cv-ctl .cv-hd:hover{opacity:.8}
#cv-ctl .cv-hd.cv-on{opacity:.9;cursor:grabbing}
#cv-ctl .cv-rz{position:fixed;pointer-events:auto;background:transparent}
#cv-ctl .cv-rz.cv-c{width:10px;height:10px;border-radius:50%;background:var(--surface);
  border:1px solid var(--cvc,#3B82F6)}
/* 1px dashed, in the card's own accent, exactly on the edge that matched. */
#cv-ctl .cv-guide{position:fixed;pointer-events:none}
#cv-ctl .cv-guide.v{width:0;border-left:1px dashed var(--cvc,#3B82F6)}
#cv-ctl .cv-guide.h{height:0;border-top:1px dashed var(--cvc,#3B82F6)}
#cv-ctl .cv-marq{position:fixed;pointer-events:none;border:1px solid var(--cvc,#3B82F6);
  background:rgba(59,130,246,.10);border-radius:2px}
/* Slash command menu */
#rt-slash{position:fixed;z-index:1200;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow-md);padding:4px;min-width:184px;font-family:var(--font);display:none}
#rt-slash .rt-item{padding:7px 10px;border-radius:calc(var(--r2) - 2px);font-size:13px;color:var(--text1);cursor:pointer;display:flex;align-items:center;gap:9px}
#rt-slash .rt-item .rt-ico{color:var(--text3);font-size:12px;width:15px;text-align:center}
#rt-slash .rt-item.on{background:var(--surface2)}
#rt-slash .rt-empty{padding:8px 10px;font-size:12px;color:var(--text3)}
/* Richtext contenteditable */
.quote-ta{flex:1;background:none;border:none;outline:none;font-family:var(--font);font-size:13px;font-weight:400;color:var(--text1);line-height:20px;word-break:break-word;min-height:1.4em}
.quote-ta[contenteditable=true]:empty::before{content:attr(data-placeholder);color:var(--text3);pointer-events:none}

/* ── Annual ── */
.annual-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.mo-card{border:1px solid var(--border);border-radius:var(--r2);padding:13px 15px;cursor:pointer;transition:all .12s;background:var(--surface)}
.mo-card:hover{border-color:var(--text3);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.mo-card.cur{border-color:var(--accent);background:var(--today-bg)}
.mo-name{font-size:13px;font-weight:600;margin-bottom:8px}
.mo-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:5px}
.mo-fill{height:100%;border-radius:2px}
.mo-stat{font-size:10px;color:var(--text3)}

/* ── Edit controls ── */
.arch-btn{display:none;background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:0 2px;line-height:1;opacity:.6;flex-shrink:0}
.edit-mode .arch-btn{display:inline}
.arch-btn:hover{color:var(--text1);opacity:1}
.del-btn{display:none;background:none;border:none;cursor:pointer;color:#EF4444;font-size:13px;padding:0 2px;line-height:1;opacity:.55;flex-shrink:0}
.edit-mode .del-btn{display:inline}
.del-btn:hover{opacity:1}
.clr-btn{display:none;background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;padding:0 2px;line-height:1;opacity:.55;flex-shrink:0;}
.edit-mode .clr-btn{display:inline}
.clr-btn:hover{color:#EF4444;opacity:1;}
.arch-panel{margin:8px 12px 4px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r2);}
.arch-panel-title{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.arch-item{display:flex;align-items:center;gap:6px;padding:4px 2px;border-bottom:1px solid var(--border2);}
.arch-item:last-child{border-bottom:none;}
.arch-item-name{flex:1;color:var(--text3);text-decoration:line-through;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.arch-item-grp{font-size:10px;color:var(--text3);flex-shrink:0;}
.restore-btn{font-size:9px;padding:1px 6px;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap;font-family:var(--font);}
.restore-btn:hover{background:var(--border);}
.purge-btn{font-size:9px;padding:1px 6px;border-radius:3px;border:1px solid #FCA5A5;background:transparent;color:#EF4444;cursor:pointer;white-space:nowrap;font-family:var(--font);}
.purge-btn:hover{background:#FEF2F2;}
.add-hbt-btn{display:none;background:none;border:1px dashed var(--border);border-radius:var(--r2);padding:3px 9px;font-size:10px;color:var(--text3);cursor:pointer;font-family:var(--font);white-space:nowrap}
.edit-mode .add-hbt-btn{display:inline-flex;align-items:center;gap:3px}
.add-hbt-btn:hover{border-color:var(--text2);color:var(--text2)}
.color-dot-btn{display:none;width:12px;height:12px;border-radius:50%;border:2px solid rgba(0,0,0,.12);cursor:pointer;padding:0;flex-shrink:0}
.edit-mode .color-dot-btn{display:block}
.grade-tip{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:7px 10px;box-shadow:var(--shadow-md);z-index:1000;font-size:11px;pointer-events:none;white-space:nowrap}
.color-popup{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:8px;box-shadow:var(--shadow-md);z-index:1000;display:flex;flex-wrap:wrap;gap:5px;width:112px}
.csw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .1s}
.csw:hover{border-color:var(--text1)}
.chart-color-dot{width:11px;height:11px;border-radius:50%;cursor:pointer;display:inline-block;border:1.5px solid var(--border);flex-shrink:0;transition:border-color .15s;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.chart-color-dot:hover{border-color:var(--text2)}

/* ── Edit mode input states ── */
.edit-mode .grp-name-in,.edit-mode .hbt-in,.edit-mode .goal-in{cursor:text;border-radius:3px}
.edit-mode .grp-name-in{max-width:160px;min-width:50px}
.edit-mode .grp-name-in:focus,.edit-mode .hbt-in:focus,.edit-mode .goal-in:focus{background:#FFFBEB;outline:1px solid #FDE68A}

/* ── Start date pill ── */
.sd-pill{position:relative;display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:10px;font-weight:500;color:var(--text3);cursor:pointer;white-space:nowrap;font-family:var(--font);user-select:none;transition:border-color .12s,color .12s,background .12s;flex-shrink:0}
.sd-pill:hover{border-color:var(--accent);color:var(--accent);background:var(--today-bg)}
.sd-pill input[type="date"]{position:absolute;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;border:none;padding:0;margin:0}

/* ── Horizontal layout ── */
.hz-day-th{text-align:center;padding:5px 3px;font-size:11px;font-weight:600;color:var(--text2);white-space:nowrap;vertical-align:bottom}
.hz-day-th .hd-num{font-size:14px;font-weight:700;display:block;line-height:1.2}
.hz-day-th .hd-dow{font-size:10px;color:var(--text3);font-weight:500;display:block}
.hz-day-th.today-col{background:var(--today-bg)}
.hz-day-th.today-col .hd-num{color:var(--accent)}
.hz-habit-td{text-align:left;padding:7px 10px 7px 12px;border-right:2px solid var(--border) !important;white-space:normal;overflow-wrap:break-word;background:var(--surface)}
.hz-habit-name{font-size:13px;font-weight:500;color:var(--text2);line-height:1.25}
.hz-habit-grp{font-size:10px;color:var(--text3)}
.hz-chk-c{text-align:center;padding:5px 3px;cursor:pointer;user-select:none}
.hz-chk-c:hover{background:var(--border2)}
.hz-chk-c.today-col{background:var(--today-bg)}
.hz-chk-c.today-col:hover{background:#DBEAFE}
.hz-chk-c.future{opacity:.3;cursor:default;pointer-events:none}
.hz-row{transition:background .08s}
.hz-row:hover .hz-habit-td{background:var(--surface2)}
.hz-grp-row{height:30px;padding:0 14px;background:var(--surface2) !important;border-top:2px solid var(--border) !important;border-bottom:2px solid var(--border) !important}
.hz-chart-corner{text-align:left;padding:8px 14px;vertical-align:bottom;border-right:2px solid var(--border) !important;background:var(--surface)}
.hz-chart-corner-lbl{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.hz-chart-td{padding:0;vertical-align:bottom;border-bottom:2px solid var(--border) !important}
.hz-sum-th{width:64px;min-width:64px;text-align:center;padding:6px 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);border-bottom:2px solid var(--border)}
.hz-sum-td{width:64px;min-width:64px;text-align:center;padding:6px 8px;font-size:13px;font-weight:500;color:var(--text2)}
.hz-sum-td.first-sum{border-left:2px solid var(--border) !important}
.hz-sum-th.first-sum{border-left:2px solid var(--border) !important}
.hz-week-sep{border-left:1px dashed var(--border) !important}

/* ── Week labels (shared style) ── */
.week-lbl-text{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
/* Vertical: separator rows in tbody */
.week-sep-r td{background:var(--surface2) !important;border-top:1px solid var(--border) !important;border-bottom:1px solid var(--border2) !important}
.week-sep-r .sl{background:var(--surface2) !important}
.week-sep-day{padding:3px 14px;white-space:nowrap;cursor:default}
.wk-badge{display:inline-flex;align-items:center;margin-left:8px;font-size:9px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:9px;vertical-align:middle;opacity:0;transition:opacity .15s,transform .15s;transform:translateX(-4px);pointer-events:none;user-select:none}
.week-sep-r:hover .wk-badge,.hz-week-hdr-th:hover .wk-badge{opacity:1;transform:translateX(0)}
/* Horizontal: week header row in thead */
.hz-week-hdr-th{text-align:center;padding:3px 4px;background:var(--surface2);border-bottom:1px solid var(--border2);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);white-space:nowrap}
.hz-week-hdr-th.first-week{border-left:none}
.hz-week-hdr-th.week-start-sep{border-left:1px solid var(--border)}

/* ── Horizontal: no-scroll fixed layout ── */
#hz-tbl{width:100%;min-width:unset;table-layout:fixed}
/* Fathom table uses the same layout so its columns align with the Habits table + chart */
#fathom-tbl{width:100%;min-width:unset;table-layout:fixed}
/* ── Grid fade-in on render ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.grid-card{animation:fadeIn .18s ease}

/* ── Drag & Drop ── */
.dnd-drag{opacity:.2;cursor:grabbing !important}
.dnd-grip{color:var(--border);cursor:grab;font-size:13px;line-height:1;padding:0 1px;flex-shrink:0;user-select:none;transition:color .1s}
.dnd-grip:hover{color:var(--text3)}
.dnd-ins-l{box-shadow:inset 3px 0 0 var(--accent) !important}
.dnd-ins-r{box-shadow:inset -3px 0 0 var(--accent) !important}
tr.dnd-ins-t>td,tr.dnd-ins-t>th{box-shadow:inset 0 3px 0 var(--accent) !important}
tr.dnd-ins-b>td,tr.dnd-ins-b>th{box-shadow:inset 0 -3px 0 var(--accent) !important}

/* ── Multi-select ── */
.chk-c.sel,.hz-chk-c.sel{background:rgba(59,130,246,.13)!important;position:relative}
.chk-c.sel .sl,.hz-chk-c.sel .sl{background:rgba(59,130,246,.13)!important}
.chk-c.sel .chk-box,.hz-chk-c.sel .chk-box{outline:2px solid var(--accent);outline-offset:1px}
html.dark .chk-c.sel,html.dark .hz-chk-c.sel{background:rgba(59,130,246,.18)!important}
.chk-c.has-comment,.hz-chk-c.has-comment{position:relative}
.chk-c.has-comment::after,.hz-chk-c.has-comment::after{content:'';position:absolute;top:2px;right:2px;width:0;height:0;border-top:6px solid var(--accent);border-right:6px solid var(--accent);border-bottom:6px solid transparent;border-left:6px solid transparent;border-top-right-radius:2px;pointer-events:none;opacity:.85}
#sel-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text1);color:var(--bg);padding:8px 18px;border-radius:20px;font-size:12px;font-weight:500;display:none;align-items:center;gap:12px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none}
#sel-bar .sel-hint{opacity:.55;font-weight:400}
#edit-bar{position:fixed;bottom:24px;right:24px;background:var(--text1);color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;display:none;align-items:center;gap:8px;z-index:9998;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;user-select:none;white-space:nowrap}
#edit-bar:hover{background:#333}
#arch-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text1);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:12px;font-weight:500;display:none;align-items:center;gap:10px;z-index:9997;box-shadow:0 4px 16px rgba(0,0,0,.25);white-space:nowrap}
#arch-toast button{background:rgba(255,255,255,.18);border:none;color:inherit;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;cursor:pointer;font-family:var(--font)}
#arch-toast button:hover{background:rgba(255,255,255,.3)}

/* ── Misc ── */
.empty-state{text-align:center;padding:48px 24px;color:var(--text3)}
.empty-state p{margin-top:8px;font-size:13px}
.hidden{display:none!important}
/* TIDE summary card */
.notes-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}

/* ── Touch: apply to all devices ── */
button,.btn,.nav-btn,.chk-c,.hz-chk-c,.mo-card{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.chk-c,.hz-chk-c{-webkit-user-select:none;user-select:none}
.grid-scroll{-webkit-overflow-scrolling:touch}
/* Responsive label helpers */
.mob-hide{display:inline}.mob-show{display:none}
.tb-arc{touch-action:none}

@media(max-width:900px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .annual-grid{grid-template-columns:repeat(3,1fr)}
}

/* ── Mobile (≤768px) ── */
@media(max-width:768px){
  .mob-hide{display:none}.mob-show{display:inline}

  #app{padding:12px 10px 40px;padding-bottom:max(40px,env(safe-area-inset-bottom,40px))}

  /* Header */
  .hdr{flex-direction:column;align-items:stretch;gap:6px;margin-bottom:12px}
  .hdr-l{justify-content:space-between;flex-wrap:nowrap;gap:8px}
  .hdr-r{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
  .app-logo{font-size:21px}
  .month-lbl{min-width:0;font-size:13px}
  .month-nav{padding:4px 10px}
  .nav-btn{padding:4px 12px;font-size:20px}
  .btn{padding:6px 10px;font-size:11px;min-height:34px}

  /* Quote / Priority */
  .quote-card{padding:8px 12px;margin-bottom:0;font-size:12px}
  .priority-card,.notes-card{padding:8px 12px;min-height:0}
  .top-row{flex-direction:column;gap:6px;margin-bottom:10px}
  .top-left-col{width:100%}
  .top-row .intention-card,.top-row .quote-card,.top-row .priority-card,.top-row .notes-card{width:100%}

  /* Stats */
  .stats-row{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
  .stat{padding:10px 12px}
  .stat-lbl{font-size:9px;margin-bottom:3px}
  .stat-val{font-size:20px}
  .stat-sub{font-size:10px;margin-top:2px}

  /* Chart */
  .chart-wrap{height:130px}
  .chart-card{padding:12px 14px;margin-bottom:10px}
  .card-title{margin-bottom:8px}

  /* Tighter day columns in tables */
  .hz-day-th{min-width:26px;padding:3px 0px}
  .chk-c{padding:4px 2px}
  .hz-chk-c{padding:4px 1px}

  /* Grid */
  .grid-card{margin-bottom:10px}
  /* pan-y: browser owns vertical (page scroll); horizontal is unclaimed so pointer capture JS drives it */
  #fathom-scroll,#hz-scroll{
    overflow-x:scroll;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
  }
  /* Larger touch targets for checkboxes */
  .chk-box{width:30px;height:30px;border-radius:7px}
  .chk-c{padding:5px 4px}
  .hz-chk-c{padding:5px 2px}
  .hz-day-th{min-width:30px;padding:4px 1px}
  /* Both tables: fixed layout so colgroup widths are respected; JS sets explicit minWidth */
  #hz-tbl,#fathom-tbl{table-layout:fixed;width:auto}
  /* Disable sticky columns on mobile — they confuse Android scroll width calculation */
  #hz-tbl .sl,#hz-tbl .sr,#hz-tbl .sr-1,#hz-tbl .sr-2,
  #fathom-tbl .sl,#fathom-tbl .sr,#fathom-tbl .sr-1,#fathom-tbl .sr-2{
    position:relative!important;right:unset!important;left:unset!important
  }

  /* TIDE notes card */
  .notes-card{padding:14px 16px}

  /* Year grid */
  .annual-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .qtr-grid{grid-template-columns:repeat(2,1fr) !important}

  /* Clock card spans full width on mobile */
  .tb-clock-stat{grid-column:1/-1;display:flex;justify-content:center}
  /* Time block modal fits narrow screens */
  #tb-overlay>div{max-width:calc(100vw - 32px)!important;width:100%!important}
  /* Selection bar: above iOS home bar */
  #sel-bar{bottom:max(20px,env(safe-area-inset-bottom,20px))}
  #edit-bar{bottom:max(20px,env(safe-area-inset-bottom,20px));right:16px}
  #arch-toast{bottom:max(20px,env(safe-area-inset-bottom,20px))}
}

/* ── Small phones (≤480px) ── */
@media(max-width:480px){
  #app{padding:8px 6px 36px}
  .hdr-r{gap:4px}
  .month-lbl{font-size:12px}
  .stats-row{grid-template-columns:1fr 1fr;gap:6px}
  .stat{padding:10px 12px}
  .stat-val{font-size:20px}
  .annual-grid{grid-template-columns:repeat(2,1fr)}
  .chk-box{width:28px;height:28px}
  .notes-card{padding:12px 14px}
}

/* ── Checkbox (no innerHTML swap → no table jitter) ── */
.chk-c{overflow:hidden}
.chk-box.checked::after{content:'✓'}
.chk-box.skipped{background:transparent!important;border-color:var(--border2)!important;overflow:hidden}
.chk-box.skipped::after{content:'';position:absolute;width:141%;height:1.5px;background:var(--border);top:50%;left:-20%;transform:rotate(-45deg)}
.chk-box{position:relative}
.chk-box.freq-off{opacity:0.12;background:transparent!important;border-color:var(--border2)!important;}
.freq-off-c{pointer-events:none!important;cursor:default!important;}
.chk-box.before-start{opacity:0.35;}
.freq-day-btn{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border);background:transparent;font-size:9px;cursor:pointer;color:var(--text3);padding:0;line-height:1;text-align:center;font-weight:600;transition:all .1s;flex-shrink:0;}
.freq-day-btn.freq-on{background:var(--text1);border-color:var(--text1);color:var(--bg);}
.freq-day-btn.freq-on-fathom{background:#6B7FA8;border-color:#6B7FA8;color:#fff;}

/* ── Dark Mode ── */
html.dark{
  --bg:#0A0A0C;--surface:#111113;--surface2:#1A1A1E;
  --border:#2E2E33;--border2:#232328;
  --text1:#EDEDEE;--text2:#8E8EA0;--text3:#5C5C70;
  --grade:#6BBDB0;
  --accent:#3B82F6;--today-bg:#0D1B35;--today-border:#1D3461;
  --edit:#5FAF9E;--edit-soft:#12211F;--edit-line:#4B5563;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 8px rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.5);
}
html.dark .btn-on{background:#1e1b4b;color:#818cf8;border-color:#3730a3}
html.dark .btn-pri{background:#EDEDEE;color:#0A0A0C;border-color:#EDEDEE}
html.dark .edit-mode .grp-name-in:focus,
html.dark .edit-mode .hbt-in:focus,
html.dark .edit-mode .goal-in:focus{background:#1c1003;outline:1px solid #92400e}
html.dark .dnd-grip{color:var(--border2)}
html.dark .dnd-grip:hover{color:var(--text2)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sel-bar"><span id="sel-count"></span><span class="sel-hint">Space to cycle &nbsp;·&nbsp; Esc to clear</span></div>
<div id="edit-bar" onclick="_exitCurrentEditMode()">✎ Editing · ✓ Done</div>
<div id="arch-toast"><span id="arch-toast-msg">Lever archived</span><button onclick="_toastUndo()">Undo</button></div>

<script>
// ─────────────────────────────────────────
//  CONSTANTS
